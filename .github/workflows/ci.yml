name: BodyCast CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bodycast_test
          POSTGRES_USER: bodycast_test
          POSTGRES_PASSWORD: integration_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bodycast_test -d bodycast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bodycast_test:integration_test_password@localhost:5432/bodycast_test
      IOS_SHORTCUT_API_KEY: integration-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests and coverage
        run: npm run test:coverage

      - name: Apply test database migrations
        run: npm run prisma:migrate:deploy

      - name: PostgreSQL integration tests
        run: npm run test:integration

      - name: Next.js production build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Validate production Compose
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

      - name: Build production Docker image
        run: docker build --target production --tag bodycast-app:ci .

  deploy:
    name: Deploy to production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: bodycast-production
      cancel-in-progress: false

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_HOST: ${{ secrets.APP_HOST }}
          CADDY_ROUTES_PATH: ${{ secrets.CADDY_ROUTES_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 25m
          envs: DEPLOY_PATH,APP_HOST,CADDY_ROUTES_PATH
          script: |
            set -Eeuo pipefail
            cd "$DEPLOY_PATH"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            APP_HOST="$APP_HOST" CADDY_ROUTES_PATH="$CADDY_ROUTES_PATH" bash scripts/deploy.sh
