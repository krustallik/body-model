name: BodyCast CI/CD

# Full quality gates on every PR update and on every push/merge to main.
# Feature-branch pushes without an open PR do not start this workflow.
# A successful current-main run triggers a separate automatic, migration-free
# production app deploy; schema migrations remain separately owner-authorized.
# This CI workflow never performs production migrations or holds production secrets.
# This workflow must never hold production secrets or deploy credentials.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bodycast_stage01_test:integration_test_password@localhost:5432/bodycast_training_history_stage01_test
      IOS_SHORTCUT_API_KEY: integration-test-secret
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validation smokes (workout v6 / initialization / target solver)
        run: |
          npm run validate:workout-activity-v6:smoke
          npm run validate:initialization:smoke
          npm run validate:target-solver:smoke

  unit:
    name: Unit shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bodycast_stage01_test:integration_test_password@localhost:5432/bodycast_training_history_stage01_test
      IOS_SHORTCUT_API_KEY: integration-test-secret
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Unit tests and shard coverage
        run: >-
          npx vitest run
          --coverage.enabled
          --coverage.thresholds.lines=0
          --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.statements=0
          --reporter=dot
          --reporter=blob
          --shard=${{ matrix.shard }}/2

      - name: Upload Vitest shard report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-unit-shard-${{ matrix.shard }}
          path: .vitest-reports/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  unit_coverage_merge:
    name: Unit coverage merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - unit
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bodycast_stage01_test:integration_test_password@localhost:5432/bodycast_training_history_stage01_test
      IOS_SHORTCUT_API_KEY: integration-test-secret
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Download all Vitest shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-unit-shard-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge reports and enforce combined coverage thresholds
        run: npx vitest run --merge-reports --coverage

  postgres_integration:
    name: PostgreSQL integration shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            testArgs: "--shard=1/2 --testNamePattern='^(?!.*(?:completes Training edits through Health coordination, stale-worker fencing, and restart recovery|rebuilds and clears an acknowledged legacy Stepper block only after stable publication)).*$'"
          - shard: 2
            testArgs: "--shard=2/2 --testNamePattern='^(?!.*(?:completes Training edits through Health coordination, stale-worker fencing, and restart recovery|rebuilds and clears an acknowledged legacy Stepper block only after stable publication)).*$'"
          - shard: 3
            testArgs: "tests/integration/health-sync.integration.test.ts --testNamePattern='completes Training edits through Health coordination, stale-worker fencing, and restart recovery'"
          - shard: 4
            testArgs: "tests/integration/health-sync.integration.test.ts --testNamePattern='rebuilds and clears an acknowledged legacy Stepper block only after stable publication'"
          - shard: 5
            testArgs: "tests/integration/health-sync.integration.test.ts --testNamePattern='runs the 30-day HealthSyncAudit cleanup at app startup and races concurrent cleanup safely'"
    services:
      postgres:
        image: docker.io/library/postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: bodycast_training_history_stage01_test
          POSTGRES_USER: bodycast_stage01_test
          POSTGRES_PASSWORD: integration_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bodycast_stage01_test -d bodycast_training_history_stage01_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bodycast_stage01_test:integration_test_password@localhost:5432/bodycast_training_history_stage01_test
      IOS_SHORTCUT_API_KEY: integration-test-secret
      BODYCAST_STAGE01_MODE: test
      BODYCAST_GLYCOGEN_TEST_DATABASE_URL: postgresql://bodycast_stage01_test:integration_test_password@localhost:5432/bodycast_training_history_stage01_test
      BODYCAST_RECOVERY_TEST_DATABASE_URL: postgresql://bodycast_stage01_test:integration_test_password@localhost:5432/bodycast_training_history_stage01_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply test database migrations
        run: npm run prisma:migrate:deploy

      - name: Verify a fresh empty database matches the exact migration tree
        run: node scripts/production-empty-install-ledger.mjs --test

      - name: PostgreSQL integration tests
        run: npm run test:integration -- ${{ matrix.testArgs }}

  next-build:
    name: Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bodycast_stage01_test:integration_test_password@localhost:5432/bodycast_training_history_stage01_test
      IOS_SHORTCUT_API_KEY: integration-test-secret
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Next.js production build
        env:
          NODE_ENV: production
        run: npm run build

  container:
    name: Compose and Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Validate production Compose
        run: |
          cp .env.production.example .env
          docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

      - name: Build production Docker image
        run: docker build --target production --tag bodycast-app:ci .

  ci:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - quality
      - unit
      - unit_coverage_merge
      - postgres_integration
      - next-build
      - container
    if: ${{ always() }}
    steps:
      - name: Require every CI gate to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          UNIT_COVERAGE_RESULT: ${{ needs.unit_coverage_merge.result }}
          POSTGRES_RESULT: ${{ needs.postgres_integration.result }}
          BUILD_RESULT: ${{ needs.next-build.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          set -Eeuo pipefail
          for result in "$QUALITY_RESULT" "$UNIT_RESULT" "$UNIT_COVERAGE_RESULT" "$POSTGRES_RESULT" "$BUILD_RESULT" "$CONTAINER_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required CI gate did not succeed (result: $result)."
              exit 1
            fi
          done
          echo "All required CI gates succeeded."
