name: Production app deploy
run-name: Deploy ${{ github.event.workflow_run.head_sha || inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: Type deploy for schema cutover, or initialize-empty-bodycast-db for a clean new VPS
        required: true
        type: string
      commit_sha:
        description: Full 40-character current main SHA
        required: true
        type: string
      non_serving_deploy:
        description: Keep traffic in maintenance for a schema cutover; select false only with fresh_empty_install
        required: true
        default: true
        type: boolean
      fresh_empty_install:
        description: One-time bootstrap of a new VPS with no BodyCast containers, volume, marker, or runtime environment
        required: true
        default: false
        type: boolean
      serve_recovered_v4:
        description: Serve the exact current app only after a completed no-app V4 recovery; deployment remains behind maintenance until the atomic currentness fence commits
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: bodycast-production-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact current-main app deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      candidate_sha: ${{ steps.gate.outputs.candidate_sha }}
      reason: ${{ steps.gate.outputs.reason }}
      ci_run_url: ${{ steps.gate.outputs.ci_run_url }}
      deploy_mode: ${{ steps.gate.outputs.deploy_mode }}
    steps:
      - name: Checkout main gate helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify triggering CI or owner dispatch and current main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.commit_sha }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
          CONFIRMATION: ${{ inputs.confirm_production_deploy }}
          NON_SERVING: ${{ inputs.non_serving_deploy }}
          FRESH_EMPTY_INSTALL: ${{ inputs.fresh_empty_install }}
          SERVE_RECOVERED_V4: ${{ inputs.serve_recovered_v4 }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_EVENT_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -Eeuo pipefail
          [[ "$REPOSITORY" == "krustallik/body-model" && "$REF" == "refs/heads/main" ]] || {
            echo "::error::Production deploy must run from the canonical repository and main branch."; exit 1;
          }
          gh api "repos/krustallik/body-model/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/current-deploy-run.json"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          MAIN_TIP="$(gh api repos/krustallik/body-model/commits/main --jq .sha)"
          [[ "$MAIN_TIP" == "$(git rev-parse refs/remotes/origin/main)" ]] || { echo "::error::GitHub and fetched canonical main tips disagree."; exit 1; }
          CI_RUN_URL=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$DISPATCH_ACTOR_ID" == "126446430" ]] || { echo "::error::Only the pinned BodyCast owner may use manual deploy."; exit 1; }
            if [[ "$FRESH_EMPTY_INSTALL" == "true" && "$SERVE_RECOVERED_V4" == "true" ]]; then
              echo "::error::Fresh install and recovered-V4 serving are mutually exclusive."; exit 1
            elif [[ "$SERVE_RECOVERED_V4" == "true" ]]; then
              [[ "$CONFIRMATION" == "serve-after-current-v4-recovery" && "$NON_SERVING" == "false" ]] || {
                echo "::error::Recovered-V4 serving requires its distinct confirmation and serving mode."; exit 1;
              }
              MODE="recovered-v4-serving"
            elif [[ "$FRESH_EMPTY_INSTALL" == "true" ]]; then
              [[ "$CONFIRMATION" == "initialize-empty-bodycast-db" && "$NON_SERVING" == "false" ]] || {
                echo "::error::Fresh empty-host install requires its distinct confirmation and serving mode."; exit 1;
              }
              MODE="fresh-empty-install"
            else
              [[ "$CONFIRMATION" == "deploy" && "$NON_SERVING" == "true" ]] || {
                echo "::error::Manual schema-cutover deploy requires confirmation and non-serving mode."; exit 1;
              }
              MODE="non-serving"
            fi
            node --input-type=module - "$RUNNER_TEMP/current-deploy-run.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { assertTrustedOwnerWorkflowRun } from "./scripts/github-owner-identity.mjs";
          assertTrustedOwnerWorkflowRun(JSON.parse(readFileSync(process.argv[2], "utf8")), {
            actorId: process.env.DISPATCH_ACTOR_ID,
            workflowPath: ".github/workflows/deploy-production.yml",
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            ref: "refs/heads/main",
            sha: process.env.RUN_SHA,
            requireInProgress: true,
          });
          NODE
            CANDIDATE="$DISPATCH_SHA"
            [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ && "$CANDIDATE" == "$MAIN_TIP" && "$RUN_SHA" == "$MAIN_TIP" ]] || {
              echo "::error::Manual deploy candidate, workflow checkout, and canonical main must be the same exact SHA."; exit 1;
            }
            gh api --paginate --jq '.workflow_runs[] | @json' \
              "repos/krustallik/body-model/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" > "$RUNNER_TEMP/ci-runs.jsonl"
            CI_RUN_URL="$(CANDIDATE="$CANDIDATE" node --input-type=module - "$RUNNER_TEMP/ci-runs.jsonl" <<'NODE'
          import { readFileSync } from "node:fs";
          const candidate = process.env.CANDIDATE;
          const runs = readFileSync(process.argv[2], "utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse)
            .filter((run) => run.head_sha === candidate && run.head_branch === "main" && run.event === "push"
              && run.path?.split("@")[0] === ".github/workflows/ci.yml");
          runs.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || b.run_attempt - a.run_attempt);
          const latest = runs[0];
          if (!latest || latest.status !== "completed" || latest.conclusion !== "success") {
            throw new Error("Latest BodyCast CI/CD run for the exact current main SHA is not successful.");
          }
          process.stdout.write(latest.html_url);
          NODE
            )"
            [[ -n "$CI_RUN_URL" ]] || { echo "::error::Exact current main SHA has no successful BodyCast CI/CD push run."; exit 1; }
          elif [[ "$EVENT_NAME" == "workflow_run" ]]; then
            [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Completed CI run ID is missing or invalid."; exit 1; }
            gh api "repos/krustallik/body-model/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-ci-run.json"
            gh api repos/krustallik/body-model/actions/workflows/ci.yml > "$RUNNER_TEMP/ci-workflow.json"
            SOURCE_RUN_JSON="$RUNNER_TEMP/source-ci-run.json" CI_WORKFLOW_JSON="$RUNNER_TEMP/ci-workflow.json" \
              CURRENT_RUN_JSON="$RUNNER_TEMP/current-deploy-run.json" REPO="$REPOSITORY" MAIN_TIP="$MAIN_TIP" \
              EVENT_RUN_ID="$SOURCE_RUN_ID" EVENT_RUN_ATTEMPT="$SOURCE_EVENT_ATTEMPT" RUN_SHA="$RUN_SHA" \
              CURRENT_RUN_ID="$GITHUB_RUN_ID" CURRENT_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              node --experimental-strip-types --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          import { evaluateProductionDeployGate } from "./scripts/ci/production-deploy-gate.ts";
          const read = (name) => JSON.parse(readFileSync(process.env[name], "utf8"));
          const source = read("SOURCE_RUN_JSON");
          const current = read("CURRENT_RUN_JSON");
          const ciWorkflow = read("CI_WORKFLOW_JSON");
          if (ciWorkflow.path !== ".github/workflows/ci.yml") throw new Error("Canonical CI workflow path changed.");
          const result = evaluateProductionDeployGate({
            eventName: process.env.EVENT_NAME,
            repositoryFullName: process.env.REPO,
            mainTipSha: process.env.MAIN_TIP,
            candidateSha: "",
            currentWorkflowRun: current,
            currentWorkflowRunId: process.env.CURRENT_RUN_ID,
            currentWorkflowRunAttempt: process.env.CURRENT_RUN_ATTEMPT,
            currentWorkflowRunSha: process.env.RUN_SHA,
            workflowRunEventId: process.env.EVENT_RUN_ID,
            workflowRunEventAttempt: process.env.EVENT_RUN_ATTEMPT || null,
            sourceWorkflowRun: source,
            expectedCiWorkflowId: ciWorkflow.id,
          });
          if (result.decision === "block") throw new Error(result.reason);
          appendFileSync(process.env.GITHUB_OUTPUT, `decision=${result.decision}\ncandidate_sha=${result.candidateSha ?? ""}\nreason=${result.reason}\n`);
          console.log(JSON.stringify(result, null, 2));
          NODE
            CANDIDATE="$(node -e 'const run=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); process.stdout.write(run.head_sha)' "$RUNNER_TEMP/source-ci-run.json")"
            CI_RUN_URL="$(node -e 'const run=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); process.stdout.write(run.html_url)' "$RUNNER_TEMP/source-ci-run.json")"
            MODE="serving"
          else
            echo "::error::Unsupported production deploy trigger."; exit 1
          fi
          [[ "$RUN_SHA" == "$MAIN_TIP" ]] || { echo "::error::Deploy workflow source is not current main."; exit 1; }
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            REPO="$REPOSITORY" EVENT_NAME="$EVENT_NAME" MAIN_TIP="$MAIN_TIP" CANDIDATE="$CANDIDATE" \
              CONFIRMATION="$CONFIRMATION" NON_SERVING="$NON_SERVING" FRESH_EMPTY_INSTALL="$FRESH_EMPTY_INSTALL" \
              SERVE_RECOVERED_V4="$SERVE_RECOVERED_V4" node --experimental-strip-types --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import { evaluateProductionDeployGate } from "./scripts/ci/production-deploy-gate.ts";
          const result = evaluateProductionDeployGate({ eventName: process.env.EVENT_NAME, repositoryFullName: process.env.REPO,
            mainTipSha: process.env.MAIN_TIP, candidateSha: process.env.CANDIDATE,
            dispatchConfirm: process.env.CONFIRMATION, nonServingDeploy: process.env.NON_SERVING === "true",
            freshEmptyInstall: process.env.FRESH_EMPTY_INSTALL === "true",
            recoveredV4Serve: process.env.SERVE_RECOVERED_V4 === "true" });
          const expectedMode = process.env.SERVE_RECOVERED_V4 === "true" ? "recovered-v4-serving"
            : process.env.FRESH_EMPTY_INSTALL === "true" ? "fresh-empty-install" : "non-serving";
          if (result.decision !== "deploy" || result.mode !== expectedMode) throw new Error(result.reason);
          appendFileSync(process.env.GITHUB_OUTPUT, `decision=deploy\ncandidate_sha=${result.candidateSha}\nreason=${result.reason}\n`);
          console.log(JSON.stringify(result, null, 2));
          NODE
          fi
          DECISION="$(grep '^decision=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)"
          if [[ "$DECISION" == "skip" ]]; then
            echo "A newer main SHA superseded this completed CI run; no production job will start." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "deploy_mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "ci_run_url=$CI_RUN_URL" >> "$GITHUB_OUTPUT"
          echo "## Production app deploy authorization" >> "$GITHUB_STEP_SUMMARY"
          echo "- exact SHA: `$CANDIDATE`" >> "$GITHUB_STEP_SUMMARY"
          echo "- current-main CI: $CI_RUN_URL" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$MODE" == "serving" ]]; then
            echo "- mode: automatic ordinary migration-free deploy after successful current-main CI" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$MODE" == "fresh-empty-install" ]]; then
            echo "- mode: owner-authorized one-time empty-host bootstrap; applies the exact release migration tree only after proving the new VPS has no BodyCast DB container, volume, marker, or runtime environment" >> "$GITHUB_STEP_SUMMARY"
            echo "- V4: remains not initialized until real profile/source inputs exist; no currentness claim is made" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$MODE" == "recovered-v4-serving" ]]; then
            echo "- mode: separately confirmed exact-SHA serving after a completed no-app V4 recovery; candidate starts behind verified maintenance and traffic commits only under the PostgreSQL currentness fence" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- mode: owner-authorized non-serving schema-cutover deploy; traffic remains in maintenance" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy exact current-main SHA
    needs: authorize
    if: needs.authorize.outputs.decision == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - name: Checkout exact current main tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.authorize.outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify externally pinned V4 handoff verifier
        env:
          DEPLOY_SHA: ${{ needs.authorize.outputs.candidate_sha }}
          EXPECTED_V4_HANDOFF_BLOB: ${{ vars.BODYCAST_V4_HANDOFF_BLOB }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_V4_HANDOFF_BLOB" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::The production Environment must pin the audited V4 schema handoff verifier blob."; exit 1;
          }
          ACTUAL_V4_HANDOFF_BLOB="$(git rev-parse "$DEPLOY_SHA:scripts/production-schema-deploy-handoff.mjs")"
          [[ "$ACTUAL_V4_HANDOFF_BLOB" == "$EXPECTED_V4_HANDOFF_BLOB" ]] || {
            echo "::error::The exact release SHA does not contain the externally approved V4 handoff verifier."; exit 1;
          }
      - name: Recheck run identity and main tip before production credentials
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.authorize.outputs.candidate_sha }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_EVENT_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -Eeuo pipefail
          gh api "repos/krustallik/body-model/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/current-deploy-run.json"
          TIP="$(gh api repos/krustallik/body-model/commits/main --jq .sha)"
          [[ "$TIP" == "$CANDIDATE" ]] || { echo "::error::Canonical main advanced before production credentials."; exit 1; }
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            node --input-type=module - "$RUNNER_TEMP/current-deploy-run.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { assertTrustedOwnerWorkflowRun } from "./scripts/github-owner-identity.mjs";
          assertTrustedOwnerWorkflowRun(JSON.parse(readFileSync(process.argv[2], "utf8")), {
            actorId: process.env.DISPATCH_ACTOR_ID,
            workflowPath: ".github/workflows/deploy-production.yml",
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            ref: "refs/heads/main",
            sha: process.env.GITHUB_SHA,
            requireInProgress: true,
          });
          NODE
          else
            [[ "$EVENT_NAME" == "workflow_run" && "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Unsupported production deploy trigger."; exit 1; }
            gh api "repos/krustallik/body-model/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-ci-run.json"
            gh api repos/krustallik/body-model/actions/workflows/ci.yml > "$RUNNER_TEMP/ci-workflow.json"
            SOURCE_RUN_JSON="$RUNNER_TEMP/source-ci-run.json" CI_WORKFLOW_JSON="$RUNNER_TEMP/ci-workflow.json" \
              CURRENT_RUN_JSON="$RUNNER_TEMP/current-deploy-run.json" CANDIDATE="$CANDIDATE" \
              EVENT_RUN_ID="$SOURCE_RUN_ID" EVENT_RUN_ATTEMPT="$SOURCE_EVENT_ATTEMPT" \
              CURRENT_RUN_ID="$GITHUB_RUN_ID" CURRENT_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
              node --experimental-strip-types --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { evaluateProductionDeployGate } from "./scripts/ci/production-deploy-gate.ts";
          const read = (name) => JSON.parse(readFileSync(process.env[name], "utf8"));
          const source = read("SOURCE_RUN_JSON");
          const current = read("CURRENT_RUN_JSON");
          const workflow = read("CI_WORKFLOW_JSON");
          if (workflow.path !== ".github/workflows/ci.yml") throw new Error("Canonical CI workflow path changed.");
          const result = evaluateProductionDeployGate({
            eventName: "workflow_run",
            repositoryFullName: "krustallik/body-model",
            mainTipSha: process.env.CANDIDATE,
            candidateSha: "",
            currentWorkflowRun: current,
            currentWorkflowRunId: process.env.CURRENT_RUN_ID,
            currentWorkflowRunAttempt: process.env.CURRENT_RUN_ATTEMPT,
            currentWorkflowRunSha: process.env.CANDIDATE,
            workflowRunEventId: process.env.EVENT_RUN_ID,
            workflowRunEventAttempt: process.env.EVENT_RUN_ATTEMPT || null,
            sourceWorkflowRun: source,
            expectedCiWorkflowId: workflow.id,
          });
          if (result.decision !== "deploy" || result.mode !== "serving" || result.candidateSha !== process.env.CANDIDATE) {
            throw new Error(result.reason);
          }
          NODE
          fi

      - name: Validate SSH inputs and pin the production host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_HOST: ${{ secrets.APP_HOST }}
          CADDY_ROUTES_PATH: ${{ secrets.CADDY_ROUTES_PATH }}
          DEPLOY_MODE: ${{ needs.authorize.outputs.deploy_mode }}
        run: |
          set -Eeuo pipefail
          : "$SSH_PRIVATE_KEY"; : "$SSH_HOST"; : "$SSH_USER"; : "$SSH_PORT"; : "$SSH_HOST_FINGERPRINT"; : "$DEPLOY_PATH"; : "$APP_HOST"; : "$CADDY_ROUTES_PATH"
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ && "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid production SSH host or user."; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT > 0 && SSH_PORT <= 65535 )) || { echo "::error::Invalid production SSH port."; exit 1; }
          [[ "$SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || { echo "::error::Invalid pinned production SSH fingerprint."; exit 1; }
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != *$'\n'* ]] || { echo "::error::DEPLOY_PATH must be an absolute single-line path."; exit 1; }
          [[ "$APP_HOST" =~ ^[A-Za-z0-9.-]+$ && "$CADDY_ROUTES_PATH" == /* && "$CADDY_ROUTES_PATH" != *$'\n'* ]] || { echo "::error::Production traffic topology inputs are invalid."; exit 1; }
          if [[ "$DEPLOY_MODE" == "fresh-empty-install" || "$DEPLOY_MODE" == "recovered-v4-serving" ]]; then
            [[ "$SSH_HOST" == "169.58.239.149" ]] || { echo "::error::New-VPS release is restricted to the verified BodyCast VPS address."; exit 1; }
            [[ "$APP_HOST" == "bodycast.ihorhub.eu" ]] || { echo "::error::New-VPS release is restricted to bodycast.ihorhub.eu."; exit 1; }
            getent ahostsv4 "$APP_HOST" | awk '$1 == "169.58.239.149" { found = 1 } END { exit !found }' || {
              echo "::error::APP_HOST does not resolve to the new VPS address."; exit 1;
            }
          fi
          install -d -m 700 "$RUNNER_TEMP/bodycast-deploy-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/bodycast-deploy-ssh/id"
          chmod 600 "$RUNNER_TEMP/bodycast-deploy-ssh/id"
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" > "$RUNNER_TEMP/bodycast-deploy-ssh/candidate" 2>/dev/null
          node scripts/filter-ssh-known-hosts.mjs "$RUNNER_TEMP/bodycast-deploy-ssh/candidate" "$RUNNER_TEMP/bodycast-deploy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/bodycast-deploy-ssh/known_hosts"
          echo "BODYCAST_SSH_KEY=$RUNNER_TEMP/bodycast-deploy-ssh/id" >> "$GITHUB_ENV"
          echo "BODYCAST_KNOWN_HOSTS=$RUNNER_TEMP/bodycast-deploy-ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Deploy exact SHA through the fixed production script
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_HOST: ${{ secrets.APP_HOST }}
          CADDY_ROUTES_PATH: ${{ secrets.CADDY_ROUTES_PATH }}
          DEPLOY_SHA: ${{ needs.authorize.outputs.candidate_sha }}
          DEPLOY_MODE: ${{ needs.authorize.outputs.deploy_mode }}
          RELEASE_WORKFLOW_RUN_ID: ${{ github.run_id }}
          RELEASE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          TIP="$(gh api repos/krustallik/body-model/commits/main --jq .sha)"
          [[ "$TIP" == "$DEPLOY_SHA" ]] || { echo "::error::Canonical main advanced immediately before SSH."; exit 1; }
          DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w0)"
          APP_HOST_B64="$(printf '%s' "$APP_HOST" | base64 -w0)"
          ROUTES_PATH_B64="$(printf '%s' "$CADDY_ROUTES_PATH" | base64 -w0)"
          [[ "$DEPLOY_MODE" == "serving" || "$DEPLOY_MODE" == "non-serving" || "$DEPLOY_MODE" == "fresh-empty-install" || "$DEPLOY_MODE" == "recovered-v4-serving" ]] || { echo "::error::Invalid authorized deploy mode."; exit 1; }
          REMOTE_SCRIPT="$(cat <<'REMOTE'
          set -Eeuo pipefail
          DEPLOY_SHA="$1"
          DEPLOY_PATH="$(printf '%s' "$2" | base64 --decode)"
          APP_HOST="$(printf '%s' "$3" | base64 --decode)"
          CADDY_ROUTES_PATH="$(printf '%s' "$4" | base64 --decode)"
          DEPLOY_MODE="${5:-}"
          RELEASE_WORKFLOW_RUN_ID="${6:-}"
          RELEASE_WORKFLOW_RUN_ATTEMPT="${7:-}"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ && "$DEPLOY_PATH" == /* && "$APP_HOST" =~ ^[A-Za-z0-9.-]+$ && "$CADDY_ROUTES_PATH" == /* \
            && ( "$DEPLOY_MODE" == "serving" || "$DEPLOY_MODE" == "non-serving" || "$DEPLOY_MODE" == "fresh-empty-install" || "$DEPLOY_MODE" == "recovered-v4-serving" ) ]] || exit 2
          cd -- "$DEPLOY_PATH"
          [[ "$(git rev-parse --show-toplevel)" == "$DEPLOY_PATH" ]] || { echo "Unexpected production checkout." >&2; exit 1; }
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || { echo "Production checkout is dirty; refusing to overwrite files." >&2; exit 1; }
          ORIGIN_URL="$(git remote get-url origin)"
          case "$ORIGIN_URL" in
            git@github.com:krustallik/body-model.git|https://github.com/krustallik/body-model.git) ;;
            *) echo "Production checkout origin is not the canonical BodyCast repository." >&2; exit 1 ;;
          esac
          if [[ "$ORIGIN_URL" == "git@github.com:krustallik/body-model.git" ]]; then
            GITHUB_DEPLOY_KEY="/root/.ssh/bodycast_github_deploy"
            [[ -f "$GITHUB_DEPLOY_KEY" && ! -L "$GITHUB_DEPLOY_KEY" \
              && "$(stat -c '%u' "$GITHUB_DEPLOY_KEY")" == "0" \
              && ( "$(stat -c '%a' "$GITHUB_DEPLOY_KEY")" == "600" || "$(stat -c '%a' "$GITHUB_DEPLOY_KEY")" == "400" ) ]] || {
              echo "The root-only read-only GitHub deploy key is unavailable or has unsafe permissions." >&2; exit 1;
            }
            export GIT_SSH_COMMAND="ssh -i $GITHUB_DEPLOY_KEY -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"
            git ls-remote origin refs/heads/main >/dev/null || {
              echo "The configured read-only GitHub deploy key cannot read the canonical BodyCast repository." >&2; exit 1;
            }
          fi
          git fetch --no-tags origin "$DEPLOY_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$DEPLOY_SHA" ]] || { echo "Production candidate is no longer current origin/main." >&2; exit 1; }
          git checkout --detach "$DEPLOY_SHA"
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_SHA" && -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || exit 1
          case "$DEPLOY_MODE" in
            serving) NON_SERVING="0" ;;
            non-serving) NON_SERVING="1" ;;
            fresh-empty-install)
              [[ "$RELEASE_WORKFLOW_RUN_ID" =~ ^[1-9][0-9]*$ && "$RELEASE_WORKFLOW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 2
              BODYCAST_EMPTY_INSTALL_CONFIRMATION="initialize-empty-bodycast-db" \
              BODYCAST_EMPTY_INSTALL_TARGET_IP="169.58.239.149" \
              APP_HOST="$APP_HOST" CADDY_ROUTES_PATH="$CADDY_ROUTES_PATH" \
                bash scripts/production-empty-install-host.sh "$DEPLOY_SHA" "$RELEASE_WORKFLOW_RUN_ID" "$RELEASE_WORKFLOW_RUN_ATTEMPT"
              exit 0
              ;;
            recovered-v4-serving)
              [[ "$RELEASE_WORKFLOW_RUN_ID" =~ ^[1-9][0-9]*$ && "$RELEASE_WORKFLOW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 2
              [[ "$APP_HOST" == "bodycast.ihorhub.eu" ]] || { echo "Recovered-V4 serving requires the exact BodyCast hostname." >&2; exit 1; }
              APP_HOST="$APP_HOST" CADDY_ROUTES_PATH="$CADDY_ROUTES_PATH" DEPLOY_SHA="$DEPLOY_SHA" \
                BODYCAST_NON_SERVING_DEPLOY=1 BODYCAST_RECOVERED_V4_SERVE=1 bash scripts/deploy.sh
              APP_HOST="$APP_HOST" CADDY_ROUTES_PATH="$CADDY_ROUTES_PATH" BODYCAST_DEPLOY_SHA="$DEPLOY_SHA" \
                BODYCAST_RECOVERED_V4_SERVE=1 bash scripts/production-traffic-cutover.sh serve
              exit 0
              ;;
            *) echo "Invalid deploy mode." >&2; exit 1 ;;
          esac
          APP_HOST="$APP_HOST" CADDY_ROUTES_PATH="$CADDY_ROUTES_PATH" DEPLOY_SHA="$DEPLOY_SHA" BODYCAST_NON_SERVING_DEPLOY="$NON_SERVING" \
            exec bash scripts/deploy.sh
          REMOTE
          )"
          REMOTE_SCRIPT_B64="$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)"
          [[ "$RELEASE_WORKFLOW_RUN_ID" =~ ^[1-9][0-9]*$ && "$RELEASE_WORKFLOW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Workflow run binding is malformed."; exit 1; }
          REMOTE_COMMAND="bash -c \"\$(printf '%s' '$REMOTE_SCRIPT_B64' | base64 --decode)\" -- '$DEPLOY_SHA' '$DEPLOY_PATH_B64' '$APP_HOST_B64' '$ROUTES_PATH_B64' '$DEPLOY_MODE' '$RELEASE_WORKFLOW_RUN_ID' '$RELEASE_WORKFLOW_RUN_ATTEMPT'"
          timeout 35m ssh -p "$SSH_PORT" -i "$BODYCAST_SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$BODYCAST_KNOWN_HOSTS" -o ConnectTimeout=10 "$SSH_USER@$SSH_HOST" "$REMOTE_COMMAND"
          if [[ "$DEPLOY_MODE" == "fresh-empty-install" || "$DEPLOY_MODE" == "recovered-v4-serving" ]]; then
            curl --fail --silent --show-error --max-time 20 "https://$APP_HOST/api/health" | grep -Fq '"status":"ok"'
            curl --fail --silent --show-error --output /dev/null --max-time 20 "https://$APP_HOST/settings/profile"
          fi

      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/bodycast-deploy-ssh"
