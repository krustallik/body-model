name: Manual production app deploy
run-name: Non-serving deploy ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: Type deploy to authorize an exact-current-main app deploy
        required: true
        type: string
      commit_sha:
        description: Full 40-character current main SHA
        required: true
        type: string
      non_serving_deploy:
        description: Required for the incompatible-schema release; keep traffic in maintenance
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: bodycast-production-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize owner-requested exact-SHA deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      candidate_sha: ${{ steps.gate.outputs.candidate_sha }}
      reason: ${{ steps.gate.outputs.reason }}
      ci_run_url: ${{ steps.gate.outputs.ci_run_url }}
    steps:
      - name: Checkout main gate helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable owner identity and exact current-main SHA
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
          DISPATCH_SHA: ${{ inputs.commit_sha }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
          CONFIRMATION: ${{ inputs.confirm_production_deploy }}
          NON_SERVING: ${{ inputs.non_serving_deploy }}
        run: |
          set -Eeuo pipefail
          [[ "$REPOSITORY" == "krustallik/body-model" && "$REF" == "refs/heads/main" ]] || {
            echo "::error::Production deploy must be dispatched from the canonical main branch."; exit 1;
          }
          [[ "$DISPATCH_ACTOR_ID" == "126446430" ]] || { echo "::error::Only the pinned BodyCast owner may deploy."; exit 1; }
          [[ "$CONFIRMATION" == "deploy" && "$NON_SERVING" == "true" ]] || {
            echo "::error::Exact deploy confirmation and non-serving mode are required."; exit 1;
          }
          gh api "repos/krustallik/body-model/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/current-deploy-run.json"
          node --input-type=module - "$RUNNER_TEMP/current-deploy-run.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { assertTrustedOwnerWorkflowRun } from "./scripts/github-owner-identity.mjs";
          const run = JSON.parse(readFileSync(process.argv[2], "utf8"));
          assertTrustedOwnerWorkflowRun(run, {
            actorId: process.env.DISPATCH_ACTOR_ID,
            workflowPath: ".github/workflows/deploy-production.yml",
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            ref: "refs/heads/main",
            sha: process.env.RUN_SHA,
            requireInProgress: true,
          });
          NODE
          [[ "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit_sha must be a full lowercase SHA."; exit 1; }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          MAIN_TIP="$(gh api repos/krustallik/body-model/commits/main --jq .sha)"
          [[ "$MAIN_TIP" == "$(git rev-parse refs/remotes/origin/main)" && "$MAIN_TIP" == "$RUN_SHA" ]] || {
            echo "::error::Workflow checkout is not the current canonical main tip."; exit 1;
          }
          REPO="$REPOSITORY" EVENT_NAME="$GITHUB_EVENT_NAME" MAIN_TIP="$MAIN_TIP" CANDIDATE="$DISPATCH_SHA" \
            CONFIRMATION="$CONFIRMATION" NON_SERVING="$NON_SERVING" node --experimental-strip-types --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import { evaluateProductionDeployGate } from "./scripts/ci/production-deploy-gate.ts";
          const result = evaluateProductionDeployGate({
            eventName: process.env.EVENT_NAME,
            repositoryFullName: process.env.REPO,
            mainTipSha: process.env.MAIN_TIP,
            candidateSha: process.env.CANDIDATE,
            dispatchConfirm: process.env.CONFIRMATION,
            nonServingDeploy: process.env.NON_SERVING === "true",
          });
          appendFileSync(process.env.GITHUB_OUTPUT, `decision=${result.decision}\ncandidate_sha=${result.candidateSha ?? ""}\nreason=${result.reason}\n`);
          console.log(JSON.stringify(result, null, 2));
          if (result.decision !== "deploy") process.exitCode = 1;
          NODE
          CI_RUNS="$(gh api --paginate --jq '.workflow_runs[] | @json' \
            "repos/krustallik/body-model/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100")"
          CI_RUN_URL="$(printf '%s\n' "$CI_RUNS" | EXPECTED_SHA="$DISPATCH_SHA" node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const sha = process.env.EXPECTED_SHA;
          const runs = readFileSync(0, "utf8").trim().split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const matches = runs.filter((run) => run.head_sha === sha && run.head_branch === "main" && run.event === "push");
          matches.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || Number(b.run_attempt) - Number(a.run_attempt));
          const run = matches[0];
          if (!run || run.status !== "completed" || run.conclusion !== "success") throw new Error("Exact current main SHA has no completed successful BodyCast CI/CD run.");
          console.log(run.html_url);
          ')"
          echo "ci_run_url=$CI_RUN_URL" >> "$GITHUB_OUTPUT"
          echo "## Owner-authorized non-serving production deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- exact SHA: \`$DISPATCH_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- current-main CI: $CI_RUN_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- traffic: remains in maintenance until separate V3/V4 gates pass" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy exact SHA in maintenance
    needs: authorize
    if: needs.authorize.outputs.decision == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - name: Recheck run identity and main tip before production credentials
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.authorize.outputs.candidate_sha }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/krustallik/body-model/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/current-deploy-run.json"
          node --input-type=module - "$RUNNER_TEMP/current-deploy-run.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { assertTrustedOwnerWorkflowRun } from "./scripts/github-owner-identity.mjs";
          assertTrustedOwnerWorkflowRun(JSON.parse(readFileSync(process.argv[2], "utf8")), {
            actorId: process.env.DISPATCH_ACTOR_ID,
            workflowPath: ".github/workflows/deploy-production.yml",
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            ref: "refs/heads/main",
            sha: process.env.GITHUB_SHA,
            requireInProgress: true,
          });
          NODE
          TIP="$(gh api repos/krustallik/body-model/commits/main --jq .sha)"
          [[ "$TIP" == "$CANDIDATE" ]] || { echo "::error::Canonical main advanced before SSH deployment."; exit 1; }

      - name: Validate SSH inputs and pin the production host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_HOST: ${{ secrets.APP_HOST }}
          CADDY_ROUTES_PATH: ${{ secrets.CADDY_ROUTES_PATH }}
        run: |
          set -Eeuo pipefail
          : "$SSH_PRIVATE_KEY"; : "$SSH_HOST"; : "$SSH_USER"; : "$SSH_PORT"; : "$SSH_HOST_FINGERPRINT"; : "$DEPLOY_PATH"; : "$APP_HOST"; : "$CADDY_ROUTES_PATH"
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ && "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid production SSH host or user."; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT > 0 && SSH_PORT <= 65535 )) || { echo "::error::Invalid production SSH port."; exit 1; }
          [[ "$SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || { echo "::error::Invalid pinned production SSH fingerprint."; exit 1; }
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != *$'\n'* ]] || { echo "::error::DEPLOY_PATH must be an absolute single-line path."; exit 1; }
          [[ "$APP_HOST" =~ ^[A-Za-z0-9.-]+$ && "$CADDY_ROUTES_PATH" == /* && "$CADDY_ROUTES_PATH" != *$'\n'* ]] || { echo "::error::Production traffic topology inputs are invalid."; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/bodycast-deploy-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/bodycast-deploy-ssh/id"
          chmod 600 "$RUNNER_TEMP/bodycast-deploy-ssh/id"
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" > "$RUNNER_TEMP/bodycast-deploy-ssh/candidate" 2>/dev/null
          node scripts/filter-ssh-known-hosts.mjs "$RUNNER_TEMP/bodycast-deploy-ssh/candidate" "$RUNNER_TEMP/bodycast-deploy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/bodycast-deploy-ssh/known_hosts"
          echo "BODYCAST_SSH_KEY=$RUNNER_TEMP/bodycast-deploy-ssh/id" >> "$GITHUB_ENV"
          echo "BODYCAST_KNOWN_HOSTS=$RUNNER_TEMP/bodycast-deploy-ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Deploy exact SHA through the fixed production script
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_HOST: ${{ secrets.APP_HOST }}
          CADDY_ROUTES_PATH: ${{ secrets.CADDY_ROUTES_PATH }}
          DEPLOY_SHA: ${{ needs.authorize.outputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          TIP="$(gh api repos/krustallik/body-model/commits/main --jq .sha)"
          [[ "$TIP" == "$DEPLOY_SHA" ]] || { echo "::error::Canonical main advanced immediately before SSH."; exit 1; }
          DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w0)"
          APP_HOST_B64="$(printf '%s' "$APP_HOST" | base64 -w0)"
          ROUTES_PATH_B64="$(printf '%s' "$CADDY_ROUTES_PATH" | base64 -w0)"
          REMOTE_SCRIPT="$(cat <<'REMOTE'
          set -Eeuo pipefail
          DEPLOY_SHA="$1"
          DEPLOY_PATH="$(printf '%s' "$2" | base64 --decode)"
          APP_HOST="$(printf '%s' "$3" | base64 --decode)"
          CADDY_ROUTES_PATH="$(printf '%s' "$4" | base64 --decode)"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ && "$DEPLOY_PATH" == /* && "$APP_HOST" =~ ^[A-Za-z0-9.-]+$ && "$CADDY_ROUTES_PATH" == /* ]] || exit 2
          cd -- "$DEPLOY_PATH"
          [[ "$(git rev-parse --show-toplevel)" == "$DEPLOY_PATH" ]] || { echo "Unexpected production checkout." >&2; exit 1; }
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || { echo "Production checkout is dirty; refusing to overwrite files." >&2; exit 1; }
          git fetch --no-tags origin "$DEPLOY_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$DEPLOY_SHA" ]] || { echo "Production candidate is no longer current origin/main." >&2; exit 1; }
          git checkout --detach "$DEPLOY_SHA"
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_SHA" && -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || exit 1
          APP_HOST="$APP_HOST" CADDY_ROUTES_PATH="$CADDY_ROUTES_PATH" DEPLOY_SHA="$DEPLOY_SHA" BODYCAST_NON_SERVING_DEPLOY=1 \
            exec bash scripts/deploy.sh
          REMOTE
          )"
          REMOTE_SCRIPT_B64="$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)"
          REMOTE_COMMAND="bash -c \"\$(printf '%s' '$REMOTE_SCRIPT_B64' | base64 --decode)\" -- '$DEPLOY_SHA' '$DEPLOY_PATH_B64' '$APP_HOST_B64' '$ROUTES_PATH_B64'"
          timeout 35m ssh -p "$SSH_PORT" -i "$BODYCAST_SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$BODYCAST_KNOWN_HOSTS" -o ConnectTimeout=10 "$SSH_USER@$SSH_HOST" "$REMOTE_COMMAND"

      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/bodycast-deploy-ssh"
