name: Production checkout read-only diagnostic
run-name: Checkout diagnostic ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full SHA of current canonical main; the workflow verifies exact SHA and green CI
        required: true
        type: string
      confirm_read_only_diagnostic:
        description: Type diagnose-production-checkout-read-only to authorize inspection only
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bodycast-production-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize owner-requested exact-main diagnostic
    if: github.repository == 'krustallik/body-model' && github.ref == 'refs/heads/main' && github.actor_id == '126446430'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.gate.outputs.release_sha }}
    steps:
      - name: Checkout current main gate helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify owner, exact current-main SHA, confirmation, and green CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_SHA: ${{ inputs.commit_sha }}
          CONFIRMATION: ${{ inputs.confirm_read_only_diagnostic }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "krustallik/body-model" && "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::Dispatch this workflow from canonical main only."; exit 1;
          }
          [[ "$DISPATCH_ACTOR_ID" == "126446430" ]] || { echo "::error::Only the pinned BodyCast owner may authorize this diagnostic."; exit 1; }
          [[ "$CONFIRMATION" == "diagnose-production-checkout-read-only" ]] || {
            echo "::error::Read-only diagnostic confirmation did not match."; exit 1;
          }
          [[ "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit_sha must be a full lowercase SHA."; exit 1; }
          gh api "repos/krustallik/body-model/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/current-checkout-diagnostic-run.json"
          node --input-type=module - "$RUNNER_TEMP/current-checkout-diagnostic-run.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { assertTrustedOwnerWorkflowRun } from "./scripts/github-owner-identity.mjs";
          assertTrustedOwnerWorkflowRun(JSON.parse(readFileSync(process.argv[2], "utf8")), {
            actorId: process.env.DISPATCH_ACTOR_ID,
            workflowPath: ".github/workflows/production-checkout-diagnostic.yml",
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            ref: "refs/heads/main",
            sha: process.env.GITHUB_SHA,
            requireInProgress: true,
          });
          NODE
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          MAIN_TIP="$(gh api repos/krustallik/body-model/commits/main --jq .sha)"
          [[ "$MAIN_TIP" == "$(git rev-parse refs/remotes/origin/main)" && "$MAIN_TIP" == "$GITHUB_SHA" && "$MAIN_TIP" == "$DISPATCH_SHA" ]] || {
            echo "::error::Requested SHA is not the exact current canonical main tip."; exit 1;
          }
          gh api --paginate --jq '.workflow_runs[] | @json' \
            "repos/krustallik/body-model/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" \
            > "$RUNNER_TEMP/bodycast-ci-runs.ndjson"
          CI_URL="$(node --input-type=module - "$RUNNER_TEMP/bodycast-ci-runs.ndjson" "$MAIN_TIP" <<'NODE'
          import { readFileSync } from "node:fs";
          const runs = readFileSync(process.argv[2], "utf8").trim().split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const matches = runs.filter((run) => run.head_sha === process.argv[3] && run.head_branch === "main" && run.event === "push");
          matches.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || Number(b.run_attempt) - Number(a.run_attempt));
          const latest = matches[0];
          if (!latest || latest.status !== "completed" || latest.conclusion !== "success") {
            throw new Error("Exact current-main SHA has no completed successful BodyCast CI/CD run.");
          }
          console.log(latest.html_url);
          NODE
          )"
          echo "release_sha=$MAIN_TIP" >> "$GITHUB_OUTPUT"
          {
            echo "## Read-only production checkout diagnostic authorization"
            echo ""
            echo "- exact current-main SHA: `$MAIN_TIP`"
            echo "- current-main CI: $CI_URL"
            echo "- production scope: read-only checkout/container identity and health, candidate Compose/runtime config equality, sanitized Auth/Brevo/Shortcut runtime readiness including exact owner-email binding, Brevo GET-only credential/sender check, restricted aggregate energy inventory, Workout 56 shadow/canonical-input fingerprint and reconciliation-writer-target flags, fixed rollback-image pin inspection, and public maintenance/API/UI probes; raw shadow payload is held only in a mode-600 temporary capture and sanitized before logs; no database writes, Docker lifecycle/configuration changes, checkout, fetch, Caddy, or traffic operations"
          } >> "$GITHUB_STEP_SUMMARY"

  diagnose:
    name: Inspect production checkout without mutation
    needs: authorize
    if: needs.authorize.outputs.release_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout exact current-main diagnostic script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck owner run identity and current main before production credentials
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -Eeuo pipefail
          [[ "$DISPATCH_ACTOR_ID" == "126446430" ]] || { echo "::error::Only the pinned BodyCast owner may access production diagnostic credentials."; exit 1; }
          gh api "repos/krustallik/body-model/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/current-checkout-diagnostic-run.json"
          node --input-type=module - "$RUNNER_TEMP/current-checkout-diagnostic-run.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { assertTrustedOwnerWorkflowRun } from "./scripts/github-owner-identity.mjs";
          assertTrustedOwnerWorkflowRun(JSON.parse(readFileSync(process.argv[2], "utf8")), {
            actorId: process.env.DISPATCH_ACTOR_ID,
            workflowPath: ".github/workflows/production-checkout-diagnostic.yml",
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            ref: "refs/heads/main",
            sha: process.env.GITHUB_SHA,
            requireInProgress: true,
          });
          NODE
          TIP="$(gh api repos/krustallik/body-model/commits/main --jq .sha)"
          [[ "$TIP" == "$RELEASE_SHA" && "$GITHUB_SHA" == "$RELEASE_SHA" ]] || {
            echo "::error::Canonical main moved before production diagnostic access."; exit 1;
          }

      - name: Validate SSH inputs and pin the production host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_HOST: ${{ secrets.APP_HOST }}
        run: |
          set -Eeuo pipefail
          : "$SSH_PRIVATE_KEY"; : "$SSH_HOST"; : "$SSH_USER"; : "$SSH_PORT"; : "$SSH_HOST_FINGERPRINT"; : "$DEPLOY_PATH"; : "$APP_HOST"
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ && "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid production SSH host or user metadata."; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT > 0 && SSH_PORT <= 65535 )) || { echo "::error::Invalid production SSH port metadata."; exit 1; }
          [[ "$SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || { echo "::error::Invalid pinned production SSH fingerprint metadata."; exit 1; }
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != *$'\n'* && "$DEPLOY_PATH" != *$'\r'* ]] || { echo "::error::DEPLOY_PATH must be an absolute single-line path."; exit 1; }
          [[ "$APP_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::APP_HOST must be a canonical hostname."; exit 1; }
          umask 077
          install -d -m 700 "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh/id"
          chmod 600 "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh/id"
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" > "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh/candidate" 2>/dev/null
          test -s "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh/candidate"
          SSH_HOST_FINGERPRINT="$SSH_HOST_FINGERPRINT" node scripts/filter-ssh-known-hosts.mjs \
            "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh/candidate" \
            "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh/known_hosts"

      - name: Inspect checkout metadata read-only
        id: checkout_metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_HOST: ${{ secrets.APP_HOST }}
          AUTH_PROFILE_ONE_OWNER_EMAIL_EXPECTED: ${{ secrets.AUTH_PROFILE_ONE_OWNER_EMAIL_EXPECTED }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          TIP="$(gh api repos/krustallik/body-model/commits/main --jq .sha)"
          [[ "$TIP" == "$RELEASE_SHA" && "$GITHUB_SHA" == "$RELEASE_SHA" ]] || {
            echo "::error::Canonical main moved immediately before the read-only SSH diagnostic."; exit 1;
          }
          DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w0)"
          APP_HOST_B64="$(printf '%s' "$APP_HOST" | base64 -w0)"
          EXPECTED_OWNER_EMAIL_NORMALIZED="$(printf '%s' "$AUTH_PROFILE_ONE_OWNER_EMAIL_EXPECTED" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]')"
          if ! EXPECTED_OWNER_EMAIL_NORMALIZED="$EXPECTED_OWNER_EMAIL_NORMALIZED" node --input-type=module <<'NODE'
          const emailPattern = /^(?:[A-Za-z0-9_'+-]+\.)*[A-Za-z0-9_'+-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9-]*\.)+[A-Za-z]{2,}$/;
          if (!emailPattern.test(process.env.EXPECTED_OWNER_EMAIL_NORMALIZED ?? "")) process.exit(1);
          NODE
          then
            echo "::error::Protected owner-email expectation is missing or invalid."; exit 1;
          fi
          EXPECTED_OWNER_EMAIL_B64="$(printf '%s' "$EXPECTED_OWNER_EMAIL_NORMALIZED" | base64 -w0)"
          COMPOSE_FILE_SHA256="$(sha256sum docker-compose.prod.yml | awk '{print $1}')"
          [[ "$COMPOSE_FILE_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::Candidate Compose file hash is unavailable."; exit 1; }
          DIAGNOSTIC_OUTPUT="$RUNNER_TEMP/bodycast-checkout-diagnostic-output"
          umask 077
          : > "$DIAGNOSTIC_OUTPUT"
          chmod 600 "$DIAGNOSTIC_OUTPUT"
          trap 'rm -f -- "$DIAGNOSTIC_OUTPUT"' EXIT
          {
            printf 'DEPLOY_PATH_B64=%s\n' "$DEPLOY_PATH_B64"
            printf 'APP_HOST_B64=%s\n' "$APP_HOST_B64"
            printf 'COMPOSE_FILE_SHA256=%s\n' "$COMPOSE_FILE_SHA256"
            printf 'EXPECTED_OWNER_EMAIL_B64=%s\n' "$EXPECTED_OWNER_EMAIL_B64"
            cat scripts/production-checkout-diagnostic.sh
          } | timeout 5m ssh -T -p "$SSH_PORT" \
            -i "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh/id" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh/known_hosts" \
            -o ConnectTimeout=10 "$SSH_USER@$SSH_HOST" 'bash -s' > "$DIAGNOSTIC_OUTPUT"
          node scripts/production-stepper-shadow-diagnostic.mjs "$DIAGNOSTIC_OUTPUT"
          REMOTE_HEAD_SHA="$(awk -F= '$1 == "head_sha" { print $2 }' "$DIAGNOSTIC_OUTPUT")"
          REMOTE_BRANCH="$(awk -F= '$1 == "branch" { print $2 }' "$DIAGNOSTIC_OUTPUT")"
          REMOTE_CLEAN="$(awk -F= '$1 == "checkout_clean_as_existing_guard" { print $2 }' "$DIAGNOSTIC_OUTPUT")"
          [[ "$REMOTE_HEAD_SHA" =~ ^[a-f0-9]{40}$ && "$REMOTE_BRANCH" == "main" && "$REMOTE_CLEAN" == "yes" ]] || {
            echo "::error::Production checkout is not a clean main commit."; exit 1;
          }
          echo "remote_head_sha=$REMOTE_HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Inspect production database schema read-only
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_HOST: ${{ secrets.APP_HOST }}
          CADDY_ROUTES_PATH: ${{ secrets.CADDY_ROUTES_PATH }}
          REMOTE_CHECKOUT_SHA: ${{ steps.checkout_metadata.outputs.remote_head_sha }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          TIP="$(gh api repos/krustallik/body-model/commits/main --jq .sha)"
          [[ "$TIP" == "$RELEASE_SHA" && "$GITHUB_SHA" == "$RELEASE_SHA" ]] || {
            echo "::error::Canonical main moved immediately before the read-only database diagnostic."; exit 1;
          }
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != *$'\n'* && "$DEPLOY_PATH" != *$'\r'* ]] || {
            echo "::error::Read-only database diagnostic inputs are malformed."; exit 1;
          }
          [[ "$REMOTE_CHECKOUT_SHA" =~ ^[a-f0-9]{40}$ ]] \
            && git merge-base --is-ancestor "$REMOTE_CHECKOUT_SHA" "$RELEASE_SHA" \
            && git diff --quiet "$REMOTE_CHECKOUT_SHA" "$RELEASE_SHA" -- scripts prisma docker-compose.prod.yml || {
            echo "::error::Production DB diagnostic code or schema differs from the exact current-main tree."; exit 1;
          }
          DB_REPORT="$RUNNER_TEMP/bodycast-read-only-db-report.json"
          DB_RESULT="$RUNNER_TEMP/bodycast-read-only-db-result.json"
          umask 077
          : > "$DB_REPORT"
          : > "$DB_RESULT"
          chmod 600 "$DB_REPORT" "$DB_RESULT"
          trap 'rm -f -- "$DB_REPORT" "$DB_RESULT"' EXIT
          DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w0)"
          APP_HOST_B64="$(printf '%s' "$APP_HOST" | base64 -w0)"
          CADDY_ROUTES_PATH_B64="$(printf '%s' "$CADDY_ROUTES_PATH" | base64 -w0)"
          REMOTE_SCRIPT="$(cat <<'REMOTE'
          set -Eeuo pipefail
          export GIT_OPTIONAL_LOCKS=0
          deploy_path="$(printf '%s' "$1" | base64 --decode)"
          remote_sha="$2"
          app_host="$(printf '%s' "$3" | base64 --decode)"
          routes_path="$(printf '%s' "$4" | base64 --decode)"
          [[ "$deploy_path" == /* && -d "$deploy_path" && ! -L "$deploy_path" \
            && "$(git -C "$deploy_path" rev-parse --show-toplevel)" == "$deploy_path" \
            && "$(git -C "$deploy_path" rev-parse HEAD)" == "$remote_sha" \
            && -z "$(git -C "$deploy_path" status --porcelain=v1 --untracked-files=all)" ]] || {
            echo "Production checkout changed since the read-only metadata capture." >&2; exit 1;
          }
          cd -- "$deploy_path"
          APP_HOST="$app_host" CADDY_ROUTES_PATH="$routes_path" BODYCAST_DB_PREFLIGHT_MANIFEST=training-session-context-v1 \
            bash scripts/production-db-target.sh --preflight bodycast-db-prod
          REMOTE
          )"
          REMOTE_SCRIPT_B64="$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)"
          REMOTE_COMMAND="bash -c \"\$(printf '%s' '$REMOTE_SCRIPT_B64' | base64 --decode)\" -- '$DEPLOY_PATH_B64' '$REMOTE_CHECKOUT_SHA' '$APP_HOST_B64' '$CADDY_ROUTES_PATH_B64'"
          timeout 5m ssh -T -p "$SSH_PORT" \
            -i "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh/id" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh/known_hosts" \
            -o ConnectTimeout=10 "$SSH_USER@$SSH_HOST" "$REMOTE_COMMAND" > "$DB_REPORT"
          if node scripts/production-migration-preflight.mjs --preflight --manifest training-session-context-v1 \
            --release-sha "$RELEASE_SHA" --repository "$GITHUB_WORKSPACE" --report "$DB_REPORT" > "$DB_RESULT"; then
            echo "### Read-only Training schema diagnostic: checks passed" >> "$GITHUB_STEP_SUMMARY"
            echo "The exact production database report passes the manifest checks. This diagnostic grants no migration or deployment authorization." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Read-only Training schema diagnostic blockers"
              echo "The full production report and fingerprints remain in the private ephemeral runner directory and are not uploaded. Only bounded escaped blocker messages follow. This diagnostic grants no migration or deployment authorization."
              node --input-type=module - "$DB_RESULT" <<'NODE'
          import { readFileSync } from "node:fs";
          const result = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (!Array.isArray(result.blockers) || result.blockers.some((item) => typeof item !== "string")) {
            throw new Error("Read-only database diagnostic result has no valid blocker list.");
          }
          const escapeMarkdown = (value) => value.slice(0, 500)
            .replace(/[\u0000-\u001f\u007f-\u009f\u2028\u2029]/g, (character) => `\\u${character.codePointAt(0).toString(16).padStart(4, "0")}`)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/([\\`*_{}[\]()#+.!|])/g, "\\$1");
          process.stdout.write(`Blocker count: ${result.blockers.length}\n`);
          for (const blocker of result.blockers.slice(0, 100)) process.stdout.write(`- ${escapeMarkdown(blocker)}\n`);
          if (result.blockers.length > 100) process.stdout.write(`- ${result.blockers.length - 100} additional blockers omitted.\n`);
          NODE
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh"
