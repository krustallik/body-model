name: Production checkout read-only diagnostic
run-name: Checkout diagnostic ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full SHA of current canonical main; the workflow verifies exact SHA and green CI
        required: true
        type: string
      confirm_read_only_diagnostic:
        description: Type diagnose-production-checkout-read-only to authorize inspection only
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bodycast-production-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize owner-requested exact-main diagnostic
    if: github.repository == 'krustallik/body-model' && github.ref == 'refs/heads/main' && github.actor_id == '126446430'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.gate.outputs.release_sha }}
    steps:
      - name: Checkout current main gate helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify owner, exact current-main SHA, confirmation, and green CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_SHA: ${{ inputs.commit_sha }}
          CONFIRMATION: ${{ inputs.confirm_read_only_diagnostic }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "krustallik/body-model" && "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::Dispatch this workflow from canonical main only."; exit 1;
          }
          [[ "$DISPATCH_ACTOR_ID" == "126446430" ]] || { echo "::error::Only the pinned BodyCast owner may authorize this diagnostic."; exit 1; }
          [[ "$CONFIRMATION" == "diagnose-production-checkout-read-only" ]] || {
            echo "::error::Read-only diagnostic confirmation did not match."; exit 1;
          }
          [[ "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit_sha must be a full lowercase SHA."; exit 1; }
          gh api "repos/krustallik/body-model/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/current-checkout-diagnostic-run.json"
          node --input-type=module - "$RUNNER_TEMP/current-checkout-diagnostic-run.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { assertTrustedOwnerWorkflowRun } from "./scripts/github-owner-identity.mjs";
          assertTrustedOwnerWorkflowRun(JSON.parse(readFileSync(process.argv[2], "utf8")), {
            actorId: process.env.DISPATCH_ACTOR_ID,
            workflowPath: ".github/workflows/production-checkout-diagnostic.yml",
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            ref: "refs/heads/main",
            sha: process.env.GITHUB_SHA,
            requireInProgress: true,
          });
          NODE
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          MAIN_TIP="$(gh api repos/krustallik/body-model/commits/main --jq .sha)"
          [[ "$MAIN_TIP" == "$(git rev-parse refs/remotes/origin/main)" && "$MAIN_TIP" == "$GITHUB_SHA" && "$MAIN_TIP" == "$DISPATCH_SHA" ]] || {
            echo "::error::Requested SHA is not the exact current canonical main tip."; exit 1;
          }
          gh api --paginate --jq '.workflow_runs[] | @json' \
            "repos/krustallik/body-model/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" \
            > "$RUNNER_TEMP/bodycast-ci-runs.ndjson"
          CI_URL="$(node --input-type=module - "$RUNNER_TEMP/bodycast-ci-runs.ndjson" "$MAIN_TIP" <<'NODE'
          import { readFileSync } from "node:fs";
          const runs = readFileSync(process.argv[2], "utf8").trim().split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const matches = runs.filter((run) => run.head_sha === process.argv[3] && run.head_branch === "main" && run.event === "push");
          matches.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || Number(b.run_attempt) - Number(a.run_attempt));
          const latest = matches[0];
          if (!latest || latest.status !== "completed" || latest.conclusion !== "success") {
            throw new Error("Exact current-main SHA has no completed successful BodyCast CI/CD run.");
          }
          console.log(latest.html_url);
          NODE
          )"
          echo "release_sha=$MAIN_TIP" >> "$GITHUB_OUTPUT"
          {
            echo "## Read-only production checkout diagnostic authorization"
            echo ""
            echo "- exact current-main SHA: `$MAIN_TIP`"
            echo "- current-main CI: $CI_URL"
            echo "- production scope: SSH checkout metadata only; no checkout, fetch, writes, maintenance, DB, Docker, or traffic operations"
          } >> "$GITHUB_STEP_SUMMARY"

  diagnose:
    name: Inspect production checkout without mutation
    needs: authorize
    if: needs.authorize.outputs.release_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout exact current-main diagnostic script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Recheck owner run identity and current main before production credentials
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -Eeuo pipefail
          [[ "$DISPATCH_ACTOR_ID" == "126446430" ]] || { echo "::error::Only the pinned BodyCast owner may access production diagnostic credentials."; exit 1; }
          gh api "repos/krustallik/body-model/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/current-checkout-diagnostic-run.json"
          node --input-type=module - "$RUNNER_TEMP/current-checkout-diagnostic-run.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { assertTrustedOwnerWorkflowRun } from "./scripts/github-owner-identity.mjs";
          assertTrustedOwnerWorkflowRun(JSON.parse(readFileSync(process.argv[2], "utf8")), {
            actorId: process.env.DISPATCH_ACTOR_ID,
            workflowPath: ".github/workflows/production-checkout-diagnostic.yml",
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            ref: "refs/heads/main",
            sha: process.env.GITHUB_SHA,
            requireInProgress: true,
          });
          NODE
          TIP="$(gh api repos/krustallik/body-model/commits/main --jq .sha)"
          [[ "$TIP" == "$RELEASE_SHA" && "$GITHUB_SHA" == "$RELEASE_SHA" ]] || {
            echo "::error::Canonical main moved before production diagnostic access."; exit 1;
          }

      - name: Validate SSH inputs and pin the production host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          : "$SSH_PRIVATE_KEY"; : "$SSH_HOST"; : "$SSH_USER"; : "$SSH_PORT"; : "$SSH_HOST_FINGERPRINT"; : "$DEPLOY_PATH"
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ && "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid production SSH host or user metadata."; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT > 0 && SSH_PORT <= 65535 )) || { echo "::error::Invalid production SSH port metadata."; exit 1; }
          [[ "$SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || { echo "::error::Invalid pinned production SSH fingerprint metadata."; exit 1; }
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != *$'\n'* && "$DEPLOY_PATH" != *$'\r'* ]] || { echo "::error::DEPLOY_PATH must be an absolute single-line path."; exit 1; }
          umask 077
          install -d -m 700 "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh/id"
          chmod 600 "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh/id"
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" > "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh/candidate" 2>/dev/null
          test -s "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh/candidate"
          SSH_HOST_FINGERPRINT="$SSH_HOST_FINGERPRINT" node scripts/filter-ssh-known-hosts.mjs \
            "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh/candidate" \
            "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh/known_hosts"

      - name: Inspect checkout metadata read-only
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          TIP="$(gh api repos/krustallik/body-model/commits/main --jq .sha)"
          [[ "$TIP" == "$RELEASE_SHA" && "$GITHUB_SHA" == "$RELEASE_SHA" ]] || {
            echo "::error::Canonical main moved immediately before the read-only SSH diagnostic."; exit 1;
          }
          DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w0)"
          {
            printf 'DEPLOY_PATH_B64=%s\n' "$DEPLOY_PATH_B64"
            cat scripts/production-checkout-diagnostic.sh
          } | timeout 5m ssh -T -p "$SSH_PORT" \
            -i "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh/id" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh/known_hosts" \
            -o ConnectTimeout=10 "$SSH_USER@$SSH_HOST" 'bash -s'

      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/bodycast-checkout-diagnostic-ssh"
