name: Owner-authorized full-history recalculation
run-name: Full-history recalculate ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full SHA that must still be current main with successful CI and the exact-SHA app-ready marker
        required: true
        type: string
      confirm_full_history_recalculate:
        description: Type RECALCULATE_FULL_HISTORY_PROFILE_1 to authorize backup, isolated rehearsal, and production recalculation
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bodycast-production-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact-current-main full-history recalculation
    if: github.ref == 'refs/heads/main' && github.actor_id == '126446430'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.gate.outputs.release_sha }}
      ci_url: ${{ steps.gate.outputs.ci_url }}
    steps:
      - name: Checkout current main gate helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify owner run, exact SHA, current main, and green CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_SHA: ${{ inputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirm_full_history_recalculate }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "krustallik/body-model" && "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::Full-history recalculation requires the canonical repository and main branch."; exit 1;
          }
          [[ "$DISPATCH_ACTOR_ID" == "126446430" && "$CONFIRMATION" == "RECALCULATE_FULL_HISTORY_PROFILE_1" ]] || {
            echo "::error::Pinned owner identity and explicit recalculation confirmation are required."; exit 1;
          }
          [[ "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release_sha must be a full lowercase SHA."; exit 1; }
          gh api "repos/krustallik/body-model/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/current-recalc-run.json"
          node --input-type=module - "$RUNNER_TEMP/current-recalc-run.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { assertTrustedOwnerWorkflowRun } from "./scripts/github-owner-identity.mjs";
          assertTrustedOwnerWorkflowRun(JSON.parse(readFileSync(process.argv[2], "utf8")), {
            actorId: process.env.DISPATCH_ACTOR_ID,
            workflowPath: ".github/workflows/production-full-history-recalculate.yml",
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            ref: "refs/heads/main",
            sha: process.env.GITHUB_SHA,
            requireInProgress: true,
          });
          NODE
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          MAIN_TIP="$(gh api repos/krustallik/body-model/commits/main --jq .sha)"
          [[ "$MAIN_TIP" == "$(git rev-parse refs/remotes/origin/main)" && "$MAIN_TIP" == "$GITHUB_SHA" && "$MAIN_TIP" == "$DISPATCH_SHA" ]] || {
            echo "::error::Requested recalculation SHA is not the exact current main tip."; exit 1;
          }
          CI_RUNS="$(gh api --paginate --jq '.workflow_runs[] | @json' \
            "repos/krustallik/body-model/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100")"
          CI_URL="$(printf '%s\n' "$CI_RUNS" | EXPECTED_SHA="$MAIN_TIP" node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const sha = process.env.EXPECTED_SHA;
          const runs = readFileSync(0, "utf8").trim().split(/\r?\n/).filter(Boolean).map(JSON.parse)
            .filter((run) => run.head_sha === sha && run.head_branch === "main" && run.event === "push");
          runs.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || Number(b.run_attempt) - Number(a.run_attempt));
          const run = runs[0];
          if (!run || run.status !== "completed" || run.conclusion !== "success") throw new Error("Exact current main SHA has no completed successful BodyCast CI/CD run.");
          console.log(run.html_url);
          ')"
          echo "release_sha=$MAIN_TIP" >> "$GITHUB_OUTPUT"
          echo "ci_url=$CI_URL" >> "$GITHUB_OUTPUT"
          echo "## Owner-authorized full-history recalculation" >> "$GITHUB_STEP_SUMMARY"
          echo "- exact SHA: \`$MAIN_TIP\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- current-main CI: $CI_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- profile: \`1\`" >> "$GITHUB_STEP_SUMMARY"

  backup_rehearse:
    name: Backup and rehearse on disposable PostgreSQL
    needs: authorize
    if: needs.authorize.outputs.release_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: bodycast_restore
          POSTGRES_USER: bodycast_restore
          POSTGRES_PASSWORD: isolated_restore_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bodycast_restore -d bodycast_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact current main tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Recheck active owner run and current main before production credentials
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/krustallik/body-model/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/current-recalc-run.json"
          node --input-type=module - "$RUNNER_TEMP/current-recalc-run.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { assertTrustedOwnerWorkflowRun } from "./scripts/github-owner-identity.mjs";
          assertTrustedOwnerWorkflowRun(JSON.parse(readFileSync(process.argv[2], "utf8")), {
            actorId: process.env.DISPATCH_ACTOR_ID,
            workflowPath: ".github/workflows/production-full-history-recalculate.yml",
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            ref: "refs/heads/main",
            sha: process.env.GITHUB_SHA,
            requireInProgress: true,
          });
          NODE
          [[ "$DISPATCH_ACTOR_ID" == "126446430" && "$(gh api repos/krustallik/body-model/commits/main --jq .sha)" == "$RELEASE_SHA" ]] || {
            echo "::error::Owner identity or current main changed before production access."; exit 1;
          }
      - name: Validate protected SSH and backup inputs
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_HOST: ${{ secrets.APP_HOST }}
          CADDY_ROUTES_PATH: ${{ secrets.CADDY_ROUTES_PATH }}
          PRODUCTION_BACKUP_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -Eeuo pipefail
          : "$SSH_PRIVATE_KEY"; : "$SSH_HOST"; : "$SSH_USER"; : "$SSH_PORT"; : "$SSH_HOST_FINGERPRINT"
          : "$DEPLOY_PATH"; : "$APP_HOST"; : "$CADDY_ROUTES_PATH"; : "$PRODUCTION_BACKUP_ENCRYPTION_KEY"
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ && "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid production SSH host or user."; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT > 0 && SSH_PORT <= 65535 )) || { echo "::error::Invalid production SSH port."; exit 1; }
          [[ "$SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || { echo "::error::Invalid pinned production SSH fingerprint."; exit 1; }
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != *$'\n'* ]] || { echo "::error::DEPLOY_PATH must be an absolute single-line path."; exit 1; }
          [[ "$APP_HOST" =~ ^[A-Za-z0-9.-]+$ && "$CADDY_ROUTES_PATH" == /* && "$CADDY_ROUTES_PATH" != *$'\n'* ]] || { echo "::error::Production traffic topology inputs are invalid."; exit 1; }
          node --input-type=module -e 'import { decodeBackupKey } from "./scripts/production-backup-envelope.mjs"; decodeBackupKey(process.env.PRODUCTION_BACKUP_ENCRYPTION_KEY);'
          install -d -m 700 "$RUNNER_TEMP/bodycast-recalc-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/bodycast-recalc-ssh/id"
          chmod 600 "$RUNNER_TEMP/bodycast-recalc-ssh/id"
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" > "$RUNNER_TEMP/bodycast-recalc-ssh/candidate" 2>/dev/null
          node scripts/filter-ssh-known-hosts.mjs "$RUNNER_TEMP/bodycast-recalc-ssh/candidate" "$RUNNER_TEMP/bodycast-recalc-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/bodycast-recalc-ssh/known_hosts"
          echo "BODYCAST_SSH_KEY=$RUNNER_TEMP/bodycast-recalc-ssh/id" >> "$GITHUB_ENV"
          echo "BODYCAST_KNOWN_HOSTS=$RUNNER_TEMP/bodycast-recalc-ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Drain writers under maintenance before backup
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_HOST: ${{ secrets.APP_HOST }}
          CADDY_ROUTES_PATH: ${{ secrets.CADDY_ROUTES_PATH }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w0)"
          APP_HOST_B64="$(printf '%s' "$APP_HOST" | base64 -w0)"
          ROUTES_PATH_B64="$(printf '%s' "$CADDY_ROUTES_PATH" | base64 -w0)"
          REMOTE_SCRIPT="$(cat <<'REMOTE'
          set -Eeuo pipefail
          RELEASE_SHA="$1"
          DEPLOY_PATH="$(printf '%s' "$2" | base64 --decode)"
          APP_HOST="$(printf '%s' "$3" | base64 --decode)"
          CADDY_ROUTES_PATH="$(printf '%s' "$4" | base64 --decode)"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ && "$DEPLOY_PATH" == /* && "$APP_HOST" =~ ^[A-Za-z0-9.-]+$ && "$CADDY_ROUTES_PATH" == /* ]] || exit 2
          cd -- "$DEPLOY_PATH"
          [[ "$(git rev-parse --show-toplevel)" == "$DEPLOY_PATH" && -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || {
            echo "Production checkout is dirty or does not match DEPLOY_PATH." >&2; exit 1;
          }
          git fetch --no-tags origin "$RELEASE_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$RELEASE_SHA" ]] || { echo "Canonical main advanced before backup." >&2; exit 1; }
          git checkout --detach "$RELEASE_SHA"
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" && -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || exit 1
          APP_SHA="$(docker inspect --format '{{index .Config.Labels "org.bodycast.release-sha"}}' bodycast-app-prod)"
          APP_HEALTH="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' bodycast-app-prod)"
          [[ "$APP_SHA" == "$RELEASE_SHA" && "$APP_HEALTH" == "healthy" ]] || { echo "Exact-SHA app is absent or unhealthy before backup." >&2; exit 1; }
          APP_HOST="$APP_HOST" CADDY_ROUTES_PATH="$CADDY_ROUTES_PATH" BODYCAST_DEPLOY_SHA="$RELEASE_SHA" \
            exec bash scripts/production-traffic-cutover.sh maintenance
          REMOTE
          )"
          REMOTE_SCRIPT_B64="$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)"
          REMOTE_COMMAND="bash -c \"\$(printf '%s' '$REMOTE_SCRIPT_B64' | base64 --decode)\" -- '$RELEASE_SHA' '$DEPLOY_PATH_B64' '$APP_HOST_B64' '$ROUTES_PATH_B64'"
          SSH=(ssh -p "$SSH_PORT" -i "$BODYCAST_SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$BODYCAST_KNOWN_HOSTS" -o ConnectTimeout=10)
          timeout 30m "${SSH[@]}" "$SSH_USER@$SSH_HOST" "$REMOTE_COMMAND"
      - name: Capture encrypted production backup
        id: backup
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          PRODUCTION_BACKUP_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$RUNNER_TEMP/bodycast-backup-artifact"
          BACKUP_FILE="$RUNNER_TEMP/bodycast-backup-artifact/production-backup.pgdump.enc"
          SSH=(ssh -p "$SSH_PORT" -i "$BODYCAST_SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$BODYCAST_KNOWN_HOSTS" -o ConnectTimeout=10)
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" \
            'docker exec bodycast-db-prod sh -c '\''printf "BODYCAST_BACKUP_STARTED_AT=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >&2; exec pg_dump --format=custom --no-owner --no-privileges --username=bodycast --dbname=bodycast'\''' \
            2> "$RUNNER_TEMP/pgdump-start.log" \
            | node scripts/production-backup-envelope.mjs encrypt --output "$BACKUP_FILE"
          SNAPSHOT_AT="$(sed -n 's/^BODYCAST_BACKUP_STARTED_AT=//p' "$RUNNER_TEMP/pgdump-start.log" | tail -n1)"
          [[ "$SNAPSHOT_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || { echo "::error::Could not prove pg_dump start timestamp."; exit 1; }
          chmod 600 "$BACKUP_FILE"
          echo "file=$BACKUP_FILE" >> "$GITHUB_OUTPUT"
          echo "snapshot_at=$SNAPSHOT_AT" >> "$GITHUB_OUTPUT"
      - name: Restore snapshot and rehearse full-history recalculation
        env:
          BACKUP_FILE: ${{ steps.backup.outputs.file }}
          PRODUCTION_BACKUP_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_BACKUP_ENCRYPTION_KEY }}
          DATABASE_URL: postgresql://bodycast_restore:isolated_restore_test_password@127.0.0.1:5432/bodycast_restore
          PGPASSWORD: isolated_restore_test_password
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          node scripts/restore-encrypted-postgres-backup.mjs
          docker build --target migrator -t "bodycast-migrator:rehearse-$RELEASE_SHA" .
          docker run --rm --network host \
            -e "DATABASE_URL=$DATABASE_URL" \
            "bodycast-migrator:rehearse-$RELEASE_SHA" \
            node /app/scripts/production-full-history-recalculate.mjs \
            --full-history-recalculate --owner-authorized --profile-id 1 \
            | tee "$RUNNER_TEMP/rehearsal-recalculate.json"
          node --input-type=module - "$RUNNER_TEMP/rehearsal-recalculate.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const result = JSON.parse(readFileSync(process.argv[2], "utf8").trim().split(/\r?\n/).at(-1));
          if (result.command !== "production-full-history-recalculate" || result.current !== true
              || result.profileId !== 1 || result.unifiedRolloutEpoch !== 0
              || result.productionPublishedGeneration !== result.invalidationGeneration
              || result.unifiedPublishedGeneration !== result.invalidationGeneration) {
            throw new Error("Isolated full-history recalculation rehearsal did not publish current V3 generations.");
          }
          NODE
          docker run --rm --network host \
            -e "DATABASE_URL=$DATABASE_URL" \
            "bodycast-migrator:rehearse-$RELEASE_SHA" \
            node /app/scripts/unified-v3-postflight.mjs --profile-id 1 \
            | tee "$RUNNER_TEMP/rehearsal-v3-postflight.json"
          echo "Isolated rehearsal published current production + Unified V3 generations." >> "$GITHUB_STEP_SUMMARY"
      - name: Restart exact-SHA app behind maintenance after backup drain
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w0)"
          REMOTE_SCRIPT="$(cat <<'REMOTE'
          set -Eeuo pipefail
          RELEASE_SHA="$1"
          DEPLOY_PATH="$(printf '%s' "$2" | base64 --decode)"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ && "$DEPLOY_PATH" == /* ]] || exit 2
          cd -- "$DEPLOY_PATH"
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || exit 1
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' bodycast-app:latest)"
          [[ "$IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          BODYCAST_DEPLOY_SHA="$RELEASE_SHA" docker compose -f docker-compose.prod.yml up -d --no-deps --no-build app
          APP_SHA="$(docker inspect --format '{{index .Config.Labels "org.bodycast.release-sha"}}' bodycast-app-prod)"
          APP_IMAGE="$(docker inspect --format '{{.Image}}' bodycast-app-prod)"
          APP_HEALTH="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' bodycast-app-prod)"
          [[ "$APP_SHA" == "$RELEASE_SHA" && "$APP_IMAGE" == "$IMAGE_ID" && "$APP_HEALTH" == "healthy" ]] || exit 1
          REMOTE
          )"
          REMOTE_SCRIPT_B64="$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)"
          REMOTE_COMMAND="bash -c \"\$(printf '%s' '$REMOTE_SCRIPT_B64' | base64 --decode)\" -- '$RELEASE_SHA' '$DEPLOY_PATH_B64'"
          SSH=(ssh -p "$SSH_PORT" -i "$BODYCAST_SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$BODYCAST_KNOWN_HOSTS" -o ConnectTimeout=10)
          timeout 20m "${SSH[@]}" "$SSH_USER@$SSH_HOST" "$REMOTE_COMMAND"
      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-history-recalculate-backup-${{ needs.authorize.outputs.release_sha }}
          path: ${{ steps.backup.outputs.file }}
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/bodycast-recalc-ssh"

  production_recalculate:
    name: Recalculate production history under release lock
    needs: [authorize, backup_rehearse]
    if: needs.authorize.outputs.release_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - name: Checkout exact current main tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Recheck active owner run and current main before production credentials
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/krustallik/body-model/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/current-recalc-run.json"
          node --input-type=module - "$RUNNER_TEMP/current-recalc-run.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { assertTrustedOwnerWorkflowRun } from "./scripts/github-owner-identity.mjs";
          assertTrustedOwnerWorkflowRun(JSON.parse(readFileSync(process.argv[2], "utf8")), {
            actorId: process.env.DISPATCH_ACTOR_ID,
            workflowPath: ".github/workflows/production-full-history-recalculate.yml",
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            ref: "refs/heads/main",
            sha: process.env.GITHUB_SHA,
            requireInProgress: true,
          });
          NODE
          [[ "$DISPATCH_ACTOR_ID" == "126446430" && "$(gh api repos/krustallik/body-model/commits/main --jq .sha)" == "$RELEASE_SHA" ]] || {
            echo "::error::Owner identity or current main changed before production access."; exit 1;
          }
      - name: Validate protected SSH inputs and pin production host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_HOST: ${{ secrets.APP_HOST }}
          CADDY_ROUTES_PATH: ${{ secrets.CADDY_ROUTES_PATH }}
        run: |
          set -Eeuo pipefail
          : "$SSH_PRIVATE_KEY"; : "$SSH_HOST"; : "$SSH_USER"; : "$SSH_PORT"; : "$SSH_HOST_FINGERPRINT"; : "$DEPLOY_PATH"; : "$APP_HOST"; : "$CADDY_ROUTES_PATH"
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ && "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid production SSH host or user."; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT > 0 && SSH_PORT <= 65535 )) || { echo "::error::Invalid production SSH port."; exit 1; }
          [[ "$SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || { echo "::error::Invalid pinned production SSH fingerprint."; exit 1; }
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != *$'\n'* ]] || { echo "::error::DEPLOY_PATH must be an absolute single-line path."; exit 1; }
          [[ "$APP_HOST" =~ ^[A-Za-z0-9.-]+$ && "$CADDY_ROUTES_PATH" == /* && "$CADDY_ROUTES_PATH" != *$'\n'* ]] || { echo "::error::Production traffic topology inputs are invalid."; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/bodycast-recalc-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/bodycast-recalc-ssh/id"
          chmod 600 "$RUNNER_TEMP/bodycast-recalc-ssh/id"
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" > "$RUNNER_TEMP/bodycast-recalc-ssh/candidate" 2>/dev/null
          node scripts/filter-ssh-known-hosts.mjs "$RUNNER_TEMP/bodycast-recalc-ssh/candidate" "$RUNNER_TEMP/bodycast-recalc-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/bodycast-recalc-ssh/known_hosts"
          echo "BODYCAST_SSH_KEY=$RUNNER_TEMP/bodycast-recalc-ssh/id" >> "$GITHUB_ENV"
          echo "BODYCAST_KNOWN_HOSTS=$RUNNER_TEMP/bodycast-recalc-ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Recalculate full history and verify V3 postflight under one host lock
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_HOST: ${{ secrets.APP_HOST }}
          CADDY_ROUTES_PATH: ${{ secrets.CADDY_ROUTES_PATH }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$(gh api repos/krustallik/body-model/commits/main --jq .sha)" == "$RELEASE_SHA" ]] || {
            echo "::error::Canonical main advanced immediately before SSH."; exit 1;
          }
          DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w0)"
          APP_HOST_B64="$(printf '%s' "$APP_HOST" | base64 -w0)"
          ROUTES_PATH_B64="$(printf '%s' "$CADDY_ROUTES_PATH" | base64 -w0)"
          REMOTE_SCRIPT="$(cat <<'REMOTE'
          set -Eeuo pipefail
          RELEASE_SHA="$1"
          DEPLOY_PATH="$(printf '%s' "$2" | base64 --decode)"
          APP_HOST="$(printf '%s' "$3" | base64 --decode)"
          CADDY_ROUTES_PATH="$(printf '%s' "$4" | base64 --decode)"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ && "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != *$'\n'* \
            && "$APP_HOST" =~ ^[A-Za-z0-9.-]+$ && "$CADDY_ROUTES_PATH" == /* && "$CADDY_ROUTES_PATH" != *$'\n'* ]] || exit 2
          cd -- "$DEPLOY_PATH"
          [[ "$(git rev-parse --show-toplevel)" == "$DEPLOY_PATH" && -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || {
            echo "Production checkout is dirty or does not match DEPLOY_PATH." >&2; exit 1;
          }
          git fetch --no-tags origin "$RELEASE_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$RELEASE_SHA" ]] || { echo "Canonical main advanced before recalculation." >&2; exit 1; }
          git checkout --detach "$RELEASE_SHA"
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" && -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || exit 1
          APP_SHA="$(docker inspect --format '{{index .Config.Labels "org.bodycast.release-sha"}}' bodycast-app-prod)"
          APP_HEALTH="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' bodycast-app-prod)"
          [[ "$APP_SHA" == "$RELEASE_SHA" && "$APP_HEALTH" == "healthy" ]] || { echo "Exact-SHA app is absent or unhealthy." >&2; exit 1; }
          APP_HOST="$APP_HOST" CADDY_ROUTES_PATH="$CADDY_ROUTES_PATH" BODYCAST_DEPLOY_SHA="$RELEASE_SHA" \
            exec bash scripts/production-traffic-cutover.sh full-history-recalculate
          REMOTE
          )"
          REMOTE_SCRIPT_B64="$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)"
          REMOTE_COMMAND="bash -c \"\$(printf '%s' '$REMOTE_SCRIPT_B64' | base64 --decode)\" -- '$RELEASE_SHA' '$DEPLOY_PATH_B64' '$APP_HOST_B64' '$ROUTES_PATH_B64'"
          SSH=(ssh -p "$SSH_PORT" -i "$BODYCAST_SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$BODYCAST_KNOWN_HOSTS" -o ConnectTimeout=10)
          timeout 180m "${SSH[@]}" "$SSH_USER@$SSH_HOST" "$REMOTE_COMMAND"
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/bodycast-recalc-ssh"
