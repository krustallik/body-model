name: Manual production migration

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full SHA to migrate; must equal current canonical main
        required: true
        type: string
      manifest_id:
        description: Closed reviewed migration set
        required: true
        type: choice
        options:
          - active-energy-unified-v1
      confirmation:
        description: Type MIGRATE_PRODUCTION to request a signed, current-state authorization
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bodycast-production-migration
  cancel-in-progress: false

jobs:
  authorize:
    name: Select latest exact preflight evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_sha: ${{ steps.select.outputs.release_sha }}
      manifest_id: ${{ steps.select.outputs.manifest_id }}
      preflight_run_id: ${{ steps.select.outputs.preflight_run_id }}
      preflight_run_attempt: ${{ steps.select.outputs.preflight_run_attempt }}
      preflight_artifact_id: ${{ steps.select.outputs.preflight_artifact_id }}
      preflight_artifact_digest: ${{ steps.select.outputs.preflight_artifact_digest }}
      preflight_artifact_name: ${{ steps.select.outputs.preflight_artifact_name }}
      preflight_evidence_artifact_id: ${{ steps.select.outputs.preflight_evidence_artifact_id }}
      preflight_evidence_artifact_digest: ${{ steps.select.outputs.preflight_evidence_artifact_digest }}
      preflight_evidence_artifact_name: ${{ steps.select.outputs.preflight_evidence_artifact_name }}
      preflight_url: ${{ steps.select.outputs.preflight_url }}
      workflow_id: ${{ steps.select.outputs.workflow_id }}
      ci_url: ${{ steps.select.outputs.ci_url }}
    steps:
      - name: Checkout exact current main tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate canonical SHA, owner confirmation, latest CI, and latest exact preflight attempt
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_SHA: ${{ inputs.release_sha }}
          MANIFEST_ID: ${{ inputs.manifest_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "krustallik/body-model" ]] || { echo "::error::Canonical repository only."; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Dispatch this workflow from main."; exit 1; }
          [[ "$CONFIRMATION" == "MIGRATE_PRODUCTION" ]] || { echo "::error::Exact migration request confirmation is required."; exit 1; }
          [[ "$MANIFEST_ID" == "active-energy-unified-v1" ]] || { echo "::error::Manifest is not in the closed allowlist."; exit 1; }
          [[ "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release_sha must be a full lowercase SHA."; exit 1; }
          git fetch --no-tags origin main
          git -c remote.bodycast-canonical.url=https://github.com/krustallik/body-model.git fetch --no-tags bodycast-canonical +refs/heads/main:refs/remotes/bodycast-canonical/main
          MAIN_TIP="$(git rev-parse refs/remotes/bodycast-canonical/main)"
          [[ "$MAIN_TIP" == "$GITHUB_SHA" && "$MAIN_TIP" == "$(git rev-parse origin/main)" && "$MAIN_TIP" == "$DISPATCH_SHA" ]] || {
            echo "::error::Dispatch SHA, checkout, origin/main, and canonical main must be identical."; exit 1;
          }
          CI_WORKFLOW_ID="$(gh api repos/krustallik/body-model/actions/workflows/ci.yml --jq .id)"
          PREFLIGHT_WORKFLOW_ID="$(gh api repos/krustallik/body-model/actions/workflows/production-migration-preflight.yml --jq .id)"
          gh api --paginate --jq '.workflow_runs[] | @json' \
            "repos/krustallik/body-model/actions/workflows/$CI_WORKFLOW_ID/runs?per_page=100" > "$RUNNER_TEMP/ci-runs.ndjson"
          CI_URL="$(node --input-type=module - "$RUNNER_TEMP/ci-runs.ndjson" "$MAIN_TIP" <<'NODE'
          import { readFileSync } from "node:fs";
          const runs = readFileSync(process.argv[2], "utf8").trim().split(/\r?\n/).filter(Boolean).map(JSON.parse)
            .filter((run) => run.head_sha === process.argv[3] && run.head_branch === "main" && run.event === "push");
          runs.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || Number(b.run_attempt) - Number(a.run_attempt));
          const latest = runs[0];
          if (!latest || latest.status !== "completed" || latest.conclusion !== "success") throw new Error("Latest current-main CI attempt is not successful.");
          console.log(latest.html_url);
          NODE
          )"
          gh api --paginate --jq '.workflow_runs[] | @json' \
            "repos/krustallik/body-model/actions/workflows/$PREFLIGHT_WORKFLOW_ID/runs?per_page=100" \
            > "$RUNNER_TEMP/preflight-runs.ndjson"
          PRE_RUN_ID="$(node scripts/production-migration-select-preflight.mjs --select-run "$RUNNER_TEMP/preflight-runs.ndjson" "$PREFLIGHT_WORKFLOW_ID" "$MAIN_TIP" "$MANIFEST_ID" | jq -r '.id')" || {
            echo "::error::No latest successful admitted matching preflight run; a newer admitted failed/cancelled/in-progress attempt blocks older success."
            exit 1
          }
          gh api --paginate --jq '.artifacts[] | @json' "repos/krustallik/body-model/actions/runs/$PRE_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/preflight-artifacts.ndjson"
          node scripts/production-migration-select-preflight.mjs --select "$RUNNER_TEMP/preflight-runs.ndjson" "$RUNNER_TEMP/preflight-artifacts.ndjson" "$PREFLIGHT_WORKFLOW_ID" "$MAIN_TIP" "$MANIFEST_ID" \
            > "$RUNNER_TEMP/selected-preflight.json"
          PRE_RUN_ID="$(jq -r '.run.id' "$RUNNER_TEMP/selected-preflight.json")"
          PRE_ATTEMPT="$(jq -r '.run.runAttempt' "$RUNNER_TEMP/selected-preflight.json")"
          ARTIFACT_ID="$(jq -r '.backupArtifact.id' "$RUNNER_TEMP/selected-preflight.json")"
          ARTIFACT_DIGEST="$(jq -r '.backupArtifact.digest' "$RUNNER_TEMP/selected-preflight.json")"
          ARTIFACT_NAME="$(jq -r '.backupArtifactName' "$RUNNER_TEMP/selected-preflight.json")"
          EVIDENCE_ARTIFACT_ID="$(jq -r '.evidenceArtifact.id' "$RUNNER_TEMP/selected-preflight.json")"
          EVIDENCE_ARTIFACT_DIGEST="$(jq -r '.evidenceArtifact.digest' "$RUNNER_TEMP/selected-preflight.json")"
          EVIDENCE_ARTIFACT_NAME="$(jq -r '.artifactName' "$RUNNER_TEMP/selected-preflight.json")"
          PRE_URL="$(jq -r '.run.htmlUrl' "$RUNNER_TEMP/selected-preflight.json")"
          echo "release_sha=$MAIN_TIP" >> "$GITHUB_OUTPUT"
          echo "manifest_id=$MANIFEST_ID" >> "$GITHUB_OUTPUT"
          echo "preflight_run_id=$PRE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "preflight_run_attempt=$PRE_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "preflight_artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "preflight_artifact_digest=$ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
          echo "preflight_artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "preflight_evidence_artifact_id=$EVIDENCE_ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "preflight_evidence_artifact_digest=$EVIDENCE_ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
          echo "preflight_evidence_artifact_name=$EVIDENCE_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "preflight_url=$PRE_URL" >> "$GITHUB_OUTPUT"
          echo "workflow_id=$(gh api repos/krustallik/body-model/actions/workflows/production-migrate.yml --jq .id)" >> "$GITHUB_OUTPUT"
          echo "ci_url=$CI_URL" >> "$GITHUB_OUTPUT"
          {
            echo "## Signed production migration request"
            echo ""
            echo "- release SHA: $MAIN_TIP"
            echo "- manifest: $MANIFEST_ID"
            echo "- current-main CI: $CI_URL"
            echo "- selected latest exact preflight: $PRE_URL (run $PRE_RUN_ID attempt $PRE_ATTEMPT)"
            echo "- backup artifact: $ARTIFACT_ID ($ARTIFACT_DIGEST)"
            echo "- this job did not access production credentials or run DDL"
          } >> "$GITHUB_STEP_SUMMARY"

  sign:
    name: Sign migration authorization envelope
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-migration-authorization
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Re-select current latest preflight and verify immutable artifact metadata
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          MANIFEST_ID: ${{ needs.authorize.outputs.manifest_id }}
          EXPECTED_PREFLIGHT_RUN_ID: ${{ needs.authorize.outputs.preflight_run_id }}
          EXPECTED_PREFLIGHT_ATTEMPT: ${{ needs.authorize.outputs.preflight_run_attempt }}
          EXPECTED_BACKUP_ARTIFACT_ID: ${{ needs.authorize.outputs.preflight_artifact_id }}
          EXPECTED_BACKUP_ARTIFACT_DIGEST: ${{ needs.authorize.outputs.preflight_artifact_digest }}
          EXPECTED_EVIDENCE_ARTIFACT_ID: ${{ needs.authorize.outputs.preflight_evidence_artifact_id }}
          EXPECTED_EVIDENCE_ARTIFACT_DIGEST: ${{ needs.authorize.outputs.preflight_evidence_artifact_digest }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "krustallik/body-model" && "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Canonical main only."; exit 1; }
          git -c remote.bodycast-canonical.url=https://github.com/krustallik/body-model.git fetch --no-tags bodycast-canonical +refs/heads/main:refs/remotes/bodycast-canonical/main
          [[ "$(git rev-parse refs/remotes/bodycast-canonical/main)" == "$RELEASE_SHA" && "$GITHUB_SHA" == "$RELEASE_SHA" ]] || {
            echo "::error::Canonical main moved before signing."; exit 1;
          }
          PREFLIGHT_WORKFLOW_ID="$(gh api repos/krustallik/body-model/actions/workflows/production-migration-preflight.yml --jq .id)"
          gh api --paginate --jq '.workflow_runs[] | @json' \
            "repos/krustallik/body-model/actions/workflows/$PREFLIGHT_WORKFLOW_ID/runs?per_page=100" > "$RUNNER_TEMP/preflight-runs.ndjson"
          gh api --paginate --jq '.artifacts[] | @json' \
            "repos/krustallik/body-model/actions/runs/$EXPECTED_PREFLIGHT_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/preflight-artifacts.ndjson"
          node scripts/production-migration-select-preflight.mjs --select "$RUNNER_TEMP/preflight-runs.ndjson" "$RUNNER_TEMP/preflight-artifacts.ndjson" "$PREFLIGHT_WORKFLOW_ID" "$RELEASE_SHA" "$MANIFEST_ID" \
            > "$RUNNER_TEMP/selected-preflight.json"
          node --input-type=module - "$RUNNER_TEMP/selected-preflight.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const s = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (String(s.run.id) !== process.env.EXPECTED_PREFLIGHT_RUN_ID
            || Number(s.run.runAttempt) !== Number(process.env.EXPECTED_PREFLIGHT_ATTEMPT)
            || String(s.backupArtifact.id) !== process.env.EXPECTED_BACKUP_ARTIFACT_ID
            || s.backupArtifact.digest !== process.env.EXPECTED_BACKUP_ARTIFACT_DIGEST
            || String(s.evidenceArtifact.id) !== process.env.EXPECTED_EVIDENCE_ARTIFACT_ID
            || s.evidenceArtifact.digest !== process.env.EXPECTED_EVIDENCE_ARTIFACT_DIGEST) {
            throw new Error("A newer admitted preflight attempt or changed artifact superseded the authorization request.");
          }
          NODE
          BUNDLE="$RUNNER_TEMP/preflight-evidence"
          mkdir -m 700 "$BUNDLE"
          gh run download "$EXPECTED_PREFLIGHT_RUN_ID" --repo krustallik/body-model \
            --name "$(jq -r '.artifactName' "$RUNNER_TEMP/selected-preflight.json")" --dir "$BUNDLE"
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
      - name: Create signed authorization from verified run and artifact evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          MANIFEST_ID: ${{ needs.authorize.outputs.manifest_id }}
          AUTHORIZATION_WORKFLOW_ID: ${{ needs.authorize.outputs.workflow_id }}
          PRODUCTION_MIGRATION_SIGNING_KEY_ID: ${{ secrets.PRODUCTION_MIGRATION_SIGNING_KEY_ID }}
          PRODUCTION_MIGRATION_ED25519_PRIVATE_KEY: ${{ secrets.PRODUCTION_MIGRATION_ED25519_PRIVATE_KEY }}
          EVIDENCE_BUNDLE: ${{ steps.evidence.outputs.bundle }}
        run: |
          set -Eeuo pipefail
          MAIN_TIP="$(gh api repos/krustallik/body-model/commits/main --jq .sha)"
          [[ "$MAIN_TIP" == "$RELEASE_SHA" ]] || { echo "::error::Main moved immediately before signing."; exit 1; }
          : "$PRODUCTION_MIGRATION_SIGNING_KEY_ID"
          : "$PRODUCTION_MIGRATION_ED25519_PRIVATE_KEY"
          node --input-type=module - "$RUNNER_TEMP/selected-preflight.json" "$RUNNER_TEMP/trusted-run.json" "$RUNNER_TEMP/trusted-backup-artifact.json" "$MAIN_TIP" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const selected = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const main = process.argv[5];
          const run = {
            ...selected.run,
            manifestId: process.env.MANIFEST_ID,
            authorizationWorkflowId: process.env.AUTHORIZATION_WORKFLOW_ID,
            authorizationRunId: process.env.GITHUB_RUN_ID,
            authorizationRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            canonicalMainSha: main,
          };
          const artifact = {
            ...selected.backupArtifact,
            authorizationWorkflowId: process.env.AUTHORIZATION_WORKFLOW_ID,
            authorizationRunId: process.env.GITHUB_RUN_ID,
            authorizationRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
          };
          writeFileSync(process.argv[3], JSON.stringify(run));
          writeFileSync(process.argv[4], JSON.stringify(artifact));
          NODE
          mkdir -m 700 "$RUNNER_TEMP/signed-migration-context"
          node scripts/production-migration-sign.mjs \
            "$EVIDENCE_BUNDLE/preflight-evidence.json" \
            "$EVIDENCE_BUNDLE/preflight-result.json" \
            "$EVIDENCE_BUNDLE/restore-result.json" \
            "$RUNNER_TEMP/trusted-run.json" \
            "$RUNNER_TEMP/trusted-backup-artifact.json" \
            "$RUNNER_TEMP/signed-migration-context/authorization-envelope.json" \
            > "$RUNNER_TEMP/authorization-signature-summary.json"
          cp "$EVIDENCE_BUNDLE/preflight-evidence.json" "$RUNNER_TEMP/signed-migration-context/preflight-evidence.json"
          cp "$EVIDENCE_BUNDLE/preflight-result.json" "$RUNNER_TEMP/signed-migration-context/preflight-result.json"
          cp "$EVIDENCE_BUNDLE/restore-result.json" "$RUNNER_TEMP/signed-migration-context/restore-result.json"
          cp "$RUNNER_TEMP/trusted-backup-artifact.json" "$RUNNER_TEMP/signed-migration-context/artifact-metadata.json"
          chmod 600 "$RUNNER_TEMP/signed-migration-context/"*
          FILES=(authorization-envelope.json preflight-evidence.json preflight-result.json restore-result.json artifact-metadata.json)
          printf '%s\n' "${FILES[@]}" | sort > "$RUNNER_TEMP/expected-sign-bundle-files.txt"
          find "$RUNNER_TEMP/signed-migration-context" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort > "$RUNNER_TEMP/actual-sign-bundle-files.txt"
          diff -u "$RUNNER_TEMP/expected-sign-bundle-files.txt" "$RUNNER_TEMP/actual-sign-bundle-files.txt"
          for name in "${FILES[@]}"; do
            test -f "$RUNNER_TEMP/signed-migration-context/$name"
            test ! -L "$RUNNER_TEMP/signed-migration-context/$name"
          done
          cat "$RUNNER_TEMP/authorization-signature-summary.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed authorization bundle for protected execution job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bodycast-migration-auth-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/signed-migration-context/authorization-envelope.json
            ${{ runner.temp }}/signed-migration-context/preflight-evidence.json
            ${{ runner.temp }}/signed-migration-context/preflight-result.json
            ${{ runner.temp }}/signed-migration-context/restore-result.json
            ${{ runner.temp }}/signed-migration-context/artifact-metadata.json
          if-no-files-found: error
          retention-days: 7
  execute:
    name: Final live guard and authorized migration
    needs: [authorize, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout exact authorized release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Recheck current canonical main before production SSH
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" && "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || {
            echo "::error::Migration execution must use the exact main workflow SHA."; exit 1;
          }
          TIP="$(gh api repos/krustallik/body-model/commits/main --jq .sha)"
          [[ "$TIP" == "$RELEASE_SHA" ]] || { echo "::error::Canonical main moved after signing."; exit 1; }
      - name: Download only the signed context artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          BUNDLE_NAME="bodycast-migration-auth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$RUNNER_TEMP/signed-migration-context"
          gh run download "$GITHUB_RUN_ID" --repo krustallik/body-model --name "$BUNDLE_NAME" --dir "$RUNNER_TEMP/signed-migration-context"
          for name in authorization-envelope.json preflight-result.json preflight-evidence.json restore-result.json artifact-metadata.json; do
            test -f "$RUNNER_TEMP/signed-migration-context/$name"
            test ! -L "$RUNNER_TEMP/signed-migration-context/$name"
          done
      - name: Validate protected production SSH and pin host key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          : "$SSH_PRIVATE_KEY"; : "$SSH_HOST"; : "$SSH_USER"; : "$SSH_PORT"; : "$SSH_HOST_FINGERPRINT"; : "$DEPLOY_PATH"
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || { echo "::error::Invalid SSH host."; exit 1; }
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid SSH user."; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT > 0 && SSH_PORT <= 65535 )) || { echo "::error::Invalid SSH port."; exit 1; }
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != *$'\n'* ]] || { echo "::error::DEPLOY_PATH must be an absolute single-line path."; exit 1; }
          [[ "$SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || { echo "::error::Invalid pinned host fingerprint."; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/bodycast-migrate-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/bodycast-migrate-ssh/id"
          chmod 600 "$RUNNER_TEMP/bodycast-migrate-ssh/id"
          echo "BODYCAST_SSH_KEY=$RUNNER_TEMP/bodycast-migrate-ssh/id" >> "$GITHUB_ENV"
          echo "BODYCAST_KNOWN_HOSTS=$RUNNER_TEMP/bodycast-migrate-ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Trust only the SSH key matching the pinned fingerprint
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" > "$RUNNER_TEMP/bodycast-migrate-ssh/candidate" 2>/dev/null
          test -s "$RUNNER_TEMP/bodycast-migrate-ssh/candidate"
          node scripts/filter-ssh-known-hosts.mjs "$RUNNER_TEMP/bodycast-migrate-ssh/candidate" "$BODYCAST_KNOWN_HOSTS"
          chmod 600 "$BODYCAST_KNOWN_HOSTS"
      - name: Stream signed evidence files to private remote temporary context
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -Eeuo pipefail
          BUNDLE="$RUNNER_TEMP/signed-migration-context"
          FILES=(authorization-envelope.json preflight-result.json preflight-evidence.json restore-result.json artifact-metadata.json)
          for name in "${FILES[@]}"; do
            test -f "$BUNDLE/$name" && test ! -L "$BUNDLE/$name"
          done
          TAR_FILE="$RUNNER_TEMP/bodycast-signed-context.tar.gz"
          tar -czf "$TAR_FILE" -C "$BUNDLE" "${FILES[@]}"
          printf '%s\n' "${FILES[@]}" | sort > "$RUNNER_TEMP/expected-context-files.txt"
          tar -tzf "$TAR_FILE" | sort > "$RUNNER_TEMP/actual-context-files.txt"
          diff -u "$RUNNER_TEMP/expected-context-files.txt" "$RUNNER_TEMP/actual-context-files.txt"
          REMOTE_CONTEXT="/tmp/bodycast-migration-context-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          SSH=(ssh -p "$SSH_PORT" -i "$BODYCAST_SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$BODYCAST_KNOWN_HOSTS" -o ConnectTimeout=10)
          tar -xOzf "$TAR_FILE" >/dev/null
          cat "$TAR_FILE" | "${SSH[@]}" "$SSH_USER@$SSH_HOST" \
            "set -Eeuo pipefail; umask 077; mkdir -m 700 '$REMOTE_CONTEXT'; tar -xzf - --no-same-owner -C '$REMOTE_CONTEXT'"
      - name: Run canonical fetch, final signed readiness guard, Prisma migration, and postflight in one remote process
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          MANIFEST_ID: ${{ needs.authorize.outputs.manifest_id }}
          AUTHORIZATION_WORKFLOW_ID: ${{ needs.authorize.outputs.workflow_id }}
          EXPECTED_PREFLIGHT_RUN_ID: ${{ needs.authorize.outputs.preflight_run_id }}
          EXPECTED_PREFLIGHT_ATTEMPT: ${{ needs.authorize.outputs.preflight_run_attempt }}
          REMOTE_CONTEXT: /tmp/bodycast-migration-context-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w0)"
          REMOTE_CONTEXT="/tmp/bodycast-migration-context-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          SSH=(ssh -p "$SSH_PORT" -i "$BODYCAST_SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$BODYCAST_KNOWN_HOSTS" -o ConnectTimeout=10)
          REMOTE_SCRIPT="$(cat <<'REMOTE'
          set -Eeuo pipefail
          RELEASE_SHA="$1"
          MANIFEST_ID="$2"
          DEPLOY_PATH="$(printf '%s' "$3" | base64 --decode)"
          CONTEXT_DIR="$4"
          AUTHORIZATION_WORKFLOW_ID="$5"
          AUTHORIZATION_RUN_ID="$6"
          AUTHORIZATION_RUN_ATTEMPT="$7"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid release SHA." >&2; exit 1; }
          [[ "$MANIFEST_ID" == "active-energy-unified-v1" ]] || { echo "Unreviewed manifest." >&2; exit 1; }
          [[ "$AUTHORIZATION_WORKFLOW_ID" =~ ^[1-9][0-9]*$ && "$AUTHORIZATION_RUN_ID" =~ ^[1-9][0-9]*$ && "$AUTHORIZATION_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
            echo "Invalid authorization workflow identity." >&2; exit 1;
          }
          [[ "$DEPLOY_PATH" == /* && -d "$DEPLOY_PATH" ]] || { echo "Deployment path is not an existing absolute directory." >&2; exit 1; }
          [[ "$CONTEXT_DIR" =~ ^/tmp/bodycast-migration-context-[0-9]+-[0-9]+$ && -d "$CONTEXT_DIR" && ! -L "$CONTEXT_DIR" ]] || { echo "Invalid remote context path." >&2; exit 1; }
          trap 'rm -rf "$CONTEXT_DIR"' EXIT
          for name in authorization-envelope.json preflight-result.json preflight-evidence.json restore-result.json artifact-metadata.json; do
            [[ -f "$CONTEXT_DIR/$name" && ! -L "$CONTEXT_DIR/$name" ]] || { echo "Signed migration context is incomplete." >&2; exit 1; }
          done
          cd "$DEPLOY_PATH"
          [[ "$(git rev-parse --show-toplevel)" == "$DEPLOY_PATH" ]] || { echo "Unexpected production Git checkout." >&2; exit 1; }
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || { echo "Production checkout is dirty; refusing checkout or migration." >&2; exit 1; }
          git -c remote.bodycast-canonical.url=https://github.com/krustallik/body-model.git \
            fetch --no-tags bodycast-canonical +refs/heads/main:refs/remotes/bodycast-canonical/main
          CANONICAL_MAIN="$(git rev-parse refs/remotes/bodycast-canonical/main)"
          [[ "$CANONICAL_MAIN" == "$RELEASE_SHA" ]] || { echo "Canonical main moved before production execution." >&2; exit 1; }
          git checkout --detach "$RELEASE_SHA"
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" && -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || {
            echo "Could not obtain a clean exact release checkout."; exit 1;
          }
          export RELEASE_SHA BODYCAST_MIGRATION_MANIFEST_ID="$MANIFEST_ID" BODYCAST_MIGRATION_CONTEXT_DIR="$CONTEXT_DIR"
          export BODYCAST_AUTHORIZATION_WORKFLOW_ID="$AUTHORIZATION_WORKFLOW_ID"
          export BODYCAST_AUTHORIZATION_RUN_ID="$AUTHORIZATION_RUN_ID"
          export BODYCAST_AUTHORIZATION_RUN_ATTEMPT="$AUTHORIZATION_RUN_ATTEMPT"
          export BODYCAST_EXECUTION_PROOF_HANDOFF=true
          bash scripts/deploy-migrate.sh
          REMOTE
          )"
          REMOTE_SCRIPT_B64="$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)"
          REMOTE_COMMAND="bash -c \"\$(printf '%s' '$REMOTE_SCRIPT_B64' | base64 --decode)\" -- '$RELEASE_SHA' '$MANIFEST_ID' '$DEPLOY_PATH_B64' '$REMOTE_CONTEXT' '$AUTHORIZATION_WORKFLOW_ID' '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT'"
          REMOTE_PID=""
          cleanup_remote() {
            if [[ -n "$REMOTE_PID" ]]; then
              exec {REMOTE_IN}>&- 2>/dev/null || true
              wait "$REMOTE_PID" 2>/dev/null || true
            fi
          }
          trap cleanup_remote EXIT
          coproc MIGRATION_REMOTE { timeout 60m "${SSH[@]}" "$SSH_USER@$SSH_HOST" "$REMOTE_COMMAND"; }
          REMOTE_PID="$MIGRATION_REMOTE_PID"
          REMOTE_OUT="${MIGRATION_REMOTE[0]}"
          REMOTE_IN="${MIGRATION_REMOTE[1]}"
          CHALLENGE=""
          while IFS= read -r -u "$REMOTE_OUT" line; do
            if [[ "$line" =~ ^BODYCAST_DDL_CHALLENGE:([a-f0-9]{64})$ ]]; then
              CHALLENGE="${BASH_REMATCH[1]}"
              break
            fi
            printf '%s\n' "$line"
          done
          [[ "$CHALLENGE" =~ ^[a-f0-9]{64}$ ]] || {
            echo "::error::Protected DDL process exited before requesting a one-time challenge-bound GitHub OIDC proof." >&2
            exit 1
          }
          PREFLIGHT_WORKFLOW_ID="$(gh api repos/krustallik/body-model/actions/workflows/production-migration-preflight.yml --jq .id)"
          gh api --paginate --jq '.workflow_runs[] | @json' \
            "repos/krustallik/body-model/actions/workflows/$PREFLIGHT_WORKFLOW_ID/runs?per_page=100" \
            > "$RUNNER_TEMP/final-preflight-runs.ndjson"
          SELECTED="$(node scripts/production-migration-select-preflight.mjs --select-run \
            "$RUNNER_TEMP/final-preflight-runs.ndjson" "$PREFLIGHT_WORKFLOW_ID" "$RELEASE_SHA" "$MANIFEST_ID")"
          SELECTED_ID="$(printf '%s' "$SELECTED" | jq -r '.id')"
          SELECTED_ATTEMPT="$(printf '%s' "$SELECTED" | jq -r '.runAttempt')"
          [[ "$SELECTED_ID" == "$EXPECTED_PREFLIGHT_RUN_ID" && "$SELECTED_ATTEMPT" == "$EXPECTED_PREFLIGHT_ATTEMPT" ]] || {
            echo "::error::A newer admitted preflight superseded the signed request." >&2
            exit 1
          }
          OIDC_PROOF="$RUNNER_TEMP/bodycast-ddl-execution-proof.jwt"
          trap 'rm -f "$OIDC_PROOF"' EXIT
          node scripts/production-migration-execution-attestation.mjs --request-oidc-proof \
            "$RUNNER_TEMP/signed-migration-context/authorization-envelope.json" \
            "$CHALLENGE" "$OIDC_PROOF"
          test -s "$OIDC_PROOF"
          cat "$OIDC_PROOF" >&"$REMOTE_IN"
          rm -f "$OIDC_PROOF"
          exec {REMOTE_IN}>&-
          while IFS= read -r -u "$REMOTE_OUT" line; do printf '%s\n' "$line"; done
          wait "$REMOTE_PID"
          REMOTE_PID=""
      - name: Remove temporary runner credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/bodycast-migrate-ssh"
