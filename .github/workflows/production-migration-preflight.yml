            if (!/^[a-f0-9]{64}$/.test(digest ?? "")) throw new Error("Malformed component digest.");
            return [name, digest];
          }));
          const before = read(beforePath);
          const after = read(afterPath);
          const changed = [...new Set([...before.keys(), ...after.keys()])].filter((name) => before.get(name) !== after.get(name)).sort();
          process.stderr.write(`Auth source fingerprint changed components: ${changed.join(",") || "none (projection header)"}\n`);
          NODE
              echo "::error::Auth ownership migration changed immutable source-input projection in isolated PostgreSQL."
              exit 1
            fi
          fi
          node scripts/production-db-preflight.mjs --manifest "$MANIFEST_ID" | psql "$DATABASE_URL" --no-psqlrc --quiet --tuples-only --no-align --set=ON_ERROR_STOP=1 > "$RUNNER_TEMP/restored-postflight-report.json"
          node scripts/production-migration-restore-check.mjs --postflight --manifest "$MANIFEST_ID" --release-sha "$GITHUB_SHA" --repository "$GITHUB_WORKSPACE" \
            --report "$RUNNER_TEMP/restored-postflight-report.json" > "$RUNNER_TEMP/restore-postflight-result.json"
          if [[ "$MANIFEST_ID" == "auth-multiuser-v1" ]]; then
            node scripts/production-migration-restore-check.mjs --combine \
              --base "$RUNNER_TEMP/restore-base-result.json" --postflight "$RUNNER_TEMP/restore-postflight-result.json" \
              --manifest "$MANIFEST_ID" --auth-source-fingerprint-before "$AUTH_SOURCE_FINGERPRINT_BEFORE" \
              --auth-source-fingerprint-after "$AUTH_SOURCE_FINGERPRINT_AFTER" > "$RUNNER_TEMP/restore-result.json"
          else
            node scripts/production-migration-restore-check.mjs --combine \
              --base "$RUNNER_TEMP/restore-base-result.json" --postflight "$RUNNER_TEMP/restore-postflight-result.json" \
