name: Production migration preflight and encrypted backup
run-name: Preflight ${{ inputs.release_sha }} ${{ inputs.manifest_id }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full SHA to inspect; must be current canonical main with successful CI
        required: true
        type: string
      manifest_id:
        description: Reviewed schema contract; pending migrations are discovered from the exact release tree
        required: true
        type: string
      confirm_production_preflight:
        description: Type maintenance-backup-restore to authorize maintenance, encrypted backup, and disposable rehearsal
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bodycast-production-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact-main preflight
    if: github.repository == 'krustallik/body-model' && github.ref == 'refs/heads/main' && github.actor_id == '126446430'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.gate.outputs.release_sha }}
      manifest_id: ${{ steps.gate.outputs.manifest_id }}
    steps:
      - name: Checkout current main tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate owner, release SHA, manifest, and exact-main CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_SHA: ${{ inputs.release_sha }}
          MANIFEST_ID: ${{ inputs.manifest_id }}
          CONFIRMATION: ${{ inputs.confirm_production_preflight }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$GITHUB_REPOSITORY" == "krustallik/body-model" && "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::Dispatch this workflow from canonical main only."; exit 1;
          }
          [[ "$DISPATCH_ACTOR_ID" == "126446430" ]] || { echo "::error::Only the BodyCast owner may authorize production preflight."; exit 1; }
          [[ "$CONFIRMATION" == "maintenance-backup-restore" ]] || { echo "::error::Exact preflight confirmation is required."; exit 1; }
          [[ "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release_sha must be a full lowercase SHA."; exit 1; }
          gh api "repos/krustallik/body-model/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/current-preflight-run.json"
          node --input-type=module - "$RUNNER_TEMP/current-preflight-run.json" "$MANIFEST_ID" <<'NODE'
          import { readFileSync } from "node:fs";
          import { assertTrustedOwnerWorkflowRun } from "./scripts/github-owner-identity.mjs";
          import { getProductionMigrationManifest } from "./scripts/production-migration-manifests.mjs";
          assertTrustedOwnerWorkflowRun(JSON.parse(readFileSync(process.argv[2], "utf8")), {
            actorId: process.env.DISPATCH_ACTOR_ID,
            workflowPath: ".github/workflows/production-migration-preflight.yml",
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            ref: "refs/heads/main",
            sha: process.env.GITHUB_SHA,
            requireInProgress: true,
          });
          const manifest = getProductionMigrationManifest(process.argv[3]);
          if (manifest.ciOnly === true) throw new Error("CI-only schema contracts cannot be used for production.");
          NODE
          git fetch --no-tags origin main
          MAIN_TIP="$(git rev-parse --verify FETCH_HEAD)"
          [[ "$MAIN_TIP" == "$(git rev-parse origin/main)" && "$MAIN_TIP" == "$GITHUB_SHA" && "$MAIN_TIP" == "$DISPATCH_SHA" ]] || {
            echo "::error::Requested SHA, checkout, origin/main, and canonical main must match."; exit 1;
          }
          gh api --jq '.workflow_runs[] | @json' \
            "repos/krustallik/body-model/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$MAIN_TIP&per_page=100" \
            > "$RUNNER_TEMP/bodycast-ci-runs.ndjson"
          CI_URL="$(node --input-type=module - "$RUNNER_TEMP/bodycast-ci-runs.ndjson" "$MAIN_TIP" <<'NODE'
          import { readFileSync } from "node:fs";
          const runs = readFileSync(process.argv[2], "utf8").trim().split(/\r?\n/).filter(Boolean).map(JSON.parse)
            .filter((run) => run.head_sha === process.argv[3] && run.head_branch === "main" && run.event === "push");
          runs.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || Number(b.run_attempt) - Number(a.run_attempt));
          const latest = runs[0];
          if (!latest || latest.status !== "completed" || latest.conclusion !== "success") {
            throw new Error("Exact current-main BodyCast CI is not successful.");
          }
          console.log(latest.html_url);
          NODE
          )"
          echo "release_sha=$MAIN_TIP" >> "$GITHUB_OUTPUT"
          echo "manifest_id=$MANIFEST_ID" >> "$GITHUB_OUTPUT"
          {
            echo "## Production migration preflight authorization"
            echo ""
            echo "- exact current-main SHA: $MAIN_TIP"
            echo "- exact-main CI: $CI_URL"
            echo "- schema contract: $MANIFEST_ID"
            echo "- production scope: read-only inspection, maintenance, encrypted backup, isolated restore, and migration rehearsal"
            echo "- DDL: not authorized by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
  inspect_backup_restore:
    name: Inspect, back up, restore, and rehearse on disposable PostgreSQL
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production
    services:
      isolated-postgres:
        image: docker.io/library/postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: bodycast_restore
          POSTGRES_USER: bodycast_restore
          POSTGRES_PASSWORD: isolated_restore_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bodycast_restore -d bodycast_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Install locked Prisma and project tooling
        run: npm ci
      - name: Recheck owner identity for this job attempt before production secrets
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -Eeuo pipefail
          [[ "$DISPATCH_ACTOR_ID" == "126446430" ]] || { echo "::error::Only the pinned owner may access production preflight credentials."; exit 1; }
          gh api "repos/krustallik/body-model/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/current-preflight-run.json"
          node --input-type=module - "$RUNNER_TEMP/current-preflight-run.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { assertTrustedOwnerWorkflowRun } from "./scripts/github-owner-identity.mjs";
          assertTrustedOwnerWorkflowRun(JSON.parse(readFileSync(process.argv[2], "utf8")), {
            actorId: process.env.DISPATCH_ACTOR_ID,
            workflowPath: ".github/workflows/production-migration-preflight.yml",
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            ref: "refs/heads/main",
            sha: process.env.GITHUB_SHA,
            requireInProgress: true,
          });
          NODE
      - name: Recheck canonical main before production access
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          TIP="$(gh api repos/krustallik/body-model/commits/main --jq .sha)"
          [[ "$TIP" == "$RELEASE_SHA" && "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || {
            echo "::error::Canonical main moved; no production connection was opened."; exit 1;
          }
      - name: Validate production-only SSH and backup secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_HOST: ${{ secrets.APP_HOST }}
          CADDY_ROUTES_PATH: ${{ secrets.CADDY_ROUTES_PATH }}
          PRODUCTION_BACKUP_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -Eeuo pipefail
          : "$SSH_PRIVATE_KEY"; : "$SSH_HOST"; : "$SSH_USER"; : "$SSH_PORT"; : "$SSH_HOST_FINGERPRINT"; : "$DEPLOY_PATH"; : "$APP_HOST"; : "$CADDY_ROUTES_PATH"
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != *$'\n'* ]] || { echo "::error::DEPLOY_PATH must be an absolute single-line path."; exit 1; }
          [[ "$APP_HOST" =~ ^[A-Za-z0-9.-]+$ && "$CADDY_ROUTES_PATH" == /* && "$CADDY_ROUTES_PATH" != *$'\n'* ]] || { echo "::error::Production traffic topology inputs are invalid."; exit 1; }
          node --input-type=module -e 'import { decodeBackupKey } from "./scripts/production-backup-envelope.mjs"; decodeBackupKey(process.env.PRODUCTION_BACKUP_ENCRYPTION_KEY);'
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT > 0 && SSH_PORT <= 65535 )) || { echo "::error::Invalid SSH_PORT."; exit 1; }
          [[ "$SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || { echo "::error::Pinned SSH fingerprint is invalid."; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/bodycast-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/bodycast-ssh/id"
          chmod 600 "$RUNNER_TEMP/bodycast-ssh/id"
          echo "BODYCAST_SSH_KEY=$RUNNER_TEMP/bodycast-ssh/id" >> "$GITHUB_ENV"
          echo "BODYCAST_KNOWN_HOSTS=$RUNNER_TEMP/bodycast-ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Pin production SSH host key
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" > "$RUNNER_TEMP/bodycast-ssh/candidate" 2>/dev/null
          test -s "$RUNNER_TEMP/bodycast-ssh/candidate"
          node scripts/filter-ssh-known-hosts.mjs "$RUNNER_TEMP/bodycast-ssh/candidate" "$BODYCAST_KNOWN_HOSTS"
          chmod 600 "$BODYCAST_KNOWN_HOSTS"
      - name: Verify production container, PostgreSQL clients, and storage headroom
        id: target
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          APP_HOST: ${{ secrets.APP_HOST }}
          CADDY_ROUTES_PATH: ${{ secrets.CADDY_ROUTES_PATH }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          MANIFEST_ID: ${{ needs.authorize.outputs.manifest_id }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -Eeuo pipefail
          SSH=(ssh -p "$SSH_PORT" -i "$BODYCAST_SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$BODYCAST_KNOWN_HOSTS" -o ConnectTimeout=10)
          META="$("${SSH[@]}" "$SSH_USER@$SSH_HOST" 'docker inspect --format "{{.Id}}|{{.Name}}|{{.Config.Image}}|{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}|{{range .Mounts}}{{if eq .Destination \"/var/lib/postgresql/data\"}}{{.Source}}{{end}}{{end}}" bodycast-db-prod')"
          [[ "$META" == *"|/bodycast-db-prod|postgres:17-alpine|running|healthy|"* ]] || { echo "::error::Unexpected production PostgreSQL target."; exit 1; }
          IFS='|' read -r CONTAINER_ID _ _ _ _ DB_DATA_PATH <<< "$META"
          [[ "$CONTAINER_ID" =~ ^[a-f0-9]{64}$ && "$DB_DATA_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "::error::Production PostgreSQL container or data mount identity is malformed."; exit 1; }
          PG_DUMP_VERSION="$("${SSH[@]}" "$SSH_USER@$SSH_HOST" "docker exec '$CONTAINER_ID' pg_dump --version")"
          PG_RESTORE_VERSION="$(docker run --rm --network host --entrypoint pg_restore docker.io/library/postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 --version)"
          node --input-type=module - "$PG_DUMP_VERSION" "$PG_RESTORE_VERSION" <<'NODE'
          import { assertPostgresClientCompatibility } from "./scripts/postgres-client-versions.mjs";
          assertPostgresClientCompatibility(process.argv[2], process.argv[3]);
          NODE
          HOST_CAPACITY="$("${SSH[@]}" "$SSH_USER@$SSH_HOST" "bash -s -- '$CONTAINER_ID' '$DB_DATA_PATH' '$RELEASE_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          CONTAINER_ID="$1"
          DB_DATA_PATH="$2"
          RELEASE_SHA="$3"
          [[ "$(docker inspect --format '{{.Id}}' bodycast-db-prod)" == "$CONTAINER_ID" ]] || { echo "Production PostgreSQL container changed during the pre-maintenance probe." >&2; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Exact current release SHA is malformed." >&2; exit 1; }
          DB_BYTES="$(docker exec "$CONTAINER_ID" sh -ec 'psql --no-psqlrc --quiet --tuples-only --no-align --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --command="SELECT pg_database_size(current_database())"')"
          DOCKER_ROOT="$(docker info --format '{{.DockerRootDir}}')"
          APP_IMAGE_ID="$(docker inspect --format '{{.Image}}' bodycast-app-prod)"
          SOURCE_APP_SHA="$(docker inspect --format '{{index .Config.Labels "org.bodycast.release-sha"}}' bodycast-app-prod)"
          [[ "$SOURCE_APP_SHA" =~ ^[a-f0-9]{40}$ ]] || SOURCE_APP_SHA="unavailable"
          APP_IMAGE_BYTES="$(docker image inspect --format '{{.Size}}' "$APP_IMAGE_ID")"
          DB_FREE_BYTES="$(df -B1 --output=avail "$DB_DATA_PATH" | tail -n1 | tr -d '[:space:]')"
          DOCKER_FREE_BYTES="$(df -B1 --output=avail "$DOCKER_ROOT" | tail -n1 | tr -d '[:space:]')"
          DB_DEVICE="$(stat -c '%d' "$DB_DATA_PATH")"
          DOCKER_DEVICE="$(stat -c '%d' "$DOCKER_ROOT")"
          [[ "$DB_BYTES" =~ ^[1-9][0-9]*$ && "$APP_IMAGE_BYTES" =~ ^[1-9][0-9]*$ \
            && "$DB_FREE_BYTES" =~ ^[0-9]+$ && "$DOCKER_FREE_BYTES" =~ ^[0-9]+$ \
            && "$DB_DEVICE" =~ ^[0-9]+$ && "$DOCKER_DEVICE" =~ ^[0-9]+$ ]] || { echo "Production storage measurements are malformed." >&2; exit 1; }
          printf '%s %s %s %s %s %s %s\n' "$DB_BYTES" "$DB_FREE_BYTES" "$DOCKER_FREE_BYTES" "$APP_IMAGE_BYTES" "$DB_DEVICE" "$DOCKER_DEVICE" "$SOURCE_APP_SHA"
          REMOTE
          )"
          read -r DB_BYTES DB_FREE_BYTES DOCKER_FREE_BYTES APP_IMAGE_BYTES DB_DEVICE DOCKER_DEVICE SOURCE_APP_SHA <<< "$HOST_CAPACITY"
          [[ "$SOURCE_APP_SHA" == "unavailable" || "$SOURCE_APP_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo "Previous-app release SHA is malformed." >&2; exit 1;
          }
          TOOL_ARCHIVE="$RUNNER_TEMP/pre-maintenance-tooling.tar.gz"
          PREFLIGHT_SQL="$RUNNER_TEMP/pre-maintenance.sql"
          node scripts/production-db-preflight.mjs --manifest "$MANIFEST_ID" > "$PREFLIGHT_SQL"
          tar -czf "$TOOL_ARCHIVE" \
            scripts/production-db-target.sh \
            scripts/production-db-target-url.mjs \
            scripts/production-db-data-fingerprint.sh \
            scripts/production-db-endpoint-binding.mjs \
            scripts/production-writer-drain.sh \
            scripts/production-route-path.sh \
            scripts/production-route-primitives.sh \
            -C "$RUNNER_TEMP" pre-maintenance.sql
          TOOL_ARCHIVE_SHA="$(sha256sum "$TOOL_ARCHIVE" | awk '{print $1}')"
          RUNNER_FREE_BYTES="$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n1 | tr -d '[:space:]')"
          RUNNER_DOCKER_ROOT="$(docker info --format '{{.DockerRootDir}}')"
          RUNNER_DOCKER_FREE_BYTES="$(df -B1 --output=avail "$RUNNER_DOCKER_ROOT" | tail -n1 | tr -d '[:space:]')"
          RUNNER_TEMP_DEVICE="$(stat -c '%d' "$RUNNER_TEMP")"
          RUNNER_DOCKER_DEVICE="$(stat -c '%d' "$RUNNER_DOCKER_ROOT")"
          [[ "$RUNNER_FREE_BYTES" =~ ^[0-9]+$ && "$RUNNER_DOCKER_FREE_BYTES" =~ ^[0-9]+$ \
            && "$RUNNER_TEMP_DEVICE" =~ ^[0-9]+$ && "$RUNNER_DOCKER_DEVICE" =~ ^[0-9]+$ \
            && "$DB_BYTES" =~ ^[1-9][0-9]*$ && "$APP_IMAGE_BYTES" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Runner or production storage measurements are malformed."; exit 1; }
          (( DB_BYTES <= 9007199254740991 / 3 && APP_IMAGE_BYTES <= 9007199254740991 / 2 )) || { echo "::error::Measured production sizes exceed the safe arithmetic range."; exit 1; }
          REQUIRED_RUNNER_SHARED_BYTES=$((DB_BYTES * 3))
          REQUIRED_RUNNER_TEMP_BYTES=$DB_BYTES
          REQUIRED_RUNNER_DOCKER_BYTES=$((DB_BYTES * 2))
          if [[ "$RUNNER_TEMP_DEVICE" == "$RUNNER_DOCKER_DEVICE" ]]; then
            REQUIRED_RUNNER_TEMP_BYTES=$REQUIRED_RUNNER_SHARED_BYTES
            REQUIRED_RUNNER_DOCKER_BYTES=$REQUIRED_RUNNER_SHARED_BYTES
          fi
          REQUIRED_DOCKER_BYTES=$((APP_IMAGE_BYTES * 2))
          if [[ "$DB_DEVICE" == "$DOCKER_DEVICE" ]]; then
            (( DB_BYTES <= 9007199254740991 - REQUIRED_DOCKER_BYTES )) || {
              echo "::error::Combined production storage measurements exceed the safe arithmetic range; maintenance was not entered."; exit 1;
            }
            REQUIRED_SHARED_BYTES=$((DB_BYTES + REQUIRED_DOCKER_BYTES))
            REQUIRED_DATABASE_FREE_BYTES=$REQUIRED_SHARED_BYTES
            REQUIRED_DOCKER_FREE_BYTES=$REQUIRED_SHARED_BYTES
            (( DB_FREE_BYTES >= REQUIRED_SHARED_BYTES && DOCKER_FREE_BYTES >= REQUIRED_SHARED_BYTES )) || {
              echo "::error::Production shared data/Docker filesystem lacks DB-plus-candidate image headroom; maintenance was not entered."; exit 1;
            }
          else
            REQUIRED_DATABASE_FREE_BYTES=$DB_BYTES
            REQUIRED_DOCKER_FREE_BYTES=$REQUIRED_DOCKER_BYTES
            (( DB_FREE_BYTES >= DB_BYTES && DOCKER_FREE_BYTES >= REQUIRED_DOCKER_BYTES )) || {
              echo "::error::Production database or Docker filesystem lacks migration/app image headroom; maintenance was not entered."; exit 1;
            }
          fi
          (( RUNNER_FREE_BYTES >= REQUIRED_RUNNER_TEMP_BYTES && RUNNER_DOCKER_FREE_BYTES >= REQUIRED_RUNNER_DOCKER_BYTES )) || {
            echo "::error::Runner temporary/Docker filesystems lack encrypted backup plus isolated restore/rehearsal headroom; maintenance was not entered."; exit 1;
          }
          echo "container_id=$CONTAINER_ID" >> "$GITHUB_OUTPUT"
          echo "database_bytes=$DB_BYTES" >> "$GITHUB_OUTPUT"
          echo "source_app_sha=$SOURCE_APP_SHA" >> "$GITHUB_OUTPUT"
          echo "database_free_bytes=$DB_FREE_BYTES" >> "$GITHUB_OUTPUT"
          echo "docker_free_bytes=$DOCKER_FREE_BYTES" >> "$GITHUB_OUTPUT"
          echo "prior_app_image_bytes=$APP_IMAGE_BYTES" >> "$GITHUB_OUTPUT"
          echo "runner_free_bytes=$RUNNER_FREE_BYTES" >> "$GITHUB_OUTPUT"
          echo "runner_docker_free_bytes=$RUNNER_DOCKER_FREE_BYTES" >> "$GITHUB_OUTPUT"
          echo "runner_temp_docker_shared_filesystem=$([[ "$RUNNER_TEMP_DEVICE" == "$RUNNER_DOCKER_DEVICE" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "shared_filesystem=$([[ "$DB_DEVICE" == "$DOCKER_DEVICE" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "required_database_free_bytes=$REQUIRED_DATABASE_FREE_BYTES" >> "$GITHUB_OUTPUT"
          echo "required_docker_free_bytes=$REQUIRED_DOCKER_FREE_BYTES" >> "$GITHUB_OUTPUT"
          echo "required_runner_free_bytes=$REQUIRED_RUNNER_TEMP_BYTES" >> "$GITHUB_OUTPUT"
          echo "required_runner_docker_free_bytes=$REQUIRED_RUNNER_DOCKER_BYTES" >> "$GITHUB_OUTPUT"
          {
            echo "### Pre-maintenance storage headroom"
            echo "- Database bytes: $DB_BYTES"
            echo "- Database filesystem free bytes: $DB_FREE_BYTES"
            echo "- Docker filesystem free bytes: $DOCKER_FREE_BYTES"
            echo "- Prior app image bytes: $APP_IMAGE_BYTES"
            echo "- Runner temporary filesystem free bytes: $RUNNER_FREE_BYTES"
            echo "- Runner Docker filesystem free bytes: $RUNNER_DOCKER_FREE_BYTES"
          } >> "$GITHUB_STEP_SUMMARY"
          APP_HOST_B64="$(printf '%s' "$APP_HOST" | base64 -w0)"
          CADDY_ROUTES_PATH_B64="$(printf '%s' "$CADDY_ROUTES_PATH" | base64 -w0)"
          REMOTE_SCRIPT="$(cat <<'REMOTE'
          set -Eeuo pipefail
          expected_sha="$1"
          [[ "$expected_sha" =~ ^[a-f0-9]{64}$ ]] || { echo "Invalid pre-maintenance tooling digest." >&2; exit 2; }
          stage="$(mktemp -d /tmp/bodycast-pre-maintenance.XXXXXX)"
          trap 'rm -rf -- "$stage"' EXIT
          archive="$stage/tooling.tar.gz"
          cat > "$archive"
          [[ "$(sha256sum "$archive" | awk '{print $1}')" == "$expected_sha" ]] || {
            echo "Pre-maintenance tooling archive digest mismatch." >&2; exit 1;
          }
          tar -xzf "$archive" -C "$stage" --no-same-owner
          rm -- "$archive"
          deploy_path="$(printf '%s' "$2" | base64 --decode)"
          app_host="$(printf '%s' "$3" | base64 --decode)"
          routes_path="$(printf '%s' "$4" | base64 --decode)"
          [[ "$deploy_path" == /* && -f "$deploy_path/docker-compose.prod.yml" ]] || {
            echo "The configured production Compose path is unavailable." >&2; exit 1;
          }
          BODYCAST_PRODUCTION_COMPOSE_FILE="$deploy_path/docker-compose.prod.yml" \
            BODYCAST_PREFLIGHT_SQL_FILE="$stage/pre-maintenance.sql" \
            APP_HOST="$app_host" CADDY_ROUTES_PATH="$routes_path" \
            bash "$stage/scripts/production-db-target.sh" --pre-maintenance-snapshot bodycast-db-prod \
            < "$stage/pre-maintenance.sql"
          REMOTE
          )"
          REMOTE_SCRIPT_B64="$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)"
          REMOTE_COMMAND="bash -c \"\$(printf '%s' '$REMOTE_SCRIPT_B64' | base64 --decode)\" -- '$TOOL_ARCHIVE_SHA' '$DEPLOY_PATH_B64' '$APP_HOST_B64' '$CADDY_ROUTES_PATH_B64'"
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" "$REMOTE_COMMAND" \
            < "$TOOL_ARCHIVE" > "$RUNNER_TEMP/pre-maintenance-report.json"
          SOURCE_MARKER_ARGS=()
          if [[ "$MANIFEST_ID" == "training-session-context-v1" ]]; then
            DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w0)"
            SOURCE_MARKER_REPLY="$("${SSH[@]}" "$SSH_USER@$SSH_HOST" "bash -s -- '$DEPLOY_PATH_B64' '$SOURCE_APP_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          deploy_path="$(printf '%s' "$1" | base64 --decode)"
          source_app_sha="$2"
          [[ "$deploy_path" == /* && -d "$deploy_path" && ! -L "$deploy_path" \
            && "$(git -C "$deploy_path" rev-parse --show-toplevel)" == "$deploy_path" ]] || {
            echo "Production release-marker checkout is unavailable or unsafe." >&2; exit 1;
          }
