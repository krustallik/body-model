name: Production migration preflight and encrypted backup
run-name: Preflight ${{ inputs.release_sha }} ${{ inputs.manifest_id }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full SHA to inspect; must be current canonical main with successful CI
        required: true
        type: string
      manifest_id:
        description: Closed reviewed migration set
        required: true
        type: choice
        options:
          - active-energy-unified-v2
      confirm_production_preflight:
        description: Type maintenance-backup-restore to authorize maintenance, encrypted backup, and disposable rehearsal
        required: true
        type: string
      resume_previous_preflight_run_id:
        description: Optional exact owner preflight run whose durable prior-app capture may be resumed only after verified live-state checks
        required: false
        type: string
      resume_pre_ddl_migration_failure_run_id:
        description: Required with the source run only to prove the reviewed final-guard import failure before the DDL marker
        required: false
        type: string
      resume_blocked_capture_preflight_run_id:
        description: Required with the migration failure run to identify the retry that stopped at the existing capture guard
        required: false
        type: string
      forward_resume_failed_migration_run_id:
        description: Exact owner-authorized pre-spawn failure run; currently only 38022978032 is admitted
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bodycast-production-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize read-only preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.gate.outputs.release_sha }}
      manifest_id: ${{ steps.gate.outputs.manifest_id }}
      resume_source_sha: ${{ steps.gate.outputs.resume_source_sha }}
      resume_source_run_id: ${{ steps.gate.outputs.resume_source_run_id }}
      resume_source_run_attempt: ${{ steps.gate.outputs.resume_source_run_attempt }}
      forward_resume_failure_proof_b64: ${{ steps.gate.outputs.forward_resume_failure_proof_b64 }}
      forward_resume_authorization_bundle_proof_b64: ${{ steps.gate.outputs.forward_resume_authorization_bundle_proof_b64 }}
      forward_resume_failure_proof_digest: ${{ steps.gate.outputs.forward_resume_failure_proof_digest }}
      forward_resume_mutation_history_digest: ${{ steps.gate.outputs.forward_resume_mutation_history_digest }}
    steps:
      - name: Checkout current main tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate canonical repository, exact main, and successful CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_SHA: ${{ inputs.release_sha }}
          MANIFEST_ID: ${{ inputs.manifest_id }}
          CONFIRMATION: ${{ inputs.confirm_production_preflight }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
          RESUME_SOURCE_RUN_ID: ${{ inputs.resume_previous_preflight_run_id }}
          RESUME_MIGRATION_FAILURE_RUN_ID: ${{ inputs.resume_pre_ddl_migration_failure_run_id }}
          RESUME_BLOCKED_CAPTURE_RUN_ID: ${{ inputs.resume_blocked_capture_preflight_run_id }}
          FORWARD_RESUME_FAILED_RUN_ID: ${{ inputs.forward_resume_failed_migration_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "krustallik/body-model" ]] || { echo "::error::Canonical repository only."; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Dispatch this workflow from main."; exit 1; }
          [[ "$DISPATCH_ACTOR_ID" == "126446430" ]] || { echo "::error::Only the pinned BodyCast owner may authorize maintenance and preflight."; exit 1; }
          gh api "repos/krustallik/body-model/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/current-preflight-run.json"
          node --input-type=module - "$RUNNER_TEMP/current-preflight-run.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { assertTrustedOwnerWorkflowRun } from "./scripts/github-owner-identity.mjs";
          assertTrustedOwnerWorkflowRun(JSON.parse(readFileSync(process.argv[2], "utf8")), {
            actorId: process.env.DISPATCH_ACTOR_ID,
            workflowPath: ".github/workflows/production-migration-preflight.yml",
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            ref: "refs/heads/main",
            sha: process.env.GITHUB_SHA,
            requireInProgress: true,
          });
          NODE
          [[ "$CONFIRMATION" == "maintenance-backup-restore" ]] || { echo "::error::Exact maintenance/preflight confirmation is required."; exit 1; }
          [[ "$MANIFEST_ID" == "active-energy-unified-v2" ]] || { echo "::error::Manifest is not in the closed allowlist."; exit 1; }
          [[ "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release_sha must be a full lowercase commit SHA."; exit 1; }
          git fetch --no-tags origin main
          MAIN_TIP="$(gh api repos/krustallik/body-model/commits/main --jq .sha)"
          [[ "$MAIN_TIP" == "$(git rev-parse origin/main)" && "$MAIN_TIP" == "$GITHUB_SHA" && "$MAIN_TIP" == "$DISPATCH_SHA" ]] || {
            echo "::error::Requested SHA, checked out main and canonical main do not match."; exit 1;
          }
          gh api --paginate --jq '.workflow_runs[] | @json' \
            "repos/krustallik/body-model/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" \
            > "$RUNNER_TEMP/bodycast-ci-runs.ndjson"
          CI_URL="$(node --input-type=module - "$RUNNER_TEMP/bodycast-ci-runs.ndjson" "$MAIN_TIP" <<'NODE'
          import { readFileSync } from "node:fs";
          const runs = readFileSync(process.argv[2], "utf8").trim().split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const matching = runs.filter((run) => run.head_sha === process.argv[3] && run.head_branch === "main" && run.event === "push");
          matching.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
          const latest = matching[0];
          if (!latest || latest.status !== "completed" || latest.conclusion !== "success") throw new Error("Current main has no latest successful push CI run.");
          console.log(latest.html_url);
          NODE
          )"
          RESUME_SOURCE_SHA=""
          RESUME_SOURCE_ATTEMPT=""
          RESUME_KIND=""
          FORWARD_FAILURE_PROOF_B64=""
          FORWARD_AUTH_BUNDLE_PROOF_B64=""
          FORWARD_FAILURE_PROOF_DIGEST=""
          FORWARD_MUTATION_HISTORY_DIGEST=""
          if [[ -n "$FORWARD_RESUME_FAILED_RUN_ID" ]]; then
            [[ "$FORWARD_RESUME_FAILED_RUN_ID" == "38022978032" \
              && -z "$RESUME_SOURCE_RUN_ID" && -z "$RESUME_MIGRATION_FAILURE_RUN_ID" \
              && -z "$RESUME_BLOCKED_CAPTURE_RUN_ID" ]] || {
              echo "::error::Forward-resume only admits the exact source failure and cannot combine with another resume mode."; exit 1;
            }
            node scripts/github-forward-resume-evidence.mjs "$RUNNER_TEMP/forward-github-evidence" "$GITHUB_RUN_ID" "$MAIN_TIP"
            mkdir -m 700 "$RUNNER_TEMP/forward-source-bundle"
            gh run download "$FORWARD_RESUME_FAILED_RUN_ID" --repo krustallik/body-model \
              --name "bodycast-migration-auth-$FORWARD_RESUME_FAILED_RUN_ID-1" --dir "$RUNNER_TEMP/forward-source-bundle"
            FORWARD_PROOF_META="$(node --input-type=module - "$RUNNER_TEMP/forward-source-bundle" "$RUNNER_TEMP/forward-github-evidence/github-evidence.json" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { verifyForwardResumeAuthorizationBundle } from "./scripts/production-forward-resume.mjs";
          import { canonicalSha256 } from "./scripts/production-migration-authorization.mjs";
          const [bundleDir, githubEvidencePath] = process.argv.slice(2);
          const { failureProof, mutationHistoryDigest } = JSON.parse(readFileSync(githubEvidencePath, "utf8"));
          const authorizationBundleProof = verifyForwardResumeAuthorizationBundle({
            envelope: readFileSync(`${bundleDir}/authorization-envelope.json`, "utf8").trimEnd(),
            preflightEvidence: JSON.parse(readFileSync(`${bundleDir}/preflight-evidence.json`, "utf8")),
            preflightResult: JSON.parse(readFileSync(`${bundleDir}/preflight-result.json`, "utf8")),
            restoreResult: JSON.parse(readFileSync(`${bundleDir}/restore-result.json`, "utf8")),
            artifactMetadata: JSON.parse(readFileSync(`${bundleDir}/artifact-metadata.json`, "utf8")),
            allowlist: JSON.parse(readFileSync("scripts/production-migration-verification-keys.json", "utf8")),
          });
          const failureProofDigest = canonicalSha256(failureProof);
          writeFileSync(`${bundleDir}/verified-failure-proof.json`, `${JSON.stringify(failureProof)}\n`, { flag: "wx", mode: 0o600 });
          writeFileSync(`${bundleDir}/verified-authorization-proof.json`, `${JSON.stringify(authorizationBundleProof)}\n`, { flag: "wx", mode: 0o600 });
          process.stdout.write(JSON.stringify({ failureProofDigest, mutationHistoryDigest,
            sourceSha: failureProof.sourceSha, sourcePreflightRunId: authorizationBundleProof.preflightRunId,
            sourcePreflightRunAttempt: authorizationBundleProof.preflightRunAttempt }));
          NODE
            )"
            RESUME_SOURCE_SHA="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).sourceSha)' "$FORWARD_PROOF_META")"
            RESUME_SOURCE_RUN_ID="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).sourcePreflightRunId)' "$FORWARD_PROOF_META")"
            RESUME_SOURCE_ATTEMPT="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).sourcePreflightRunAttempt))' "$FORWARD_PROOF_META")"
            FORWARD_FAILURE_PROOF_DIGEST="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).failureProofDigest)' "$FORWARD_PROOF_META")"
            FORWARD_MUTATION_HISTORY_DIGEST="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).mutationHistoryDigest)' "$FORWARD_PROOF_META")"
            FORWARD_FAILURE_PROOF_B64="$(base64 -w0 "$RUNNER_TEMP/forward-source-bundle/verified-failure-proof.json")"
            FORWARD_AUTH_BUNDLE_PROOF_B64="$(base64 -w0 "$RUNNER_TEMP/forward-source-bundle/verified-authorization-proof.json")"
            RESUME_KIND="verified-forward-resume-no-prisma-spawn"
            echo "- verified original migration run $FORWARD_RESUME_FAILED_RUN_ID failed at the final live writer-drain guard before Prisma spawn" >> "$GITHUB_STEP_SUMMARY"
            echo "- forward-resume will use a newly generated current-live backup and isolated restore/rehearsal; the historical backup is provenance only" >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$RESUME_MIGRATION_FAILURE_RUN_ID" || -n "$RESUME_BLOCKED_CAPTURE_RUN_ID" ]]; then
            [[ "$RESUME_SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ \
              && "$RESUME_MIGRATION_FAILURE_RUN_ID" =~ ^[1-9][0-9]*$ \
              && "$RESUME_BLOCKED_CAPTURE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::Pre-DDL migration resume requires the exact source, failed migration, and blocked capture run IDs."; exit 1;
            }
            PREFLIGHT_WORKFLOW_ID="$(gh api repos/krustallik/body-model/actions/workflows/production-migration-preflight.yml --jq .id)"
            MIGRATION_WORKFLOW_ID="$(gh api repos/krustallik/body-model/actions/workflows/production-migrate.yml --jq .id)"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_SOURCE_RUN_ID" > "$RUNNER_TEMP/resume-source-run.json"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_SOURCE_RUN_ID/jobs" > "$RUNNER_TEMP/resume-source-jobs.json"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_SOURCE_RUN_ID/artifacts" > "$RUNNER_TEMP/resume-source-artifacts.json"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_MIGRATION_FAILURE_RUN_ID" > "$RUNNER_TEMP/resume-migration-run.json"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_MIGRATION_FAILURE_RUN_ID/jobs" > "$RUNNER_TEMP/resume-migration-jobs.json"
            MIGRATION_EXECUTION_JOB_ID="$(jq -er '[.jobs[] | select(.name == "Final live guard and authorized migration") | .id] | if length == 1 and (.[0] | type == "number") then .[0] else error("migration execution job ID is missing or ambiguous") end' "$RUNNER_TEMP/resume-migration-jobs.json")"
            [[ "$MIGRATION_EXECUTION_JOB_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Migration execution job ID is malformed."; exit 1; }
            gh run view "$RESUME_MIGRATION_FAILURE_RUN_ID" --repo krustallik/body-model --job "$MIGRATION_EXECUTION_JOB_ID" --log-failed > "$RUNNER_TEMP/resume-migration-failure.log"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_BLOCKED_CAPTURE_RUN_ID" > "$RUNNER_TEMP/resume-blocked-capture-run.json"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_BLOCKED_CAPTURE_RUN_ID/jobs" > "$RUNNER_TEMP/resume-blocked-capture-jobs.json"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_BLOCKED_CAPTURE_RUN_ID/artifacts" > "$RUNNER_TEMP/resume-blocked-capture-artifacts.json"
            gh run view "$RESUME_BLOCKED_CAPTURE_RUN_ID" --repo krustallik/body-model --log-failed > "$RUNNER_TEMP/resume-blocked-capture-failure.log"
            : > "$RUNNER_TEMP/resume-later-runs.ndjson"
            for workflow_file in production-migration-preflight.yml production-migrate.yml production-database-cutback.yml activate-unified-v4-production.yml deploy-production.yml; do
              workflow_id="$(gh api "repos/krustallik/body-model/actions/workflows/$workflow_file" --jq .id)"
              gh api --paginate --jq '.workflow_runs[] | @json' \
                "repos/krustallik/body-model/actions/workflows/$workflow_id/runs?per_page=100" \
                >> "$RUNNER_TEMP/resume-later-runs.ndjson"
            done
            : > "$RUNNER_TEMP/resume-safe-preflight-retries.ndjson"
            node --input-type=module - "$RUNNER_TEMP/resume-later-runs.ndjson" \
              "$RUNNER_TEMP/resume-safe-preflight-retry-ids.txt" "$RESUME_SOURCE_RUN_ID" \
              "$RESUME_BLOCKED_CAPTURE_RUN_ID" "$GITHUB_RUN_ID" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { serializePreflightRetryRunIds } from "./scripts/production-preflight-resume.mjs";
          const [historyPath, idsPath, sourceIdText, blockedIdText, currentIdText] = process.argv.slice(2);
          const sourceId = BigInt(sourceIdText);
          const blockedId = BigInt(blockedIdText);
          const currentId = BigInt(currentIdText);
          const retryIds = new Set();
          for (const line of readFileSync(historyPath, "utf8").split(/\r?\n/).filter(Boolean)) {
            const run = JSON.parse(line);
            const runIdText = String(run.id ?? "");
            if (!/^[1-9][0-9]*$/.test(runIdText)) throw new Error("Production workflow history contains a malformed run ID.");
            const runId = BigInt(runIdText);
            const workflowPath = typeof run.path === "string" ? run.path.split("@")[0] : "";
            if (workflowPath !== ".github/workflows/production-migration-preflight.yml"
              || runId <= sourceId || runId === blockedId || runId >= currentId) continue;
            if (run.status === "completed" && run.conclusion === "failure") retryIds.add(runIdText);
          }
          writeFileSync(idsPath, serializePreflightRetryRunIds([...retryIds]), { mode: 0o600 });
          NODE
            while IFS= read -r retry_run_id; do
              [[ "$retry_run_id" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Malformed failed preflight retry ID."; exit 1; }
              gh api "repos/krustallik/body-model/actions/runs/$retry_run_id" > "$RUNNER_TEMP/resume-safe-preflight-$retry_run_id-run.json"
              gh api "repos/krustallik/body-model/actions/runs/$retry_run_id/jobs" > "$RUNNER_TEMP/resume-safe-preflight-$retry_run_id-jobs.json"
              node --input-type=module - "$RUNNER_TEMP/resume-safe-preflight-$retry_run_id-run.json" \
                "$RUNNER_TEMP/resume-safe-preflight-$retry_run_id-jobs.json" \
                >> "$RUNNER_TEMP/resume-safe-preflight-retries.ndjson" <<'NODE'
          import { readFileSync } from "node:fs";
          const [runPath, jobsPath] = process.argv.slice(2);
          process.stdout.write(`${JSON.stringify({ run: JSON.parse(readFileSync(runPath, "utf8")), jobs: JSON.parse(readFileSync(jobsPath, "utf8")) })}\n`);
          NODE
            done < "$RUNNER_TEMP/resume-safe-preflight-retry-ids.txt"
            node scripts/production-preflight-resume.mjs --verify-pre-ddl-migration-failure \
              "$RUNNER_TEMP/resume-source-run.json" "$RUNNER_TEMP/resume-source-jobs.json" \
              "$RUNNER_TEMP/resume-source-artifacts.json" "$RUNNER_TEMP/resume-migration-run.json" \
              "$RUNNER_TEMP/resume-migration-jobs.json" "$RUNNER_TEMP/resume-migration-failure.log" \
              "$RUNNER_TEMP/resume-blocked-capture-run.json" "$RUNNER_TEMP/resume-blocked-capture-jobs.json" \
              "$RUNNER_TEMP/resume-blocked-capture-artifacts.json" "$RUNNER_TEMP/resume-blocked-capture-failure.log" \
              "$RUNNER_TEMP/resume-later-runs.ndjson" "$RUNNER_TEMP/resume-safe-preflight-retries.ndjson" \
              "$RESUME_SOURCE_RUN_ID" "$RESUME_MIGRATION_FAILURE_RUN_ID" \
              "$RESUME_BLOCKED_CAPTURE_RUN_ID" "$GITHUB_RUN_ID" "$MAIN_TIP" "$PREFLIGHT_WORKFLOW_ID" "$MIGRATION_WORKFLOW_ID" \
              > "$RUNNER_TEMP/preflight-resume-proof.json"
            RESUME_SOURCE_SHA="$(jq -r .sourceSha "$RUNNER_TEMP/preflight-resume-proof.json")"
            RESUME_SOURCE_ATTEMPT="$(jq -r .sourceRunAttempt "$RUNNER_TEMP/preflight-resume-proof.json")"
            RESUME_KIND="$(jq -r .resumeKind "$RUNNER_TEMP/preflight-resume-proof.json")"
            {
              echo "- verified pre-DDL resume source preflight: $RESUME_SOURCE_RUN_ID attempt $RESUME_SOURCE_ATTEMPT at $RESUME_SOURCE_SHA"
              echo "- verified failed migration run: $RESUME_MIGRATION_FAILURE_RUN_ID; exact final-guard import failure occurred before the marker/Prisma boundary"
              echo "- verified blocked capture retry: $RESUME_BLOCKED_CAPTURE_RUN_ID; this preflight still creates a fresh backup and isolated rehearsal"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$RESUME_SOURCE_RUN_ID" ]]; then
            [[ "$RESUME_SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Resume source run ID must be a positive numeric identifier."; exit 1; }
            PREFLIGHT_WORKFLOW_ID="$(gh api repos/krustallik/body-model/actions/workflows/production-migration-preflight.yml --jq .id)"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_SOURCE_RUN_ID" > "$RUNNER_TEMP/resume-source-run.json"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_SOURCE_RUN_ID/jobs" > "$RUNNER_TEMP/resume-source-jobs.json"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_SOURCE_RUN_ID/artifacts" > "$RUNNER_TEMP/resume-source-artifacts.json"
            : > "$RUNNER_TEMP/resume-later-runs.ndjson"
            for workflow_file in production-migration-preflight.yml production-migrate.yml production-database-cutback.yml activate-unified-v4-production.yml deploy-production.yml; do
              workflow_id="$(gh api "repos/krustallik/body-model/actions/workflows/$workflow_file" --jq .id)"
              gh api --paginate --jq '.workflow_runs[] | @json' \
                "repos/krustallik/body-model/actions/workflows/$workflow_id/runs?per_page=100" \
                >> "$RUNNER_TEMP/resume-later-runs.ndjson"
            done
            node scripts/production-preflight-resume.mjs --verify-source \
              "$RUNNER_TEMP/resume-source-run.json" "$RUNNER_TEMP/resume-source-jobs.json" \
              "$RUNNER_TEMP/resume-source-artifacts.json" "$RUNNER_TEMP/resume-later-runs.ndjson" \
              "$RESUME_SOURCE_RUN_ID" "$GITHUB_RUN_ID" "$MAIN_TIP" "$PREFLIGHT_WORKFLOW_ID" \
              > "$RUNNER_TEMP/preflight-resume-proof.json"
            RESUME_SOURCE_SHA="$(jq -r .sourceSha "$RUNNER_TEMP/preflight-resume-proof.json")"
            RESUME_SOURCE_ATTEMPT="$(jq -r .sourceRunAttempt "$RUNNER_TEMP/preflight-resume-proof.json")"
            RESUME_KIND="verified-failed-restore-rehearsal"
            {
              echo "- previous failed preflight run: $RESUME_SOURCE_RUN_ID attempt $RESUME_SOURCE_ATTEMPT at $RESUME_SOURCE_SHA"
              echo "- resume admitted only for the verified failed disposable restore/rehearsal step; no backup artifact or later production mutation exists"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            [[ -z "$RESUME_SOURCE_RUN_ID" ]] || { echo "::error::Resume source is malformed."; exit 1; }
          fi
          echo "release_sha=$MAIN_TIP" >> "$GITHUB_OUTPUT"
          echo "manifest_id=$MANIFEST_ID" >> "$GITHUB_OUTPUT"
          echo "resume_source_sha=$RESUME_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "resume_source_run_id=$RESUME_SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "resume_source_run_attempt=$RESUME_SOURCE_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "forward_resume_failure_proof_b64=$FORWARD_FAILURE_PROOF_B64" >> "$GITHUB_OUTPUT"
          echo "forward_resume_authorization_bundle_proof_b64=$FORWARD_AUTH_BUNDLE_PROOF_B64" >> "$GITHUB_OUTPUT"
          echo "forward_resume_failure_proof_digest=$FORWARD_FAILURE_PROOF_DIGEST" >> "$GITHUB_OUTPUT"
          echo "forward_resume_mutation_history_digest=$FORWARD_MUTATION_HISTORY_DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "## Read-only production preflight"
            echo ""
            echo "- release SHA: $MAIN_TIP"
            echo "- manifest: $MANIFEST_ID"
            echo "- successful current-main CI: $CI_URL"
            echo "- production DDL: NOT EXECUTED"
          } >> "$GITHUB_STEP_SUMMARY"

  inspect_backup_restore:
    name: Inspect, back up, restore, and rehearse on disposable PostgreSQL
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production
    services:
      isolated-postgres:
        image: public.ecr.aws/docker/library/postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: bodycast_restore
          POSTGRES_USER: bodycast_restore
          POSTGRES_PASSWORD: isolated_restore_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bodycast_restore -d bodycast_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Install locked Prisma and project tooling
        run: npm ci
      - name: Recheck owner identity for this job attempt before production secrets
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -Eeuo pipefail
          [[ "$DISPATCH_ACTOR_ID" == "126446430" ]] || { echo "::error::Only the pinned owner may access production preflight credentials."; exit 1; }
          gh api "repos/krustallik/body-model/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/current-preflight-run.json"
          node --input-type=module - "$RUNNER_TEMP/current-preflight-run.json" <<'NODE'
          import { readFileSync } from "node:fs";
