          const pending = result.pending;
          if (!Array.isArray(pending) || !pending.length || JSON.stringify([...pending].sort()) !== JSON.stringify(pending)) {
            throw new Error("Owner confirmation requires a nonempty sorted pending migration set.");
          }
          const digest = canonicalSha256(pending);
          if (digest !== result.pendingSetDigest) throw new Error("Preflight pending migration digest is inconsistent.");
