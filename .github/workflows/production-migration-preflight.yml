          console.log("### Exact DDL authorization binding");
          console.log("");
          console.log("- Release SHA: " + process.env.RELEASE_SHA);
          console.log("- Pending migrations: " + pending.join(", "));
          console.log("- Pending set SHA-256: " + digest);
          console.log("- Required confirmation: MIGRATE_PRODUCTION:" + process.env.RELEASE_SHA + ":" + digest);
          NODE
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/bodycast-ssh"
