name: Production migration preflight and encrypted backup
run-name: Preflight ${{ inputs.release_sha }} ${{ inputs.manifest_id }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full SHA to inspect; must be current canonical main with successful CI
        required: true
        type: string
      manifest_id:
        description: Closed reviewed migration set
        required: true
        type: choice
        options:
          - active-energy-unified-v2
      confirm_production_preflight:
        description: Type maintenance-backup-restore to authorize maintenance, encrypted backup, and disposable rehearsal
        required: true
        type: string
      resume_previous_preflight_run_id:
        description: Optional exact owner preflight run whose durable prior-app capture may be resumed only after verified live-state checks
        required: false
        type: string
      resume_pre_ddl_migration_failure_run_id:
        description: Required with the source run only to prove the reviewed final-guard import failure before the DDL marker
        required: false
        type: string
      resume_blocked_capture_preflight_run_id:
        description: Required with the migration failure run to identify the retry that stopped at the existing capture guard
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bodycast-production-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize read-only preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.gate.outputs.release_sha }}
      manifest_id: ${{ steps.gate.outputs.manifest_id }}
      resume_source_sha: ${{ steps.gate.outputs.resume_source_sha }}
      resume_source_run_id: ${{ steps.gate.outputs.resume_source_run_id }}
      resume_source_run_attempt: ${{ steps.gate.outputs.resume_source_run_attempt }}
    steps:
      - name: Checkout current main tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate canonical repository, exact main, and successful CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_SHA: ${{ inputs.release_sha }}
          MANIFEST_ID: ${{ inputs.manifest_id }}
          CONFIRMATION: ${{ inputs.confirm_production_preflight }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
          RESUME_SOURCE_RUN_ID: ${{ inputs.resume_previous_preflight_run_id }}
          RESUME_MIGRATION_FAILURE_RUN_ID: ${{ inputs.resume_pre_ddl_migration_failure_run_id }}
          RESUME_BLOCKED_CAPTURE_RUN_ID: ${{ inputs.resume_blocked_capture_preflight_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "krustallik/body-model" ]] || { echo "::error::Canonical repository only."; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Dispatch this workflow from main."; exit 1; }
          [[ "$DISPATCH_ACTOR_ID" == "126446430" ]] || { echo "::error::Only the pinned BodyCast owner may authorize maintenance and preflight."; exit 1; }
          gh api "repos/krustallik/body-model/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/current-preflight-run.json"
          node --input-type=module - "$RUNNER_TEMP/current-preflight-run.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { assertTrustedOwnerWorkflowRun } from "./scripts/github-owner-identity.mjs";
          assertTrustedOwnerWorkflowRun(JSON.parse(readFileSync(process.argv[2], "utf8")), {
            actorId: process.env.DISPATCH_ACTOR_ID,
            workflowPath: ".github/workflows/production-migration-preflight.yml",
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            ref: "refs/heads/main",
            sha: process.env.GITHUB_SHA,
            requireInProgress: true,
          });
          NODE
          [[ "$CONFIRMATION" == "maintenance-backup-restore" ]] || { echo "::error::Exact maintenance/preflight confirmation is required."; exit 1; }
          [[ "$MANIFEST_ID" == "active-energy-unified-v2" ]] || { echo "::error::Manifest is not in the closed allowlist."; exit 1; }
          [[ "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release_sha must be a full lowercase commit SHA."; exit 1; }
          git fetch --no-tags origin main
          MAIN_TIP="$(gh api repos/krustallik/body-model/commits/main --jq .sha)"
          [[ "$MAIN_TIP" == "$(git rev-parse origin/main)" && "$MAIN_TIP" == "$GITHUB_SHA" && "$MAIN_TIP" == "$DISPATCH_SHA" ]] || {
            echo "::error::Requested SHA, checked out main and canonical main do not match."; exit 1;
          }
          gh api --paginate --jq '.workflow_runs[] | @json' \
            "repos/krustallik/body-model/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" \
            > "$RUNNER_TEMP/bodycast-ci-runs.ndjson"
          CI_URL="$(node --input-type=module - "$RUNNER_TEMP/bodycast-ci-runs.ndjson" "$MAIN_TIP" <<'NODE'
          import { readFileSync } from "node:fs";
          const runs = readFileSync(process.argv[2], "utf8").trim().split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const matching = runs.filter((run) => run.head_sha === process.argv[3] && run.head_branch === "main" && run.event === "push");
          matching.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
          const latest = matching[0];
          if (!latest || latest.status !== "completed" || latest.conclusion !== "success") throw new Error("Current main has no latest successful push CI run.");
          console.log(latest.html_url);
          NODE
          )"
          RESUME_SOURCE_SHA=""
          RESUME_SOURCE_ATTEMPT=""
          RESUME_KIND=""
          if [[ -n "$RESUME_MIGRATION_FAILURE_RUN_ID" || -n "$RESUME_BLOCKED_CAPTURE_RUN_ID" ]]; then
            [[ "$RESUME_SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ \
              && "$RESUME_MIGRATION_FAILURE_RUN_ID" =~ ^[1-9][0-9]*$ \
              && "$RESUME_BLOCKED_CAPTURE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::Pre-DDL migration resume requires the exact source, failed migration, and blocked capture run IDs."; exit 1;
            }
            PREFLIGHT_WORKFLOW_ID="$(gh api repos/krustallik/body-model/actions/workflows/production-migration-preflight.yml --jq .id)"
            MIGRATION_WORKFLOW_ID="$(gh api repos/krustallik/body-model/actions/workflows/production-migrate.yml --jq .id)"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_SOURCE_RUN_ID" > "$RUNNER_TEMP/resume-source-run.json"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_SOURCE_RUN_ID/jobs" > "$RUNNER_TEMP/resume-source-jobs.json"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_SOURCE_RUN_ID/artifacts" > "$RUNNER_TEMP/resume-source-artifacts.json"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_MIGRATION_FAILURE_RUN_ID" > "$RUNNER_TEMP/resume-migration-run.json"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_MIGRATION_FAILURE_RUN_ID/jobs" > "$RUNNER_TEMP/resume-migration-jobs.json"
            gh run view "$RESUME_MIGRATION_FAILURE_RUN_ID" --repo krustallik/body-model --log-failed > "$RUNNER_TEMP/resume-migration-failure.log"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_BLOCKED_CAPTURE_RUN_ID" > "$RUNNER_TEMP/resume-blocked-capture-run.json"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_BLOCKED_CAPTURE_RUN_ID/jobs" > "$RUNNER_TEMP/resume-blocked-capture-jobs.json"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_BLOCKED_CAPTURE_RUN_ID/artifacts" > "$RUNNER_TEMP/resume-blocked-capture-artifacts.json"
            gh run view "$RESUME_BLOCKED_CAPTURE_RUN_ID" --repo krustallik/body-model --log-failed > "$RUNNER_TEMP/resume-blocked-capture-failure.log"
            : > "$RUNNER_TEMP/resume-later-runs.ndjson"
            for workflow_file in production-migration-preflight.yml production-migrate.yml production-database-cutback.yml activate-unified-v4-production.yml deploy-production.yml; do
              workflow_id="$(gh api "repos/krustallik/body-model/actions/workflows/$workflow_file" --jq .id)"
              gh api --paginate --jq '.workflow_runs[] | @json' \
                "repos/krustallik/body-model/actions/workflows/$workflow_id/runs?per_page=100" \
                >> "$RUNNER_TEMP/resume-later-runs.ndjson"
            done
            node scripts/production-preflight-resume.mjs --verify-pre-ddl-migration-failure \
              "$RUNNER_TEMP/resume-source-run.json" "$RUNNER_TEMP/resume-source-jobs.json" \
              "$RUNNER_TEMP/resume-source-artifacts.json" "$RUNNER_TEMP/resume-migration-run.json" \
              "$RUNNER_TEMP/resume-migration-jobs.json" "$RUNNER_TEMP/resume-migration-failure.log" \
              "$RUNNER_TEMP/resume-blocked-capture-run.json" "$RUNNER_TEMP/resume-blocked-capture-jobs.json" \
              "$RUNNER_TEMP/resume-blocked-capture-artifacts.json" "$RUNNER_TEMP/resume-blocked-capture-failure.log" \
              "$RUNNER_TEMP/resume-later-runs.ndjson" "$RESUME_SOURCE_RUN_ID" "$RESUME_MIGRATION_FAILURE_RUN_ID" \
              "$RESUME_BLOCKED_CAPTURE_RUN_ID" "$GITHUB_RUN_ID" "$MAIN_TIP" "$PREFLIGHT_WORKFLOW_ID" "$MIGRATION_WORKFLOW_ID" \
              > "$RUNNER_TEMP/preflight-resume-proof.json"
            RESUME_SOURCE_SHA="$(jq -r .sourceSha "$RUNNER_TEMP/preflight-resume-proof.json")"
            RESUME_SOURCE_ATTEMPT="$(jq -r .sourceRunAttempt "$RUNNER_TEMP/preflight-resume-proof.json")"
            RESUME_KIND="$(jq -r .resumeKind "$RUNNER_TEMP/preflight-resume-proof.json")"
            {
              echo "- verified pre-DDL resume source preflight: $RESUME_SOURCE_RUN_ID attempt $RESUME_SOURCE_ATTEMPT at $RESUME_SOURCE_SHA"
              echo "- verified failed migration run: $RESUME_MIGRATION_FAILURE_RUN_ID; exact final-guard import failure occurred before the marker/Prisma boundary"
              echo "- verified blocked capture retry: $RESUME_BLOCKED_CAPTURE_RUN_ID; this preflight still creates a fresh backup and isolated rehearsal"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$RESUME_SOURCE_RUN_ID" ]]; then
            [[ "$RESUME_SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Resume source run ID must be a positive numeric identifier."; exit 1; }
            PREFLIGHT_WORKFLOW_ID="$(gh api repos/krustallik/body-model/actions/workflows/production-migration-preflight.yml --jq .id)"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_SOURCE_RUN_ID" > "$RUNNER_TEMP/resume-source-run.json"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_SOURCE_RUN_ID/jobs" > "$RUNNER_TEMP/resume-source-jobs.json"
            gh api "repos/krustallik/body-model/actions/runs/$RESUME_SOURCE_RUN_ID/artifacts" > "$RUNNER_TEMP/resume-source-artifacts.json"
            : > "$RUNNER_TEMP/resume-later-runs.ndjson"
            for workflow_file in production-migration-preflight.yml production-migrate.yml production-database-cutback.yml activate-unified-v4-production.yml deploy-production.yml; do
              workflow_id="$(gh api "repos/krustallik/body-model/actions/workflows/$workflow_file" --jq .id)"
              gh api --paginate --jq '.workflow_runs[] | @json' \
                "repos/krustallik/body-model/actions/workflows/$workflow_id/runs?per_page=100" \
                >> "$RUNNER_TEMP/resume-later-runs.ndjson"
            done
            node scripts/production-preflight-resume.mjs --verify-source \
              "$RUNNER_TEMP/resume-source-run.json" "$RUNNER_TEMP/resume-source-jobs.json" \
              "$RUNNER_TEMP/resume-source-artifacts.json" "$RUNNER_TEMP/resume-later-runs.ndjson" \
              "$RESUME_SOURCE_RUN_ID" "$GITHUB_RUN_ID" "$MAIN_TIP" "$PREFLIGHT_WORKFLOW_ID" \
              > "$RUNNER_TEMP/preflight-resume-proof.json"
            RESUME_SOURCE_SHA="$(jq -r .sourceSha "$RUNNER_TEMP/preflight-resume-proof.json")"
            RESUME_SOURCE_ATTEMPT="$(jq -r .sourceRunAttempt "$RUNNER_TEMP/preflight-resume-proof.json")"
            RESUME_KIND="verified-failed-restore-rehearsal"
            {
              echo "- previous failed preflight run: $RESUME_SOURCE_RUN_ID attempt $RESUME_SOURCE_ATTEMPT at $RESUME_SOURCE_SHA"
              echo "- resume admitted only for the verified failed disposable restore/rehearsal step; no backup artifact or later production mutation exists"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            [[ -z "$RESUME_SOURCE_RUN_ID" ]] || { echo "::error::Resume source is malformed."; exit 1; }
          fi
          echo "release_sha=$MAIN_TIP" >> "$GITHUB_OUTPUT"
          echo "manifest_id=$MANIFEST_ID" >> "$GITHUB_OUTPUT"
          echo "resume_source_sha=$RESUME_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "resume_source_run_id=$RESUME_SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "resume_source_run_attempt=$RESUME_SOURCE_ATTEMPT" >> "$GITHUB_OUTPUT"
          {
            echo "## Read-only production preflight"
            echo ""
            echo "- release SHA: $MAIN_TIP"
            echo "- manifest: $MANIFEST_ID"
            echo "- successful current-main CI: $CI_URL"
            echo "- production DDL: NOT EXECUTED"
          } >> "$GITHUB_STEP_SUMMARY"

  inspect_backup_restore:
    name: Inspect, back up, restore, and rehearse on disposable PostgreSQL
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production
    services:
      isolated-postgres:
        image: public.ecr.aws/docker/library/postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: bodycast_restore
          POSTGRES_USER: bodycast_restore
          POSTGRES_PASSWORD: isolated_restore_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bodycast_restore -d bodycast_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Install locked Prisma and project tooling
        run: npm ci
      - name: Recheck owner identity for this job attempt before production secrets
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -Eeuo pipefail
          [[ "$DISPATCH_ACTOR_ID" == "126446430" ]] || { echo "::error::Only the pinned owner may access production preflight credentials."; exit 1; }
          gh api "repos/krustallik/body-model/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/current-preflight-run.json"
          node --input-type=module - "$RUNNER_TEMP/current-preflight-run.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { assertTrustedOwnerWorkflowRun } from "./scripts/github-owner-identity.mjs";
          assertTrustedOwnerWorkflowRun(JSON.parse(readFileSync(process.argv[2], "utf8")), {
            actorId: process.env.DISPATCH_ACTOR_ID,
            workflowPath: ".github/workflows/production-migration-preflight.yml",
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            ref: "refs/heads/main",
            sha: process.env.GITHUB_SHA,
            requireInProgress: true,
          });
          NODE
      - name: Recheck canonical main before production access
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          TIP="$(gh api repos/krustallik/body-model/commits/main --jq .sha)"
          [[ "$TIP" == "$RELEASE_SHA" && "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || {
            echo "::error::Canonical main moved; no production connection was opened."; exit 1;
          }
      - name: Validate production-only SSH and backup secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_HOST: ${{ secrets.APP_HOST }}
          CADDY_ROUTES_PATH: ${{ secrets.CADDY_ROUTES_PATH }}
          PRODUCTION_BACKUP_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -Eeuo pipefail
          : "$SSH_PRIVATE_KEY"; : "$SSH_HOST"; : "$SSH_USER"; : "$SSH_PORT"; : "$SSH_HOST_FINGERPRINT"; : "$DEPLOY_PATH"; : "$APP_HOST"; : "$CADDY_ROUTES_PATH"
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != *$'\n'* ]] || { echo "::error::DEPLOY_PATH must be an absolute single-line path."; exit 1; }
          [[ "$APP_HOST" =~ ^[A-Za-z0-9.-]+$ && "$CADDY_ROUTES_PATH" == /* && "$CADDY_ROUTES_PATH" != *$'\n'* ]] || { echo "::error::Production traffic topology inputs are invalid."; exit 1; }
          node --input-type=module -e 'import { decodeBackupKey } from "./scripts/production-backup-envelope.mjs"; decodeBackupKey(process.env.PRODUCTION_BACKUP_ENCRYPTION_KEY);'
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT > 0 && SSH_PORT <= 65535 )) || { echo "::error::Invalid SSH_PORT."; exit 1; }
          [[ "$SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || { echo "::error::Pinned SSH fingerprint is invalid."; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/bodycast-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/bodycast-ssh/id"
          chmod 600 "$RUNNER_TEMP/bodycast-ssh/id"
          echo "BODYCAST_SSH_KEY=$RUNNER_TEMP/bodycast-ssh/id" >> "$GITHUB_ENV"
          echo "BODYCAST_KNOWN_HOSTS=$RUNNER_TEMP/bodycast-ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Pin production SSH host key
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" > "$RUNNER_TEMP/bodycast-ssh/candidate" 2>/dev/null
          test -s "$RUNNER_TEMP/bodycast-ssh/candidate"
          node scripts/filter-ssh-known-hosts.mjs "$RUNNER_TEMP/bodycast-ssh/candidate" "$BODYCAST_KNOWN_HOSTS"
          chmod 600 "$BODYCAST_KNOWN_HOSTS"
      - name: Enter maintenance and drain the old app before backup
        id: maintenance
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_HOST: ${{ secrets.APP_HOST }}
          CADDY_ROUTES_PATH: ${{ secrets.CADDY_ROUTES_PATH }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          RESUME_SOURCE_SHA: ${{ needs.authorize.outputs.resume_source_sha }}
          RESUME_SOURCE_RUN_ID: ${{ needs.authorize.outputs.resume_source_run_id }}
          RESUME_SOURCE_RUN_ATTEMPT: ${{ needs.authorize.outputs.resume_source_run_attempt }}
        run: |
          set -Eeuo pipefail
          DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w0)"
          APP_HOST_B64="$(printf '%s' "$APP_HOST" | base64 -w0)"
          ROUTES_PATH_B64="$(printf '%s' "$CADDY_ROUTES_PATH" | base64 -w0)"
          RESUME_SOURCE_SHA_B64="$(printf '%s' "$RESUME_SOURCE_SHA" | base64 -w0)"
          RESUME_SOURCE_RUN_ID_B64="$(printf '%s' "$RESUME_SOURCE_RUN_ID" | base64 -w0)"
          RESUME_SOURCE_RUN_ATTEMPT_B64="$(printf '%s' "$RESUME_SOURCE_RUN_ATTEMPT" | base64 -w0)"
          CURRENT_RUN_ID_B64="$(printf '%s' "$GITHUB_RUN_ID" | base64 -w0)"
          CURRENT_RUN_ATTEMPT_B64="$(printf '%s' "$GITHUB_RUN_ATTEMPT" | base64 -w0)"
          REMOTE_SCRIPT="$(cat <<'REMOTE'
          set -Eeuo pipefail
          RELEASE_SHA="$1"
          DEPLOY_PATH="$(printf '%s' "$2" | base64 --decode)"
          APP_HOST="$(printf '%s' "$3" | base64 --decode)"
          CADDY_ROUTES_PATH="$(printf '%s' "$4" | base64 --decode)"
          RESUME_SOURCE_SHA="$(printf '%s' "$5" | base64 --decode)"
          RESUME_SOURCE_RUN_ID="$(printf '%s' "$6" | base64 --decode)"
          RESUME_SOURCE_RUN_ATTEMPT="$(printf '%s' "$7" | base64 --decode)"
          CURRENT_RUN_ID="$(printf '%s' "$8" | base64 --decode)"
          CURRENT_RUN_ATTEMPT="$(printf '%s' "$9" | base64 --decode)"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ && "$DEPLOY_PATH" == /* && "$APP_HOST" =~ ^[A-Za-z0-9.-]+$ && "$CADDY_ROUTES_PATH" == /* ]] || exit 2
          if [[ -n "$RESUME_SOURCE_SHA" ]]; then
            [[ "$RESUME_SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$RESUME_SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ \
              && "$RESUME_SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ && "$CURRENT_RUN_ID" =~ ^[1-9][0-9]*$ \
              && "$CURRENT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 2
          else
            [[ -z "$RESUME_SOURCE_RUN_ID" && -z "$RESUME_SOURCE_RUN_ATTEMPT" ]] || exit 2
          fi
          cd -- "$DEPLOY_PATH"
          [[ "$(git rev-parse --show-toplevel)" == "$DEPLOY_PATH" && -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || {
            echo "Production checkout is not clean or does not match DEPLOY_PATH." >&2; exit 1;
          }
          git fetch --no-tags origin "$RELEASE_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$RELEASE_SHA" ]] || { echo "Release SHA is no longer current origin/main." >&2; exit 1; }
          git checkout --detach "$RELEASE_SHA"
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" && -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || exit 1
          if [[ -n "$RESUME_SOURCE_SHA" ]]; then
            APP_HOST="$APP_HOST" CADDY_ROUTES_PATH="$CADDY_ROUTES_PATH" BODYCAST_DEPLOY_SHA="$RELEASE_SHA" \
              BODYCAST_CAPTURE_PRE_DDL_RELEASE=1 BODYCAST_RESUME_PRE_DDL_CAPTURE=1 \
              BODYCAST_PRE_DDL_CAPTURE_SOURCE_SHA="$RESUME_SOURCE_SHA" \
              BODYCAST_PRE_DDL_CAPTURE_SOURCE_RUN_ID="$RESUME_SOURCE_RUN_ID" \
              BODYCAST_PRE_DDL_CAPTURE_SOURCE_RUN_ATTEMPT="$RESUME_SOURCE_RUN_ATTEMPT" \
              BODYCAST_PRE_DDL_CAPTURE_CURRENT_RUN_ID="$CURRENT_RUN_ID" \
              BODYCAST_PRE_DDL_CAPTURE_CURRENT_RUN_ATTEMPT="$CURRENT_RUN_ATTEMPT" \
              exec bash scripts/production-traffic-cutover.sh maintenance
          fi
          APP_HOST="$APP_HOST" CADDY_ROUTES_PATH="$CADDY_ROUTES_PATH" BODYCAST_DEPLOY_SHA="$RELEASE_SHA" BODYCAST_CAPTURE_PRE_DDL_RELEASE=1 \
            exec bash scripts/production-traffic-cutover.sh maintenance
          REMOTE
          )"
          REMOTE_SCRIPT_B64="$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)"
          REMOTE_COMMAND="bash -c \"\$(printf '%s' '$REMOTE_SCRIPT_B64' | base64 --decode)\" -- '$RELEASE_SHA' '$DEPLOY_PATH_B64' '$APP_HOST_B64' '$ROUTES_PATH_B64' '$RESUME_SOURCE_SHA_B64' '$RESUME_SOURCE_RUN_ID_B64' '$RESUME_SOURCE_RUN_ATTEMPT_B64' '$CURRENT_RUN_ID_B64' '$CURRENT_RUN_ATTEMPT_B64'"
          REMOTE_OUTPUT_FILE="$RUNNER_TEMP/production-maintenance-output.txt"
          timeout 20m ssh -p "$SSH_PORT" -i "$BODYCAST_SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$BODYCAST_KNOWN_HOSTS" -o ConnectTimeout=10 "$SSH_USER@$SSH_HOST" "$REMOTE_COMMAND" | tee "$REMOTE_OUTPUT_FILE"
          if [[ -n "$RESUME_SOURCE_SHA" ]]; then
            mapfile -t RECEIPT_LINES < <(sed -n 's/^BODYCAST_PRE_DDL_RESUME_RECEIPT=//p' "$REMOTE_OUTPUT_FILE")
            [[ "${#RECEIPT_LINES[@]}" -eq 1 && "${RECEIPT_LINES[0]}" =~ ^[A-Za-z0-9+/]+=*$ ]] || {
              echo "::error::Resumed pre-DDL capture did not return exactly one validated receipt."; exit 1;
            }
            echo "resume_receipt_b64=${RECEIPT_LINES[0]}" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify production container and PostgreSQL client versions
        id: target
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -Eeuo pipefail
          SSH=(ssh -p "$SSH_PORT" -i "$BODYCAST_SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$BODYCAST_KNOWN_HOSTS" -o ConnectTimeout=10)
          META="$("${SSH[@]}" "$SSH_USER@$SSH_HOST" 'docker inspect --format "{{.Id}}|{{.Name}}|{{.Config.Image}}|{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}" bodycast-db-prod')"
          [[ "$META" == *"|/bodycast-db-prod|postgres:17-alpine|running|healthy" ]] || { echo "::error::Unexpected production PostgreSQL target."; exit 1; }
          PG_DUMP_VERSION="$("${SSH[@]}" "$SSH_USER@$SSH_HOST" 'docker exec bodycast-db-prod pg_dump --version')"
          PG_RESTORE_VERSION="$(docker run --rm --network host --entrypoint pg_restore public.ecr.aws/docker/library/postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 --version)"
          node --input-type=module - "$PG_DUMP_VERSION" "$PG_RESTORE_VERSION" <<'NODE'
          import { assertPostgresClientCompatibility } from "./scripts/postgres-client-versions.mjs";
          assertPostgresClientCompatibility(process.argv[2], process.argv[3]);
          NODE
          echo "container_id=$(printf '%s' "$META" | cut -d'|' -f1)" >> "$GITHUB_OUTPUT"
      - name: Read-only production identity, full migration set, schema signatures, and locks
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_HOST: ${{ secrets.APP_HOST }}
          CADDY_ROUTES_PATH: ${{ secrets.CADDY_ROUTES_PATH }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          MANIFEST_ID: ${{ needs.authorize.outputs.manifest_id }}
          RESUME_SOURCE_SHA: ${{ needs.authorize.outputs.resume_source_sha }}
          RESUME_SOURCE_RUN_ID: ${{ needs.authorize.outputs.resume_source_run_id }}
          RESUME_SOURCE_RUN_ATTEMPT: ${{ needs.authorize.outputs.resume_source_run_attempt }}
          RESUME_RECEIPT_B64: ${{ steps.maintenance.outputs.resume_receipt_b64 }}
        run: |
          set -Eeuo pipefail
          SSH=(ssh -p "$SSH_PORT" -i "$BODYCAST_SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$BODYCAST_KNOWN_HOSTS" -o ConnectTimeout=10)
          DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w0)"
          APP_HOST_B64="$(printf '%s' "$APP_HOST" | base64 -w0)"
          CADDY_ROUTES_PATH_B64="$(printf '%s' "$CADDY_ROUTES_PATH" | base64 -w0)"
          REMOTE_COMMAND="bash -c 'set -Eeuo pipefail; deploy_path=\$(printf %s $DEPLOY_PATH_B64 | base64 --decode); app_host=\$(printf %s $APP_HOST_B64 | base64 --decode); routes_path=\$(printf %s $CADDY_ROUTES_PATH_B64 | base64 --decode); APP_HOST=\"\$app_host\" CADDY_ROUTES_PATH=\"\$routes_path\" exec bash \"\$deploy_path/scripts/production-db-target.sh\" --preflight bodycast-db-prod'"
          node scripts/production-db-preflight.mjs | "${SSH[@]}" "$SSH_USER@$SSH_HOST" "$REMOTE_COMMAND" \
            > "$RUNNER_TEMP/preflight-report.json"
          node scripts/production-migration-preflight.mjs --preflight --manifest "$MANIFEST_ID" --release-sha "$RELEASE_SHA" --repository "$GITHUB_WORKSPACE" --report "$RUNNER_TEMP/preflight-report.json" \
            > "$RUNNER_TEMP/preflight-result.json"
          node scripts/production-migration-preflight.mjs --execution-integrity --manifest "$MANIFEST_ID" --release-sha "$RELEASE_SHA" --repository "$GITHUB_WORKSPACE" \
            > "$RUNNER_TEMP/execution-integrity.json"
          DEPLOY_PATH_B64="$(printf '%s' "$DEPLOY_PATH" | base64 -w0)"
          REMOTE_CAPTURE_SCRIPT="$(cat <<'REMOTE'
          set -Eeuo pipefail
          DEPLOY_PATH="$(printf '%s' "$1" | base64 --decode)"
          cd -- "$DEPLOY_PATH"
          git_dir="$(git rev-parse --absolute-git-dir)"
          [[ -d "$git_dir" && ! -L "$git_dir" ]] || exit 1
          capture="$git_dir/bodycast-production-pre-ddl-release"
          [[ -f "$capture" && ! -L "$capture" ]] || exit 1
          cat -- "$capture"
          REMOTE
          )"
          REMOTE_CAPTURE_B64="$(printf '%s' "$REMOTE_CAPTURE_SCRIPT" | base64 -w0)"
          REMOTE_CAPTURE_COMMAND="bash -c \"\$(printf '%s' '$REMOTE_CAPTURE_B64' | base64 --decode)\" -- '$DEPLOY_PATH_B64'"
          timeout 2m ssh -p "$SSH_PORT" -i "$BODYCAST_SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$BODYCAST_KNOWN_HOSTS" -o ConnectTimeout=10 "$SSH_USER@$SSH_HOST" "$REMOTE_CAPTURE_COMMAND" \
            | node scripts/production-previous-app-provenance.mjs --verify-preflight "$RUNNER_TEMP/preflight-result.json" "$RELEASE_SHA" \
            > "$RUNNER_TEMP/previous-app-provenance-verification.json"
          node --input-type=module - "$RUNNER_TEMP/preflight-result.json" "$RUNNER_TEMP/previous-app-provenance-verification.json" "$RUNNER_TEMP/preflight-report.json" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { previousAppDatabaseCompatibilityDigests } from "./scripts/production-previous-app-provenance.mjs";
          const [resultPath, verificationPath, reportPath] = process.argv.slice(2);
          const result = JSON.parse(readFileSync(resultPath, "utf8"));
          const verification = JSON.parse(readFileSync(verificationPath, "utf8"));
          const binding = verification.previousAppProvenance;
          if (verification.verified !== true || !binding || result.previousAppProvenance
            || binding.schemaVersion !== 2 || !/^[a-f0-9]{64}$/.test(binding.recordDigest)
            || !["legacy-unlabeled-v1", "release-sha-v1"].includes(binding.provenanceKind)) {
            throw new Error("Previous-app provenance was not verified or is already present in the preflight result.");
          }
          result.previousAppProvenance = binding;
          if (process.env.RESUME_SOURCE_SHA) {
            if (!process.env.RESUME_RECEIPT_B64 || !/^[A-Za-z0-9+/]+=*$/.test(process.env.RESUME_RECEIPT_B64)) {
              throw new Error("Validated preflight capture resume receipt is missing or malformed.");
            }
            const receipt = JSON.parse(Buffer.from(process.env.RESUME_RECEIPT_B64, "base64").toString("utf8"));
            const receiptFields = ["schemaVersion", "sourceRunId", "sourceRunAttempt", "sourceSha", "targetSha",
              "sourceRecordDigest", "currentRecordDigest", "compatibilityDigest"].sort();
            if (!receipt || typeof receipt !== "object" || Array.isArray(receipt)
              || JSON.stringify(Object.keys(receipt).sort()) !== JSON.stringify(receiptFields)
              || receipt.schemaVersion !== 1
              || receipt.sourceRunId !== process.env.RESUME_SOURCE_RUN_ID
              || receipt.sourceRunAttempt !== Number(process.env.RESUME_SOURCE_RUN_ATTEMPT)
              || receipt.sourceSha !== process.env.RESUME_SOURCE_SHA
              || receipt.targetSha !== process.env.RELEASE_SHA
              || receipt.currentRecordDigest !== binding.recordDigest
              || !/^[a-f0-9]{64}$/.test(receipt.sourceRecordDigest)
              || !/^[a-f0-9]{64}$/.test(receipt.compatibilityDigest)) {
              throw new Error("Previous-app resume receipt is not bound to the verified owner run and exact release capture.");
            }
            const rawReport = JSON.parse(readFileSync(reportPath, "utf8"));
            const { compatibilityDigest } = previousAppDatabaseCompatibilityDigests(rawReport);
            if (compatibilityDigest !== receipt.compatibilityDigest) {
              throw new Error("Fresh production DB compatibility differs from the durable resumed app capture.");
            }
            result.previousAppCaptureResume = {
              ...receipt,
              verifiedByRunId: process.env.GITHUB_RUN_ID,
              verifiedByRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            };
          } else if (process.env.RESUME_RECEIPT_B64) {
            throw new Error("A resume receipt was supplied without a verified owner-approved source run.");
          }
          writeFileSync(resultPath, `${JSON.stringify(result, null, 2)}\n`, { mode: 0o600 });
          NODE
          cat "$RUNNER_TEMP/preflight-result.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Capture pg_dump start on production host and create encrypted backup
        id: backup
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          PRODUCTION_BACKUP_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_BACKUP_ENCRYPTION_KEY }}
          EXPECTED_CONTAINER_ID: ${{ steps.target.outputs.container_id }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$RUNNER_TEMP/bodycast-backup-artifact"
          BACKUP_FILE="$RUNNER_TEMP/bodycast-backup-artifact/production-backup.pgdump.enc"
          SSH=(ssh -p "$SSH_PORT" -i "$BODYCAST_SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$BODYCAST_KNOWN_HOSTS" -o ConnectTimeout=10)
          CURRENT_ID="$("${SSH[@]}" "$SSH_USER@$SSH_HOST" 'docker inspect --format "{{.Id}}" bodycast-db-prod')"
          [[ "$CURRENT_ID" == "$EXPECTED_CONTAINER_ID" ]] || { echo "::error::Production DB container changed after inspection."; exit 1; }
          "${SSH[@]}" "$SSH_USER@$SSH_HOST" \
            'docker exec bodycast-db-prod sh -c '\''printf "BODYCAST_BACKUP_STARTED_AT=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >&2; exec pg_dump --format=custom --no-owner --no-privileges --username=bodycast --dbname=bodycast'\''' \
            2> "$RUNNER_TEMP/pgdump-start.log" \
            | node scripts/production-backup-envelope.mjs encrypt --output "$BACKUP_FILE"
          SNAPSHOT_AT="$(sed -n 's/^BODYCAST_BACKUP_STARTED_AT=//p' "$RUNNER_TEMP/pgdump-start.log" | tail -n1)"
          [[ "$SNAPSHOT_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || { echo "::error::Could not prove pg_dump start timestamp."; exit 1; }
          printf '%s\n' "$SNAPSHOT_AT" > "$RUNNER_TEMP/backup-snapshot-start.txt"
          chmod 600 "$BACKUP_FILE"
          echo "file=$BACKUP_FILE" >> "$GITHUB_OUTPUT"
          echo "snapshot_at=$SNAPSHOT_AT" >> "$GITHUB_OUTPUT"
      - name: Restore snapshot, compare source state, and rehearse exact migrations
        env:
          BACKUP_FILE: ${{ steps.backup.outputs.file }}
          PRODUCTION_BACKUP_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_BACKUP_ENCRYPTION_KEY }}
          PGPASSWORD: isolated_restore_test_password
          DATABASE_URL: postgresql://bodycast_restore:isolated_restore_test_password@127.0.0.1:5432/bodycast_restore
          POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        run: |
          set -Eeuo pipefail
          node scripts/restore-encrypted-postgres-backup.mjs
          node scripts/production-db-preflight.mjs | psql "$DATABASE_URL" --no-psqlrc --quiet --tuples-only --no-align --set=ON_ERROR_STOP=1 > "$RUNNER_TEMP/restored-base-report.json"
          psql "$DATABASE_URL" --no-psqlrc --quiet --tuples-only --no-align --set=ON_ERROR_STOP=1 --file=scripts/verify-restored-backup.sql > "$RUNNER_TEMP/restored-readability.json"
          node scripts/production-migration-restore-check.mjs --base \
            --source "$RUNNER_TEMP/preflight-report.json" --restored "$RUNNER_TEMP/restored-base-report.json" \
            --readability "$RUNNER_TEMP/restored-readability.json" --repository "$GITHUB_WORKSPACE" \
            > "$RUNNER_TEMP/restore-base-result.json"
          node scripts/production-migration-preflight.mjs --execution-integrity --manifest active-energy-unified-v2 --release-sha "$GITHUB_SHA" --repository "$GITHUB_WORKSPACE" \
            > "$RUNNER_TEMP/execution-integrity.json"
          PRISMA_DATABASE_URL="$(node --input-type=module -e 'import { withPrismaLockTimeout } from "./scripts/production-migration-release.mjs"; process.stdout.write(withPrismaLockTimeout(process.env.DATABASE_URL,5000))')"
          DATABASE_URL="$PRISMA_DATABASE_URL" npx prisma migrate deploy --schema prisma/schema.prisma
          node scripts/production-db-preflight.mjs | psql "$DATABASE_URL" --no-psqlrc --quiet --tuples-only --no-align --set=ON_ERROR_STOP=1 > "$RUNNER_TEMP/restored-postflight-report.json"
          node scripts/production-migration-restore-check.mjs --postflight --manifest active-energy-unified-v2 --repository "$GITHUB_WORKSPACE" \
            --report "$RUNNER_TEMP/restored-postflight-report.json" > "$RUNNER_TEMP/restore-postflight-result.json"
          node scripts/production-migration-restore-check.mjs --combine \
            --base "$RUNNER_TEMP/restore-base-result.json" --postflight "$RUNNER_TEMP/restore-postflight-result.json" \
            > "$RUNNER_TEMP/restore-result.json"
          cat "$RUNNER_TEMP/restore-result.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Create preflight evidence bundle
        env:
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
          MANIFEST_ID: ${{ needs.authorize.outputs.manifest_id }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$RUNNER_TEMP/bodycast-evidence-artifact"
          node scripts/production-migration-evidence.mjs \
            "$RUNNER_TEMP/preflight-report.json" "$RUNNER_TEMP/preflight-result.json" "$RUNNER_TEMP/restore-result.json" \
            "$RUNNER_TEMP/backup-snapshot-start.txt" "$RUNNER_TEMP/bodycast-backup-artifact/production-backup.pgdump.enc" \
            "$RUNNER_TEMP/bodycast-evidence-artifact/preflight-evidence.json"
          cp "$RUNNER_TEMP/preflight-result.json" "$RUNNER_TEMP/bodycast-evidence-artifact/preflight-result.json"
          cp "$RUNNER_TEMP/restore-result.json" "$RUNNER_TEMP/bodycast-evidence-artifact/restore-result.json"
          cp "$RUNNER_TEMP/preflight-report.json" "$RUNNER_TEMP/bodycast-evidence-artifact/preflight-report.json"
          cp "$RUNNER_TEMP/execution-integrity.json" "$RUNNER_TEMP/bodycast-evidence-artifact/execution-integrity.json"
          chmod 600 "$RUNNER_TEMP/bodycast-evidence-artifact/"*
      - name: Upload encrypted production backup artifact
        id: backup_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bodycast-backup-${{ needs.authorize.outputs.release_sha }}-${{ needs.authorize.outputs.manifest_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bodycast-backup-artifact/production-backup.pgdump.enc
          if-no-files-found: error
          retention-days: 90
      - name: Upload immutable preflight and restore evidence artifact
        id: evidence_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bodycast-preflight-evidence-${{ needs.authorize.outputs.release_sha }}-${{ needs.authorize.outputs.manifest_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bodycast-evidence-artifact/*
          if-no-files-found: error
          retention-days: 90
      - name: Report read-only completion
        if: success()
        run: |
          {
            echo ""
            echo "- Backup artifact id: ${{ steps.backup_artifact.outputs.artifact-id }}"
            echo "- Backup artifact SHA-256: ${{ steps.backup_artifact.outputs.artifact-digest }}"
            echo "- Evidence artifact id: ${{ steps.evidence_artifact.outputs.artifact-id }}"
            echo "- Snapshot time: production host immediately before pg_dump"
            echo "- disposable restored schema rehearsal: PASS"
            echo "- production migration: NOT EXECUTED"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/bodycast-ssh"
