name: Production migration safety tooling CI

on:
  pull_request:
    paths:
      - ".github/workflows/production-migration-safety-ci.yml"
      - ".github/workflows/production-migration-preflight.yml"
      - "scripts/backup-postgres.mjs"
      - "scripts/backup-postgres.ps1"
      - "scripts/production-backup-envelope.mjs"
      - "scripts/production-db-preflight.sql"
      - "scripts/production-migration-preflight.mjs"
      - "scripts/verify-postgres-restore.mjs"
      - "scripts/verify-postgres-restore.ps1"
      - "scripts/verify-restored-backup.sql"
      - "scripts/ci/production-safety-postgres-smoke.mjs"
      - "tests/production-safety-tooling.test.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: production-migration-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  disposable-postgres-smoke:
    name: Disposable PostgreSQL backup and restore safety smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      source-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bodycast
          POSTGRES_USER: bodycast
          POSTGRES_PASSWORD: bodycast_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bodycast -d bodycast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      restore-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bodycast_restore
          POSTGRES_USER: bodycast_restore
          POSTGRES_PASSWORD: restore_ci_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bodycast_restore -d bodycast_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run targeted safety-tooling tests
        run: npm run test:unit -- tests/production-safety-tooling.test.mjs

      - name: Run real PostgreSQL encrypted backup, restore, and fail-closed smoke
        env:
          BODYCAST_SOURCE_PORT: 5432
          BODYCAST_RESTORE_PORT: 5433
        run: node scripts/ci/production-safety-postgres-smoke.mjs
