name: Production migration safety tooling CI

on:
  pull_request:
    paths:
      - ".github/workflows/production-migration-safety-ci.yml"
      - ".github/workflows/production-migration-preflight.yml"
      - ".github/workflows/production-migrate.yml"
      - "Dockerfile"
      - "prisma/migrations/**"
      - "scripts/production-migration-*.mjs"
      - "scripts/production-traffic-cutover.sh"
      - "scripts/unified-*-postflight.ts"
      - "scripts/unified-v4-*.ts"
      - "scripts/production-migration-verification-keys.json"
      - "scripts/production-db-preflight.mjs"
      - "scripts/production-db-preflight.sql"
      - "scripts/production-db-target-url.mjs"
      - "scripts/production-db-target.sh"
      - "scripts/deploy-migrate.sh"
      - "scripts/run-prisma-migrate-with-lock-timeout.mjs"
      - "scripts/ci/production-migration-prisma-checksum.integration.mjs"
      - "docs/development/production-migration-v5-runbook.md"
      - "docs/architecture/unified-glycogen-v4-rollout.md"
      - "src/modules/model-episodes/unified-rollout-v4.service.ts"
      - "src/model/body-composition/physical-glycogen-water-v4.ts"
      - "scripts/backup-postgres.mjs"
      - "scripts/backup-postgres.ps1"
      - "scripts/production-backup-envelope.mjs"
      - "scripts/restore-encrypted-postgres-backup.mjs"
      - "scripts/production-db-preflight.sql"
      - "scripts/production-migration-preflight.mjs"
      - "scripts/production-migration-readiness.sh"
      - "scripts/production-migration-summary.sh"
      - "scripts/postgres-client-versions.mjs"
      - "scripts/filter-ssh-known-hosts.mjs"
      - "scripts/verify-postgres-restore.mjs"
      - "scripts/verify-postgres-restore.ps1"
      - "scripts/verify-restored-backup.sql"
      - "scripts/ci/production-safety-postgres-smoke.mjs"
      - "tests/production-safety-tooling.test.mjs"
      - "tests/production-migration-v5.test.mjs"
      - "tests/deploy-script-ordering.test.ts"
      - "tests/production-migration-release-tooling.sh"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: production-migration-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  disposable-postgres-smoke:
    name: Disposable PostgreSQL backup and restore safety smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      source-postgres:
        image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: bodycast
          POSTGRES_USER: bodycast
          POSTGRES_PASSWORD: bodycast_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bodycast -d bodycast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      restore-postgres:
        image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: bodycast_restore
          POSTGRES_USER: bodycast_restore
          POSTGRES_PASSWORD: restore_ci_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bodycast_restore -d bodycast_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --label bodycast.environment=nonproduction
          --label bodycast.disposable=true
    steps:
      - name: Checkout PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client for final-target identity smoke
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Run targeted safety-tooling tests
        run: npm run test:unit -- tests/production-migration-v5.test.mjs tests/production-safety-tooling.test.mjs

      - name: Check production migration shell syntax
        run: bash -n scripts/deploy-migrate.sh scripts/production-migration-readiness.sh scripts/production-migration-summary.sh tests/production-migration-release-tooling.sh

      - name: Build migrator image and verify in-image migration bytes
        run: |
          docker build --target migrator --tag bodycast-migrator-safety-ci .
          docker run --rm --entrypoint node bodycast-migrator-safety-ci /app/scripts/production-migration-image-check.mjs /app

      - name: Verify Prisma checksum and 5-second lock timeout against isolated PostgreSQL
        env:
          BODYCAST_TEST_DATABASE_URL: postgresql://bodycast:bodycast_ci_only@127.0.0.1:5432/bodycast
        run: node scripts/ci/production-migration-prisma-checksum.integration.mjs

      - name: Run production migration release-tooling shell regressions
        env:
          BODYCAST_TEST_DATABASE_URL: postgresql://bodycast:bodycast_ci_only@127.0.0.1:5432/bodycast
        run: |
          bash -n scripts/production-migration-readiness.sh scripts/production-migration-summary.sh tests/production-migration-release-tooling.sh
          bash tests/production-migration-release-tooling.sh

      - name: Run real PostgreSQL encrypted backup, restore, and fail-closed smoke
        env:
          BODYCAST_SOURCE_PORT: 5432
          BODYCAST_RESTORE_PORT: 5433
        run: node scripts/ci/production-safety-postgres-smoke.mjs
