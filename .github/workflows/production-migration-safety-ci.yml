      - "tests/production-v4-derived-recovery-workflow.test.mjs"
      - "tests/production-v4-recovery-headroom.test.mjs"
      - "tests/production-v4-schema-digest.test.mjs"
      - "tests/postgres-storage-peak-sampler.test.mjs"
      - "tests/postgres-storage-peak-sampler.container.test.mjs"
      - "tests/production-writer-drain.test.mjs"
      - "tests/deploy-script-ordering.test.ts"
      - "tests/production-deploy-rollback-safety.test.ts"
      - "tests/production-traffic-cutover-freshness.test.ts"
      - "tests/production-release-entrypoints.test.ts"
      - "tests/production-database-cutback.test.mjs"
      - "tests/production-database-cutback-freshness.test.ts"
      - "tests/production-previous-app-provenance.test.mjs"
      - "tests/production-preflight-resume.test.mjs"
      - "scripts/ci/production-database-cutback-postgres-smoke.mjs"
      - "scripts/ci/production-database-cutback-promotion-failure-injection.sh"
      - "tests/production-release-terminal-safety.test.ts"
      - "tests/production-deploy-rollback.test.ts"
      - "tests/deploy-main-freshness.test.ts"
      - "tests/production-deploy-gate.test.ts"
      - "tests/production-migration-release-tooling.sh"
      - "tests/production-recovery-*.test.mjs"
      - "tests/production-recovery-marker-reader.sh"
      - "tests/integration/production-recovery-*.test.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: production-migration-safety-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  safety-unit-regressions:
    name: Production release and recovery safety regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Replay complete signed forward-resume evidence without production credentials
        run: npx vitest run tests/forward-resume-evidence-replay.test.mjs tests/production-preflight-resume.test.mjs
      - name: Generate Prisma client for final-target identity smoke
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Run targeted safety-tooling tests
        run: npm run test:unit -- tests/production-forward-resume.test.mjs tests/forward-resume-armed-retry.test.mjs tests/production-release-marker.test.mjs tests/production-migration-v5.test.mjs tests/production-no-app-preflight.test.mjs tests/production-no-app-workflow.test.mjs tests/production-safety-tooling.test.mjs tests/production-writer-drain.test.mjs

      - name: Run production release boundary regressions
        run: npm run test:unit -- tests/deploy-script-ordering.test.ts tests/production-full-history-recalculate-cutover.test.ts tests/full-history-recalculation.service.test.ts tests/production-deploy-rollback.test.ts tests/production-deploy-rollback-safety.test.ts tests/production-traffic-cutover-freshness.test.ts tests/production-release-entrypoints.test.ts tests/production-database-cutback.test.mjs tests/production-previous-app-provenance.test.mjs tests/production-release-terminal-safety.test.ts tests/deploy-main-freshness.test.ts tests/production-deploy-gate.test.ts tests/production-recovery-boundary.test.mjs tests/production-schema-deploy-handoff.test.mjs tests/production-v4-derived-recovery.test.mjs tests/production-v4-derived-recovery-workflow.test.mjs tests/production-v4-recovery-headroom.test.mjs tests/production-v4-schema-digest.test.mjs tests/postgres-storage-peak-sampler.test.mjs tests/health-sync-audit-retention-integrity.test.ts

      - name: Run PostgreSQL 17.11 storage sampler real-container smoke
        env:
          BODYCAST_REQUIRE_POSTGRES_STORAGE_CONTAINER_TEST: "1"
        run: npm run test:unit -- tests/postgres-storage-peak-sampler.container.test.mjs

      - name: Run production recovery workflow protocol tests
        run: npm run test:unit -- tests/production-recovery-authority.test.mjs tests/production-recovery-authorization.test.mjs tests/production-recovery-boundary.test.mjs tests/production-recovery-flow.test.mjs tests/production-recovery-client.test.mjs tests/production-recovery-package.test.mjs

      - name: Check production migration shell syntax
        run: bash -n scripts/deploy-migrate.sh scripts/production-migration-readiness.sh scripts/production-migration-summary.sh scripts/production-writer-drain.sh scripts/production-release-marker.sh scripts/production-release-lock.sh scripts/production-no-app-preflight-host.sh scripts/deploy-main-freshness.sh scripts/production-route-path.sh scripts/production-route-primitives.sh scripts/production-traffic-cutover.sh scripts/production-database-cutback.sh scripts/production-database-cutback-promotion.sh scripts/production-database-cutback-lifecycle.sh scripts/production-db-data-fingerprint.sh scripts/deploy.sh scripts/production-recovery/production-authority-launcher.sh scripts/production-recovery/production-operation-client-launcher.sh scripts/production-checkout-diagnostic.sh scripts/production-app-container-health-wait.sh scripts/production-v4-derived-recovery-host.sh scripts/production-empty-install-host.sh tests/production-checkout-diagnostic.test.sh tests/production-app-container-health-wait.test.sh tests/production-migration-release-tooling.sh tests/production-recovery-marker-reader.sh scripts/ci/production-database-cutback-promotion-failure-injection.sh

      - name: Exercise read-only production checkout diagnostic against an isolated Git fixture
        run: bash tests/production-checkout-diagnostic.test.sh

      - name: Verify exact-SHA app startup waits fail closed
        run: bash tests/production-app-container-health-wait.test.sh

      - name: Run V1/V2 marker reader fail-closed compatibility matrix
        run: bash tests/production-recovery-marker-reader.sh

  migrator-image-and-compose:
    name: Migrator image and recovery Compose safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build migrator image and verify in-image migration bytes
        run: |
          docker build --target migrator --tag bodycast-migrator-safety-ci .
          docker run --rm --entrypoint node bodycast-migrator-safety-ci /app/scripts/production-migration-image-check.mjs /app

      - name: Validate isolated recovery Compose topology
        env:
          BODYCAST_ROLLBACK_IMAGE: ghcr.io/bodycast/app@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BODYCAST_PRODUCTION_ENV_FILE: .env.production.example
          BODYCAST_RECOVERY_DATABASE_URL_FILE: /dev/null
          BODYCAST_PRODUCTION_DATABASE_URL_FILE: /dev/null
        run: docker compose -f docker-compose.recovery.yml config --quiet

  legacy-v4-recovery-image:
    name: Exact legacy 65-schema V4 recovery tool image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: docker.io/library/postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: bodycast
          POSTGRES_USER: bodycast
          POSTGRES_PASSWORD: bodycast_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bodycast -d bodycast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout main-side release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for isolated 65-schema evidence tests
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies and generate current-main test client
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
        run: npm ci && npx prisma generate --schema prisma/schema.prisma

      - name: Assemble only the exact audited legacy source plus pinned release wrapper
        run: |
          set -Eeuo pipefail
          LEGACY_SHA="$(node --input-type=module -e 'import { LEGACY_V4_RECOVERY } from "./scripts/production-v4-derived-recovery.mjs"; process.stdout.write(LEGACY_V4_RECOVERY.sourceSha)')"
          [[ "$LEGACY_SHA" =~ ^[a-f0-9]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/bodycast-v4-tool/source/scripts"
          git fetch --no-tags https://github.com/krustallik/body-model.git "$LEGACY_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$LEGACY_SHA"
          git archive "$LEGACY_SHA" | tar -x -C "$RUNNER_TEMP/bodycast-v4-tool/source"
          cp Dockerfile.v4-derived-recovery "$RUNNER_TEMP/bodycast-v4-tool/source/Dockerfile.v4-derived-recovery"
          cp scripts/production-v4-recovery-evidence.ts "$RUNNER_TEMP/bodycast-v4-tool/source/scripts/production-v4-recovery-evidence.ts"
          mkdir -p "$RUNNER_TEMP/bodycast-v4-tool/source/src/modules/health"
          cp src/modules/health/health-sync-audit-retention-integrity.ts \
            "$RUNNER_TEMP/bodycast-v4-tool/source/src/modules/health/health-sync-audit-retention-integrity.ts"
          cp scripts/production-v4-derived-recovery.mjs "$RUNNER_TEMP/bodycast-v4-tool/source/scripts/production-v4-derived-recovery.mjs"
          docker build --file "$RUNNER_TEMP/bodycast-v4-tool/source/Dockerfile.v4-derived-recovery" \
            --tag bodycast-v4-derived-recovery-ci "$RUNNER_TEMP/bodycast-v4-tool/source"

      - name: Create isolated database and apply the exact 65-migration schema
        env:
          DATABASE_URL: postgresql://bodycast:bodycast_ci_only@127.0.0.1:5432/bodycast_v4_recovery_test
          PGPASSWORD: bodycast_ci_only
        run: |
          set -Eeuo pipefail
          psql --host=127.0.0.1 --username=bodycast --dbname=bodycast --set=ON_ERROR_STOP=1 \
            --command='CREATE DATABASE bodycast_v4_recovery_test'
          node --input-type=module -e 'const u = new URL(process.env.DATABASE_URL); if (u.hostname !== "127.0.0.1" || u.pathname !== "/bodycast_v4_recovery_test") process.exit(1)'
          docker run --rm --network host --env "DATABASE_URL=$DATABASE_URL" bodycast-v4-derived-recovery-ci \
            node /app/node_modules/prisma/build/index.js migrate deploy --schema /app/prisma/schema.prisma

      - name: Create independently migrated canonical 65-schema test database
        env:
          PGPASSWORD: bodycast_ci_only
          DATABASE_URL: postgresql://bodycast:bodycast_ci_only@127.0.0.1:5432/bodycast_v4_canonical65
        run: |
          set -Eeuo pipefail
          psql --host=127.0.0.1 --username=bodycast --dbname=bodycast --set=ON_ERROR_STOP=1 \
            --command='CREATE DATABASE bodycast_v4_canonical65'
          docker run --rm --network host --env DATABASE_URL="$DATABASE_URL" --entrypoint node bodycast-v4-derived-recovery-ci \
            /app/node_modules/prisma/build/index.js migrate deploy --schema /app/prisma/schema.prisma

      - name: Verify image-bound schema, source evidence and fail-closed empty state
        env:
          DATABASE_URL: postgresql://bodycast:bodycast_ci_only@127.0.0.1:5432/bodycast_v4_recovery_test
        run: |
          set -Eeuo pipefail
          docker run --rm --network host --env "DATABASE_URL=$DATABASE_URL" bodycast-v4-derived-recovery-ci \
            node /app/dist/production-v4-recovery-evidence.mjs > "$RUNNER_TEMP/recovery-evidence.json"
          node --input-type=module - "$RUNNER_TEMP/recovery-evidence.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (report.database?.database !== "bodycast_v4_recovery_test" || !report.database.version.startsWith("17.")
            || report.migrationRows.length !== 65 || report.expectedMigrationRows.length !== 65
            || report.migrationRows.some((row, i) => row.name !== report.expectedMigrationRows[i].name
              || row.checksum !== report.expectedMigrationRows[i].checksum || !row.finishedAt || row.rolledBackAt !== null)
            || !/^[a-f0-9]{64}$/.test(report.sourceFingerprint) || report.lifecycle !== null || report.blocks.length !== 0) {
            throw new Error("Exact legacy recovery image did not report its isolated 65-migration identity safely.");
          }
          NODE
          if docker run --rm --network host --env "DATABASE_URL=$DATABASE_URL" bodycast-v4-derived-recovery-ci \
            node /app/dist/production-full-history-recalculate.mjs --derived-v4-recovery --owner-authorized --profile-id 1; then
            echo "::error::Recovery unexpectedly accepted an empty schema without V4 epoch 1."; exit 1
          fi
          migration_count="$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 \
            --command='SELECT count(*) FROM public."_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL')"
          [[ "$migration_count" == 65 ]] || { echo "::error::Recovery changed the isolated migration ledger."; exit 1; }

      - name: Rehearse dynamic publication source evidence on the isolated 65-migration schema
        env:
          DATABASE_URL: postgresql://bodycast:bodycast_ci_only@127.0.0.1:5432/bodycast_v4_recovery_test
          BODYCAST_V4_RECOVERY_TEST_DATABASE_URL: postgresql://bodycast:bodycast_ci_only@127.0.0.1:5432/bodycast_v4_recovery_test
          BODYCAST_V4_RECOVERY_TEST_IMAGE: bodycast-v4-derived-recovery-ci
        run: node scripts/ci/production-v4-fence-evidence-postgres-smoke.mjs

      - name: Verify deterministic PostgreSQL 17.11 schema digest pipelines
        env:
          PGPASSWORD: bodycast_ci_only
          BODYCAST_V4_SCHEMA_DIGEST_TEST_DATABASE_URL: postgresql://bodycast:bodycast_ci_only@127.0.0.1:5432/bodycast_v4_recovery_test
          BODYCAST_V4_SCHEMA_DIGEST_CANONICAL_DATABASE_URL: postgresql://bodycast:bodycast_ci_only@127.0.0.1:5432/bodycast_v4_canonical65
          BODYCAST_V4_SCHEMA_DIGEST_PG_IMAGE: docker.io/library/postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        run: node scripts/ci/production-v4-schema-digest-postgres-smoke.mjs

  postgres-recovery-integration:
    name: Disposable PostgreSQL recovery integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: docker.io/library/postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: bodycast
          POSTGRES_USER: bodycast
          POSTGRES_PASSWORD: bodycast_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bodycast -d bodycast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Create isolated recovery test database
        env:
          PGPASSWORD: bodycast_ci_only
        run: psql --host=127.0.0.1 --username=bodycast --dbname=bodycast --command='CREATE DATABASE bodycast_recovery_test'

      - name: Apply the reviewed Prisma schema to the isolated recovery test database
        env:
          DATABASE_URL: postgresql://bodycast:bodycast_ci_only@127.0.0.1:5432/bodycast_recovery_test
        run: |
          set -Eeuo pipefail
          baseline_root="$RUNNER_TEMP/bodycast-auth-74-baseline"
          mkdir -p "$baseline_root"
          git archive 0f93f37dd6a4208cfc74331a0fb4c063c542c6bd prisma/schema.prisma prisma/migrations | tar -x -C "$baseline_root"
          baseline_count="$(find "$baseline_root/prisma/migrations" -mindepth 2 -maxdepth 2 -name migration.sql -type f | wc -l | tr -d ' ')"
          test "$baseline_count" = 74
          npx prisma migrate deploy --schema "$baseline_root/prisma/schema.prisma"
          psql "$DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public."Profile" ("id", "sex", "dateOfBirth", "heightCm", "createdAt", "updatedAt")
          VALUES (1, 'female', DATE '1990-01-01', 170.00, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP);
          SQL
          npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Run PostgreSQL recovery read-only-role and lifecycle integration tests
        env:
          BODYCAST_RECOVERY_TEST_DATABASE_URL: postgresql://bodycast:bodycast_ci_only@127.0.0.1:5432/bodycast_recovery_test
        run: npm run test:integration -- tests/integration/full-history-raw-input-inventory.integration.test.ts tests/integration/production-recovery-readonly-role.integration.test.ts tests/integration/production-recovery-flow.integration.test.ts

  postgres-migration-checksum:
    name: PostgreSQL migration checksum and release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: docker.io/library/postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: bodycast
          POSTGRES_USER: bodycast
          POSTGRES_PASSWORD: bodycast_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bodycast -d bodycast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Verify Prisma checksum and 5-second lock timeout against isolated PostgreSQL
        env:
          BODYCAST_TEST_DATABASE_URL: postgresql://bodycast:bodycast_ci_only@127.0.0.1:5432/bodycast
        run: node scripts/ci/production-migration-prisma-checksum.integration.mjs

      - name: Verify programless-session migrations and exact PostgreSQL signatures
        env:
          BODYCAST_DYNAMIC_MIGRATION_TEST_DATABASE_URL: postgresql://bodycast:bodycast_ci_only@127.0.0.1:5432/bodycast
        run: node scripts/ci/programless-session-migration-postgres-smoke.mjs

      - name: Rehearse the exact Auth manifest from the pinned 74-migration baseline
        env:
          BASELINE_SHA: 0f93f37dd6a4208cfc74331a0fb4c063c542c6bd
          DATABASE_URL: postgresql://bodycast:bodycast_ci_only@127.0.0.1:5432/bodycast
        run: |
          set -Eeuo pipefail
          baseline_root="$RUNNER_TEMP/bodycast-auth-74-baseline"
          git fetch --no-tags https://github.com/krustallik/body-model.git "$BASELINE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$BASELINE_SHA"
          mkdir -p "$baseline_root"
          git archive "$BASELINE_SHA" prisma/schema.prisma prisma/migrations | tar -x -C "$baseline_root"
          baseline_count="$(find "$baseline_root/prisma/migrations" -mindepth 2 -maxdepth 2 -name migration.sql -type f | wc -l | tr -d ' ')"
          test "$baseline_count" = 74
          export BODYCAST_TEST_DATABASE_URL="$DATABASE_URL"
          npx prisma migrate deploy --schema "$baseline_root/prisma/schema.prisma"
          applied_before="$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 \
            --command='SELECT count(*) FROM public."_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL')"
          test "$applied_before" = 74
          psql "$DATABASE_URL" --no-psqlrc --quiet --set=ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public."Profile" ("id", "sex", "dateOfBirth", "heightCm", "createdAt", "updatedAt")
          VALUES (DEFAULT, 'female', DATE '1990-01-01', 170.00, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP);
          SQL
          node scripts/production-migration-preflight.mjs --verify-release-tree \
            --manifest auth-multiuser-v1 --repository "$GITHUB_WORKSPACE"
          topology_json="$(node --input-type=module <<'NODE'
          process.stdout.write(JSON.stringify({
            schemaVersion: 1,
            contract: "bodycast-compose-internal-db-single-writer-v1",
            ready: true,
            blockers: [],
            observedAt: new Date().toISOString(),
            app: { name: "bodycast-app-prod", state: "absent", restartPolicy: null },
            database: { name: "bodycast-db-prod", state: "running", health: "healthy", publishedPostgresPort: false, networks: ["bodycast-backend-prod"] },
            backendNetwork: { name: "bodycast-backend-prod", containers: ["bodycast-db-prod"] },
            caddy: { name: "gymbeam-caddy", state: "running", configValidated: true },
            routeFile: { verified: true, maintenanceResponse: true, containsReverseProxy: false, sha256: "a".repeat(64) },
          }));
          NODE
          )"
          node scripts/production-db-preflight.mjs --manifest auth-multiuser-v1 \
            | PGAPPNAME=bodycast-production-preflight psql "$DATABASE_URL" --no-psqlrc --quiet --tuples-only --no-align --set=ON_ERROR_STOP=1 \
              --set="BODYCAST_WRITER_TOPOLOGY_JSON=$topology_json" > "$RUNNER_TEMP/bodycast-auth-preflight-report.json"
          # The identity gate must see the production database name (`bodycast`),
          # while the test fingerprint helper intentionally accepts only an
          # isolated test database name. Fingerprint an exact disposable clone.
          psql postgresql://bodycast:bodycast_ci_only@127.0.0.1:5432/postgres --no-psqlrc --quiet --set=ON_ERROR_STOP=1 \
            --command='CREATE DATABASE bodycast_restore TEMPLATE bodycast'
          export BODYCAST_TEST_DATABASE_URL=postgresql://bodycast:bodycast_ci_only@127.0.0.1:5432/bodycast_restore
          fingerprint="$(bash scripts/production-db-data-fingerprint.sh --test-url)"
          node --input-type=module - "$RUNNER_TEMP/bodycast-auth-preflight-report.json" "$fingerprint" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const [reportPath, fingerprint] = process.argv.slice(2);
          const report = JSON.parse(readFileSync(reportPath, 'utf8'));
          if (!/^[a-f0-9]{64}$/.test(fingerprint)) throw new Error('Isolated baseline data fingerprint is malformed.');
          report.logicalDataFingerprint = fingerprint;
          writeFileSync(reportPath, `${JSON.stringify(report)}\n`);
          NODE
          node scripts/production-migration-preflight.mjs --preflight \
            --manifest auth-multiuser-v1 --release-sha "$GITHUB_SHA" \
            --repository "$GITHUB_WORKSPACE" --report "$RUNNER_TEMP/bodycast-auth-preflight-report.json"
          npx prisma migrate deploy --schema prisma/schema.prisma
          node scripts/production-db-preflight.mjs --manifest auth-multiuser-v1 \
            | psql "$DATABASE_URL" --no-psqlrc --quiet --tuples-only --no-align \
            --set=ON_ERROR_STOP=1 > "$RUNNER_TEMP/bodycast-training-postflight.json"
          set +e
          node scripts/production-migration-preflight.mjs --postflight \
            --manifest auth-multiuser-v1 \
            --report "$RUNNER_TEMP/bodycast-training-postflight.json" \
            --repository "$GITHUB_WORKSPACE" --release-sha "$GITHUB_SHA"
          postflight_status=$?
          set -e
          if [ "$postflight_status" -ne 0 ]; then
            node --input-type=module - "$RUNNER_TEMP/bodycast-training-postflight.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          import { AUTH_MULTIUSER_MANIFEST } from './scripts/production-migration-manifests.mjs';
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const names = [
            'User_email_key',
            'Profile_userId_fkey',
            'Workout_profileId_fkey',
            'HealthSyncSnapshot_profileId_dailyHealthDataId_fkey',
          ];
          for (const name of names) {
            const object = report.objects?.find((candidate) => candidate.name === name);
            const expected = AUTH_MULTIUSER_MANIFEST.postflightSignatureEquals[name]
              ?? AUTH_MULTIUSER_MANIFEST.postflightSignatureIncludes[name]
              ?? null;
            process.stdout.write(`[schema-signature-diagnostic] ${JSON.stringify({ name, present: object?.present ?? false, kind: object?.kind ?? null, actual: object?.signature ?? null, expected })}\n`);
          }
          NODE
            exit "$postflight_status"
          fi

      - name: Run production migration release-tooling shell regressions
        env:
          BODYCAST_TEST_DATABASE_URL: postgresql://bodycast:bodycast_ci_only@127.0.0.1:5432/bodycast
        run: |
          bash -n scripts/production-migration-readiness.sh scripts/production-migration-summary.sh scripts/production-writer-drain.sh scripts/production-release-marker.sh scripts/production-release-lock.sh scripts/deploy-main-freshness.sh scripts/production-route-path.sh scripts/production-route-primitives.sh scripts/production-traffic-cutover.sh scripts/production-database-cutback.sh scripts/deploy.sh scripts/production-checkout-diagnostic.sh scripts/production-app-container-health-wait.sh tests/production-checkout-diagnostic.test.sh tests/production-app-container-health-wait.test.sh tests/production-migration-release-tooling.sh
          bash tests/production-migration-release-tooling.sh

