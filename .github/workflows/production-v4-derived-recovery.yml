            coveredModelDayKeys: report.rehearsalCoverage?.coveredModelDayKeys,
            coverageSha256: report.rehearsalCoverage?.sha256 });
          assertArtifactBinding({ ...JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/bodycast-v4-artifact/artifact.json`, "utf8")),
            ledgerRows: report.evidence.expectedMigrationRows.map((row) => ({ ...row, finishedAt: "verified-in-restored-ledger", rolledBackAt: null })) });
          if (migrationLedgerDigest(report.evidence.migrationRows) !== report.evidence.expectedLedgerDigest
            || report.evidence.sourceFingerprint !== report.restoredSourceFingerprint) throw new Error("Backup source and live production fingerprint differ.");
          assertOneShotRecoveryState({ marker: { state: "ready", sourceSha: process.env.RECOVERY_SHA,
            preflightRunId: report.preflightRunId, workflowSha: report.preflightSha, terminal: false },
            lockHeld: true, preflightRunId: report.preflightRunId, preflightSha: report.preflightSha,
            preflightConclusion: "success", preflightAgeSeconds: age, currentRunAttempt: process.env.GITHUB_RUN_ATTEMPT });
          NODE
      - name: Recheck owner and production SSH controls
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" == "krustallik/body-model" && "$GITHUB_REF" == refs/heads/main && "$GITHUB_ACTOR_ID" == 126446430 ]]
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ && "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ && "$DEPLOY_PATH" == /* ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT > 0 && SSH_PORT <= 65535 ))
          [[ "$SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          install -d -m 700 "$RUNNER_TEMP/bodycast-v4-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/bodycast-v4-ssh/id"; chmod 600 "$RUNNER_TEMP/bodycast-v4-ssh/id"
          ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" > "$RUNNER_TEMP/bodycast-v4-ssh/candidate" 2>/dev/null
          node scripts/filter-ssh-known-hosts.mjs "$RUNNER_TEMP/bodycast-v4-ssh/candidate" "$RUNNER_TEMP/bodycast-v4-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/bodycast-v4-ssh/known_hosts"
          echo "BODYCAST_SSH_KEY=$RUNNER_TEMP/bodycast-v4-ssh/id" >> "$GITHUB_ENV"
          echo "BODYCAST_KNOWN_HOSTS=$RUNNER_TEMP/bodycast-v4-ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Transfer immutable artifact/evidence and execute the pinned derived-only entrypoint
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RECOVERY_SHA: ${{ needs.authorize.outputs.recovery_sha }}
          IMAGE_ID: ${{ needs.build-tool.outputs.image_id }}
          IMAGE_DIGEST: ${{ needs.build-tool.outputs.image_digest }}
          ARCHIVE_SHA: ${{ needs.build-tool.outputs.archive_sha256 }}
          SCHEMA_DIGEST_CONTRACT: ${{ needs.build-tool.outputs.schema_digest_contract }}
          SCHEMA_DIGEST_HELPER_SHA256: ${{ needs.build-tool.outputs.schema_digest_helper_sha256 }}
        run: |
          set -Eeuo pipefail
          artifact_dir="/var/lib/bodycast/recovery/artifacts/$RECOVERY_SHA/$GITHUB_RUN_ID"
          HEADROOM_METRICS_JSON="$(node -p 'JSON.stringify(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).headroomMeasurements)' "$RUNNER_TEMP/bodycast-v4-artifact/preflight.json")"
          HOST_SCRIPT_SHA="$(sha256sum scripts/production-v4-derived-recovery-host.sh | awk '{print $1}')"
          HEADROOM_SCRIPT_SHA="$(sha256sum scripts/production-v4-recovery-headroom.mjs | awk '{print $1}')"
          ACTUAL_SCHEMA_DIGEST_HELPER_SHA256="$(sha256sum scripts/production-v4-schema-digest.mjs | awk '{print $1}')"
          ACTUAL_SCHEMA_DIGEST_CONTRACT="$(node scripts/production-v4-schema-digest.mjs --contract)"
          [[ "$HOST_SCRIPT_SHA" =~ ^[a-f0-9]{64}$ && "$HEADROOM_SCRIPT_SHA" =~ ^[a-f0-9]{64}$ \
            && "$ACTUAL_SCHEMA_DIGEST_HELPER_SHA256" == "$SCHEMA_DIGEST_HELPER_SHA256" \
            && "$ACTUAL_SCHEMA_DIGEST_CONTRACT" == "$SCHEMA_DIGEST_CONTRACT" ]]
          SSH=(ssh -p "$SSH_PORT" -i "$BODYCAST_SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$BODYCAST_KNOWN_HOSTS" -o ConnectTimeout=10)
          SCP=(scp -P "$SSH_PORT" -i "$BODYCAST_SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$BODYCAST_KNOWN_HOSTS")
          COMMON="BODYCAST_DEPLOY_PATH='$DEPLOY_PATH' BODYCAST_RECOVERY_SHA='$RECOVERY_SHA' BODYCAST_EXPECTED_APP_SHA='f910d2a45dfa676fada5fab42c9e8946c97872b1' BODYCAST_OWNER_RUN_ID='$GITHUB_RUN_ID' BODYCAST_WORKFLOW_SHA='$GITHUB_SHA' BODYCAST_WORKFLOW_ATTEMPT='$GITHUB_RUN_ATTEMPT' BODYCAST_IMAGE_ID='$IMAGE_ID' BODYCAST_IMAGE_DIGEST='$IMAGE_DIGEST' BODYCAST_IMAGE_ARCHIVE_SHA256='$ARCHIVE_SHA' BODYCAST_HOST_SCRIPT_SHA256='$HOST_SCRIPT_SHA' BODYCAST_HEADROOM_SCRIPT='$artifact_dir/headroom.mjs' BODYCAST_HEADROOM_SCRIPT_SHA256='$HEADROOM_SCRIPT_SHA' BODYCAST_SCHEMA_DIGEST_SCRIPT='$artifact_dir/schema-digest.mjs' BODYCAST_SCHEMA_DIGEST_HELPER_SHA256='$SCHEMA_DIGEST_HELPER_SHA256' BODYCAST_RECOVERY_HEADROOM_METRICS_JSON='$HEADROOM_METRICS_JSON' BODYCAST_IMAGE_ARCHIVE='$artifact_dir/image.tar'"
          timeout 15m "${SSH[@]}" "$SSH_USER@$SSH_HOST" "$COMMON bash '$artifact_dir/host.sh' preexecute" > "$RUNNER_TEMP/bodycast-v4-artifact/headroom-before-execute-transfer.json"
          "${SCP[@]}" "$RUNNER_TEMP/bodycast-v4-artifact/preflight.json" "$SSH_USER@$SSH_HOST:$artifact_dir/execute-preflight.json"
          REMOTE="$COMMON BODYCAST_PREFLIGHT_JSON_FILE='$artifact_dir/execute-preflight.json' bash '$artifact_dir/host.sh' execute"
          timeout 35m "${SSH[@]}" "$SSH_USER@$SSH_HOST" "$REMOTE"
      - name: Remove only temporary SSH key material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/bodycast-v4-ssh"
